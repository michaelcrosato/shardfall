# Shardfall unique items: a fixed name and base, fixed stat ranges (scaled to the item level
# like everything else) and often a power - a rule-bending effect. Powers are shared with the
# passive tree's keystones and monster affixes: one set of effects, many sources.
#
# base      an item base from items.toml (slot and look come from it)
# level     the lowest item level it can drop at
# mods      stat = [min, max] (flat stats grow with item level; percentages do not)
# power     kind and its two numbers `a` and `b` (see the list below)
# lore      flavour text
#
# Powers:
#   corpse_burst    a% chance on kill: the corpse explodes for b% of its life as fire (3 m)
#   frost_crits     critical strikes always freeze; a% more crit damage against frozen enemies
#   blood_magic     skills cost life instead of mana; a% of mana is added as life
#   execute         hits finish off non-boss enemies below a% life
#   fire_trail      dodging leaves burning ground for a s that burns for b% of weapon damage/s
#   orbit_blades    a spectral blades circle you, each hit deals b% of weapon damage
#   echo_strike     melee skills strike again a moment later for a% damage
#   dodge_reset     kills have a% chance to reset the dodge
#   storm_call      spells call lightning on a enemies near the target for b% of the spell
#   block_nova      blocking releases a frost nova (radius a m) for b% of weapon damage
#   ignite_aura     enemies within a m burn for b% of your maximum life per second
#   stand_firm      cannot be knocked back or stunned; a% less damage taken while casting
#   meteor_slam     slams and leaps call a meteor onto the impact for a% damage
#   frenzy          kills grant a% attack and movement speed for 4 s (stacks 3 times)
#   mana_shield     a% of damage taken is paid from mana first
#   quickening      kills take a s off every skill cooldown

[corpsefire_grips]
name = "Corpsefire Grips"
base = "leather_gloves"
level = 8
mods = { life = [20, 30], attack_speed = [6, 10], added_fire = [3, 6] }
power = { kind = "corpse_burst", a = 25, b = 30 }
