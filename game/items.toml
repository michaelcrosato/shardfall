# Shardfall item bases: what an item is before its affixes. Six tiers per kind; `level` is the
# item level from which a base can drop. Numbers here are at item level 1 and grow with item
# level (`items::base_scale`), so bases never run out: a level-200 Rusted Sword is still a
# sword, just a much sharper one. Higher tiers carry bigger implicits and finer looks.
# (Generated table - edit freely; keys are referenced by uniques.toml and saves.)
#
# slot       weapon | offhand | helmet | body | gloves | boots | belt | amulet | ring
# kind       weapons: sword axe mace dagger claw wand greatsword maul spear staff (the look and
#            how it swings); off-hands: shield focus; helmets: helm
# phys       weapon physical damage range; aps attacks per second; crit base crit chance (%)
# reach      melee reach multiplier; two_hand: uses both hands (no off-hand)
# armor      armour of armour pieces and shields; implicit: stats every copy has
# color      how it looks (weapon blade, armour tint); glow: enchanted shine
# look       helmets: cap helm great crown horned halo; body: vest mail scale plate plate_cape

