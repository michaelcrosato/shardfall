# Shardfall skills. Hero skills and monster attacks share one format, so any monster can be
# given any skill (procedural monsters cast Fireball too).
#
# behavior   melee | slam | leap | dash | projectile | nova | charge | channel | wave | buff |
#            meteor | field | blink | rain
# anim       slash | overhead | thrust | spin | cast | throw | roar | leap | lunge
# tags       attack / spell, melee, projectile, area, movement, + an element; damage bonuses
#            apply by tag ("increased Melee Damage", "increased Spell Damage", ...)
# time       seconds per use (attacks: at 1 attack per second; faster weapons and attack speed
#            shorten it; spells: cast speed)
# hit        when the hit lands, as a fraction of `time`
# effect     attacks: damage as a multiple of weapon (or monster) damage; spells: the
#            multiple a monster casting it deals (the hero's spells use `base`)
# base       spells: damage range at hero level 1 (grows with level)
# element    physical | fire | cold | lightning | poison
# range      melee reach / dash or leap distance / projectile range / AI trigger distance (m)
# angle      melee arc (degrees); radius: area (m); speed: projectile speed (m/s)
# ailment    base chance of the element's ailment (bleed, ignite, freeze, shock, poison)
# telegraph  monsters show a warning on the ground while winding up
# mana_gain  mana gained per enemy hit (basic attacks)
# duration   fields, buffs, monster channels (s); interval: channel pulse (s)
# chain      projectiles: extra enemies to chain to; count: projectiles / wave segments / drops
# delay      meteor fall time (s); scatter: rain area (m); buff: stats while a war cry lasts

