# The words players read, by id (AI Hub Languages v1, docs/LANGUAGES.md). The web page
# carries these, with the lines made from the other files in game/ (item, skill and monster
# names...: crates/pav_core/src/arpg/lines.rs), as its game-lines block; `pav lines` prints it.
#
# - Ids: lowercase words joined by dots, saying where the line is used. Keep an id once the
#   game is published: translations are filed under it.
# - Whole sentences with {blanks}: "{count} potions", never "you have " + n + " potions".
#   {count} picks a plural form (one, other...); {key:action} is filled with the key or
#   button for the action on the device in use.
# - [notes]: who speaks a line, to whom, where it shows. [max]: the width of a tight line.
# - Developer text that shows in the game goes under ids starting with "dev.".

language = "en"
names = [
    "Shardfall", "Pavilion", "Emberwatch", "Hilda", "Odo", "Wren", "Wanderer", "Kestrel", "Ysolde",
    "Hollow King", "Cinder Wyrm", "Menagerie", "AI Hub",
]
brief = """
Shardfall is a fast hack-and-slash action RPG: the player takes a hero from the town of Emberwatch down through levels of a shattered underworld, the Depths, fighting monsters, picking up loot and growing a passive skill tree. The tone is classic dark fantasy with a light touch: short, punchy lines, a little dry humour from the townsfolk, never grim for its own sake.

The player character is one of three heroes the player chooses: Wanderer (a sellsword, a man), Kestrel (a brawler, a woman) and Ysolde (a stormcaller, a woman). Most lines address the player directly and don't depend on which hero they play; address the player with the familiar form of "you" where a language has one, as games usually do.

Townsfolk: Hilda the smith (gruff, practical), Odo the gambler (a smooth talker), Mother Wren the alchemist (motherly, calls the player "dear"). They speak short barks over their heads.

Shardfall is built on Pavilion, an engine made for AI agents. The title screen and pause menu offer its tools (studios for animation, objects and creatures, a tour of the engine's demo rooms). Those tool names are product names, like app names: translate the descriptive words around them ("Studio", "tour") naturally.

Item names are built from parts: a magic item is "{prefix} {base} {suffix}" (item.name.magic), and affix words (affix.*) are written to sit before or after the base's name; reorder or reword the joining line freely. Modifier lines (stat.*) are game terms ("increased", "more", "Life", "Mana"): keep them consistent across the whole game.
"""

