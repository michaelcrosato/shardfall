# Shardfall item affixes. Magic items get up to one prefix and one suffix, rares three of
# each. A tier is [item level, min, max]: items roll from the tiers their level reaches (the
# best ones less often). Past the last tier, values keep growing by `grow` per item level, so
# loot scales forever (`grow = 0` caps the affix: percent stats stay sane).
#
# kind      prefix | suffix
# stat      the stat it adds (see arpg/stats.rs for every stat and how it reads)
# names     the magic-item name part, one per tier (the last is reused for higher tiers)
# slots     where it can roll: weapon kinds (sword axe ... staff), "weapon" (all weapons),
#           offhand, shield, focus, helmet, body, gloves, boots, belt, amulet, ring
# weight    how common it is (default 100)
# local     changes the item itself instead of the hero: weapon damage, attack speed and
#           crit chance, or the armour of an armour piece

# ---------------------------------------------------------------- prefixes

[life]
kind = "prefix"
stat = "life"
names = ["Healthy", "Sanguine", "Stalwart", "Robust", "Vigorous", "Undying"]
slots = ["helmet", "body", "gloves", "boots", "belt", "amulet", "ring", "shield"]
tiers = [[1, 8, 14], [10, 13, 21], [22, 20, 31], [38, 32, 45], [55, 50, 67], [75, 80, 99]]
grow = 0.012
weight = 140

