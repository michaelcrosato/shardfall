# Shardfall monster families: the hand-made base of the monster vocabulary. The genome
# generator (endless levels) mixes these body plans, looks, archetypes and skills.
#
# body       biped | spider | lizard | beetle | blob (the puppet skeleton)
# archetype  melee (close in and hit) | ranged (keep distance, strafe, shoot) | charger
#            (close in, then charge through)
# skills     keys from skills.toml; the brain picks whichever is ready and in range
# life / damage / speed / xp   multipliers on the level's base values
# look       any puppet setting over the body plan's preset (colours, proportions, weapon)

[ghoul]
name = "Ghoul"
body = "biped"
archetype = "melee"
skills = ["claw"]
speed = 1.05
look = { skin = "#9aa883", shirt = "#3e4a33", pants = "#2a3024", shoes = "#1d211a", eyes = "#ffe066", lean = 1.6, arm_swing = 1.2, head_radius = 0.19 }

