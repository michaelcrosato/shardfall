# Level themes: how a level looks and which monsters live there. The level generator builds
# rooms and corridors and paints them with a theme; endless depths pick themes in turn.
#
# floor / wall / pillar / accent    colours (floor tiles alternate between the two floor colours)
# light      colour of the wall sconces; light_every: metres of wall between two sconces
# sky / sun / sun_angle / ambient   the level's mood (sun 0 = dark, only lamps)
# particles  ambience drifting about (embers, snow, fireflies, dust, magic, spores...)
# haze / halos   hazy air (volumetric light: sunbeams, dark shafts) and how much the lamps glow in it
# grass      colour of grass / weed / seaweed patches on the floor (sways, parts around walkers; "" = none)
# elements   how likely each element is for its creatures [physical, fire, cold, lightning, poison]
# families   designed families that live here (the rest are grown from genomes)
# props      decorations: rocks, crystals, bones, mushrooms, columns, crates

[ashen_halls]
name = "Ashen Halls"
floor = ["#4a3f3a", "#433834"]
wall = "#5a4a44"
pillar = "#6a5850"
accent = "#ff7a2a"
light = "#ff8a3a"
light_every = 10
sky = "#1a1210"
sun = 0.35
sun_angle = 30
ambient = 0.35
particles = "embers"
haze = 0.5
halos = 1.0
elements = [1, 4, 0.5, 0.5, 0.5]
families = ["ghoul", "ashdrake", "bonecrusher"]
props = ["rocks", "bones", "crates"]

