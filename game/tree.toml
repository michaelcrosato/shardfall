# ------------------------------------------------------------------------- skill branches
# Three nodes per skill, in order along the branch.
[skill.slash]
nodes = [{ name = "Keen Edge", tweaks = { damage = 25 } }, { name = "Flurry", tweaks = { speed = 15 } }, { name = "Bleeding Cuts", tweaks = { ailment = 30 } }]
[skill.cleave]
nodes = [{ name = "Wide Arc", tweaks = { radius = 20 } }, { name = "Executioner's Swing", tweaks = { damage = 30 } }, { name = "Flame Edge", tweaks = { element = 1, damage = 10 } }]
[skill.leap_slam]
nodes = [{ name = "Shockwave", tweaks = { radius = 25 } }, { name = "Spring", tweaks = { cooldown = 30 } }, { name = "Crater", tweaks = { damage = 35 } }]
[skill.blade_dash]
