# Shardfall passive tree. The tree is *generated* from these pieces, so it is easy to grow:
# six sectors around a start point; in each a road of seven nodes outward with notables, three
# wheel clusters (a ring of nodes around a mastery), three skill branches (tweaks for one
# skill each), a keystone at the end; bridges join neighbouring sectors (with their own
# keystone) so builds can mix; and past the keystones the endless Astral rings go on forever,
# their stats growing ring by ring.
#
# Every stat key is a stat from arpg/stats.rs; powers are arpg/powers.rs kinds; skill tweaks
# are damage count radius cooldown cost pierce chain ailment duration speed range knockback
# element (see arpg/skills.rs). Node ids are hashes of their place in the layout, so adding
# sectors or notables does not move what a saved hero allocated elsewhere.

[layout]
# Road: radius of the first level, spacing between levels; lanes' angle off the road
# (degrees); wheels' size (tree units).
base = 3.0
step = 1.6
lane = 18.0
wheel_radius = 1.15
# The Astral rings: where they start (tree units), spacing, node spacing, how many are built,
# and how fast their stats grow per ring.
endless_start = 19.5
endless_step = 1.3
endless_spacing = 1.6
endless_rings = 30
endless_growth = 0.1

# ------------------------------------------------------------------------------- sectors
