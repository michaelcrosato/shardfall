# ----------------------------------------------------------------------------- masteries
# A mastery sits inside each wheel: allocate it, then pick one of its options. Each option
# can be taken once per sector.
[mastery.might]
name = "Might Mastery"
options = [
    { name = "Vitality", stats = { life_inc = 10 } },
    { name = "Heavy Hands", stats = { melee_inc = 25 } },
    { name = "Bloodletting", stats = { life_on_kill = 12 } },
    { name = "Weapon Master", stats = { melee_levels = 1 } },
]
[mastery.fury]
name = "Fury Mastery"
options = [
    { name = "Haste", stats = { attack_speed = 10 } },
    { name = "Executioner", power = { kind = "execute", a = 10 } },
    { name = "Lacerate", stats = { bleed_chance = 25 } },
