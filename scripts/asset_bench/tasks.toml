# Asset benchmark tasks (docs/ASSET_SYSTEM_PLAN.md §10.1). Frozen in Phase 0: every gate compares
# an arm's runs with arm A's runs of these exact briefs, so change a task only with a decision
# recorded in docs/HISTORY.md, and never rename one after a library leaf (tests/bench_holdout.rs).
#
# size: width x height x depth in cm (x, y, z); tol: allowed relative error per axis.
# needs: light (gives off light), hang (origin at the hook, everything below it), wall (origin on
#   the wall, the object extends toward +z), sockets (checked only where the arm can express them).
# cap: [engine commands, images] for one run (default [30, 6]).
# from: the task whose asset an edit task starts from (the same arm's own run).

