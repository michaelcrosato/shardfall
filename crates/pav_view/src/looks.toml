# Presets for the Look & Filters menu (and the `look` agent tool).
#
# [[preset]]  one filter's settings: `section` is pixel, shading, outlines, stylize, palette,
#             grading, scanlines, grain, screen, glow or air; `set` holds view paths (as in `pav params
#             prefix=view`, without `view.`) and only paths of that section. A filter preset
#             never changes which part of the scene the filter is on (the *_on / *_target keys),
#             so picking "Chunky" keeps pixel art on the characters if that is where it was.
# [[look]]    a whole look: it switches on every section it names a path of (starting from the
#             defaults) and switches the others off, so the scene's own settings show there.
#
# Parts of the scene: "all", "objects" (characters and objects: anything that moves, fights or
# can be picked up) and "environment" (level geometry, fixed scenery, the sky).

