<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shardfall</title>
<meta name="description" content="Play Shardfall, a procedural hack-and-slash adventure with an interactive tech demo pavilion.">
<meta name="theme-color" content="#15171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:,">
<style>
  /* The page is the game: no scrolling, zooming, text selection, callouts or tap flashes. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; overscroll-behavior: none;
               touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
               -webkit-tap-highlight-color: transparent; }
  /* winit appends the game canvas to <body>; it fills the page and the game follows its size.
     dvh: the height that is visible while a phone's browser bars come and go. */
  canvas { display: block; width: 100vw !important; height: 100vh !important; height: 100dvh !important;
           outline: none; touch-action: none; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         font: 18px system-ui, sans-serif; color: #c9ccd4; text-align: center; padding: 24px; pointer-events: none; }
  /* Phones held upright: a hint to turn sideways that fades by itself. */
  #turn { display: none; position: fixed; left: 50%; top: 12px; transform: translateX(-50%); padding: 8px 14px;
          border-radius: 18px; background: rgba(0, 0, 0, 0.6); color: #ffd690; font: 14px system-ui, sans-serif;
          pointer-events: none; animation: fade 1s 5s forwards; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: block; } }
  @keyframes fade { to { opacity: 0; } }
</style>
</head>
<body>
<div id="msg" role="status" aria-live="polite">Loading Shardfall…</div>
<div id="turn">Turn your phone sideways for the best view</div>
<script type="module">
  // Start in a demo room with ?room=NAME, or the pavilion with ?scene=world.
  const msg = document.getElementById('msg');
  if (!navigator.gpu) {
    msg.innerHTML = 'Shardfall needs WebGPU.<br>Use a recent Chrome, Edge or Safari (iOS 26 or later) with hardware acceleration enabled.';
  } else {
    // The game hides this message once its canvas exists, and takes keyboard focus.
    new MutationObserver((_, obs) => {
      const c = document.querySelector('canvas');
      if (c) { c.setAttribute('aria-label', 'Shardfall game'); msg.remove(); c.focus(); obs.disconnect(); }
    }).observe(document.body, { childList: true });
    // Phones and tablets: the first tap goes full screen and turns sideways, where the browser
    // allows it (Android; an iPhone keeps its bars, or plays full screen from the home screen).
    if (matchMedia('(pointer: coarse)').matches) {
      addEventListener('pointerup', () => {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          el.requestFullscreen({ navigationUI: 'hide' })
            .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
            .catch(() => {});
        }
      }, { once: true, capture: true });
    }
    try {
      const game = await import('./shardfall.js');
      await game.default();
    } catch (error) {
      console.error('Shardfall failed to load:', error);
      msg.textContent = 'Shardfall could not load. Please reload the page. If it still fails, check that WebGPU and hardware acceleration are enabled.';
      document.body.append(msg);
    }
  }
</script>
</body>
</html>
