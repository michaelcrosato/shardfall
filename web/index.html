<style>
  /* The page is the game: no scrolling, zooming, text selection, callouts or tap flashes. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; overscroll-behavior: none;
               touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
               -webkit-tap-highlight-color: transparent; }
  /* winit appends the game canvas to <body>; it fills the page and the game follows its size.
     dvh: the height that is visible while a phone's browser bars come and go. */
  canvas { display: block; width: 100vw !important; height: 100vh !important; height: 100dvh !important;
           outline: none; touch-action: none; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         font: 18px system-ui, sans-serif; color: #c9ccd4; text-align: center; padding: 24px; pointer-events: none; }

<body>
<div id="msg" role="status" aria-live="polite"></div>
<script id="shout-detector">
  // Shout to roar's ear: arithmetic on samples, no audio and no page (the bridge below feeds it
  // what the microphone hears; scripts/shout_check.mjs runs it in Node on made-up sounds). It
  // weighs BLOCK-second blocks: their power (RMS squared, of 1) and how voiced they are (how well
  // a block repeats itself at a pitch period of 2-14 ms, 0 to 1: a vowel or a note does, noise
  // doesn't).
  // - A shout is HOLD seconds of blocks in a row that are loud, voiced (VOICED or more) and
  //   steady (none under STEADY times the loudest, in RMS): a held vowel, where a clap or a
  //   syllable of talk is shorter, a cough falls away, a laugh comes in "ha"s and a breath is
  //   noise. It counts if REST seconds have passed since the last one; the first WARM seconds
  //   only listen, and while muted (the DualSense's mute button) nothing counts or is learned.
  // - Loud: over the bar, FLOOR RMS (a shout into any microphone is louder; a quiet room or the
  //   game's sound through the speakers isn't) or RATIO times the RANK quantile of either of
  //   two rings, if that is more:
  //   - now: every block of the NOW seconds before the last HOLD. Sound that goes on (music, a
  //     louder voice) raises the bar within a second; a shout can't raise its own.
  //   - talk: the last TALK seconds of voice: voiced blocks OVER times the QUIET quantile of
  //     "now" or more (over the room, a hum, a steady music bed), but those of a stretch held
  //     over the bar it began at for HOLD (a shout, an "aaah", a note as music starts) and HOLD
  //     either side of one. Silence, noise and a steady background don't move it, so a pause,
  //     however long, leaves it where the talk left it (a radio, voiced and with gaps, counts as
  //     voice: over one, a pause longer than TALK can), and a shout doesn't raise the bar for
  //     the next.
  //   (`tune` overrides any of these, for checks.)
  window.shoutDetector = (rate, tune = {}) => {
    const { BLOCK = 0.02, HOLD = 0.25, VOICED = 0.5, STEADY = 0.5, REST = 1.5, WARM = 1.5 } = tune;
    const { FLOOR = 0.05, RATIO = 1.6, RANK = 0.9, NOW = 3, TALK = 15, QUIET = 0.1, OVER = 3 } = tune;
    const size = Math.max(1, Math.round(BLOCK * rate)), dt = size / rate;
    const blocks = (seconds) => Math.max(1, Math.round(seconds / dt));
    const hold = blocks(HOLD), warm = blocks(WARM);
    // The block's samples, summed in threes or so (16 kHz), and how voiced they are: the best
    // correlation of the block (less its mean: a microphone's offset isn't a pitch; `e`, its
    // running energy) with itself shifted by a pitch period (70-500 Hz).
    const skip = Math.max(1, Math.round(rate / 16000)), m = Math.floor(size / skip), x = new Float64Array(m);
    const lag0 = Math.round(rate / skip / 500), lag1 = Math.min(m - 8, Math.round(rate / skip / 70));
    const e = new Float64Array(m + 1);
    const voicing = () => {
      let mean = 0;
      for (let i = 0; i < m; i++) mean += x[i] / m;
      for (let i = 0; i < m; i++) {
        x[i] -= mean;
        e[i + 1] = e[i] + x[i] * x[i];
      }
      let best = 0;
      for (let lag = lag0; lag <= lag1; lag++) {
        let xy = 0;
        for (let i = 0; i + lag < m; i++) xy += x[i] * x[i + lag];
        const xx = e[m - lag], yy = e[m] - e[lag];
        if (xy > 0 && xy * xy > best * best * xx * yy) best = xy / Math.sqrt(xx * yy);
      }
      return best;
    };
    // The last 2 HOLD of blocks (power, voicing, whether it is out of the talk ring), newest
    // at `at - 1`; the rings, each with its quantile.
    const D = 2 * hold, power = new Float64Array(D), voiced = new Float64Array(D), out = new Uint8Array(D);
    const ring = (n) => ({ v: new Float64Array(n), sorted: new Float64Array(n), at: 0, len: 0, q: 0, quiet: 0 });
    const now = ring(blocks(NOW)), talk = ring(blocks(TALK));
    const learn = (r, p) => {
      r.v[r.at] = p;
      r.at = (r.at + 1) % r.v.length;
      r.len = Math.min(r.len + 1, r.v.length);
      const v = r.sorted.subarray(0, r.len);
      v.set(r.v.subarray(0, r.len));
      v.sort();
      r.q = v[Math.floor(RANK * r.len)];
      r.quiet = v[Math.floor(QUIET * r.len)];
    };
    const s = { acc: 0, n: 0, seen: 0, at: 0, run: 0, over: 0, ref: 0, mark: 0, until: -Infinity };
    const bar = () => Math.max(FLOOR * FLOOR, RATIO * RATIO * Math.max(now.q, talk.q));
    const back = (k) => (s.at - 1 - k + D) % D;
    // One block's power p, ending at time t: whether a shout counts with it.
    const step = (p, t, muted) => {
      if (muted) {
        s.run = s.over = 0;
        return false;
      }
      const b = bar();
      // The block leaving (2 HOLD old) joins the talk ring if it is voice.
      if (s.seen >= D && !out[s.at] && voiced[s.at] >= VOICED && power[s.at] >= OVER * OVER * now.quiet) learn(talk, power[s.at]);
      power[s.at] = p;
      voiced[s.at] = voicing();
      out[s.at] = s.mark > 0 ? 1 : 0;
      s.at = (s.at + 1) % D;
      if (s.mark > 0) s.mark--;
      // A stretch over the bar it began at: held for HOLD, it and HOLD either side stay out.
      if (p >= (s.over ? s.ref : b)) {
        if (!s.over++) s.ref = b;
      } else s.over = 0;
      if (s.over >= hold) {
        out.fill(1);
        s.mark = hold;
      }
      // The block HOLD old joins "now".
      if (s.seen >= hold) learn(now, power[back(hold)]);
      s.run = p >= b ? s.run + 1 : 0;
      if (s.seen++ < warm || s.run < hold || t < s.until) return false;
      let lo = Infinity, hi = 0;
      for (let k = 0; k < hold; k++) {
        if (voiced[back(k)] < VOICED) return false;
        lo = Math.min(lo, power[back(k)]);
        hi = Math.max(hi, power[back(k)]);
      }
      if (lo < STEADY * STEADY * hi) return false;
      s.until = t + REST;
      return true;
    };
    return {
      // Samples buf[from..to), the last of them at time `end` (seconds): the time of a shout
      // among them, or null. A block may span calls.
      feed(buf, from, to, end, muted) {
        let heard = null;
        for (let i = from; i < to; i++) {
          const v = buf[i], k = Math.floor(s.n / skip);
          s.acc += v * v;
          if (k < m) x[k] = s.n % skip ? x[k] + v : v;
          if (++s.n < size) continue;
          const p = s.acc / s.n, t = end - (to - 1 - i) / rate;
          s.acc = s.n = 0;
          if (step(p, t, muted)) heard = t;
        }
        return heard;
      },
      // Samples were lost (a look longer than the analyser holds): the block and the stretch
      // start over.
      gap() { s.acc = s.n = s.run = s.over = 0; },
      // For checks: the levels' RMS now (the louder, and each) and the bar's.
      get level() { return Math.sqrt(Math.max(now.q, talk.q)); },
      get levels() { return { now: Math.sqrt(now.q), talk: Math.sqrt(talk.q) }; },
      get threshold() { return Math.sqrt(bar()); },
    };
  };
</script>
<script>
  // The page's own words, before the game runs: lines from the game-lines block (and a
  // translation's, when the page has one for ?lang= or the browser's language). The game
  // itself draws every other line (AI Hub Languages v1, docs/LANGUAGES.md).
  window.pageLine = (() => {
    const block = (id) => { try { return JSON.parse(document.getElementById(id).textContent); } catch { return null; } };
    const own = block('game-lines') || { lines: {} }, tr = block('game-translations') || {};
    const asked = new URLSearchParams(location.search).get('lang');
    const want = [asked, ...(navigator.languages || [])].filter(Boolean);
    const code = want.find((w) => tr[w]) || want.map((w) => Object.keys(tr).find((k) => k.split('-')[0] === w.split('-')[0])).find(Boolean);
    const lines = (code && tr[code] && tr[code].lines) || {};
    return (id, fallback, values = {}) => {
      const line = [lines[id], own.lines[id], fallback].find((l) => typeof l === 'string' && l !== '');
      return line.replace(/\{(\w+)\}/g, (tag, k) => (k in values ? String(values[k]) : tag));
    };
  })();

  // Any controller: a pad the browser leaves unmapped (mapping '', a generic DirectInput pad) is
  // read in the standard mapping's order (face, shoulders, triggers, select and start, sticks),
  // its hat switch (an axis: 9 in Chrome) as the D-pad, so it plays as a mapped pad does; a
  // mapped pad passes as it is. (In 52in1 this wraps the hub's own reading, which stays.)
  (() => {
    const raw = navigator.getGamepads && navigator.getGamepads.bind(navigator);
    if (!raw) return;
    const hats = {};
    const off = { pressed: false, touched: false, value: 0 };
    const asStandard = (p) => {
      const buttons = Array.from({ length: 17 }, (_, i) => p.buttons[i] || off);
      let hat = p.axes.length >= 10 ? 9 : hats[p.id];
      if (hat === undefined) {
        // A hat rests outside -1..1: the first axis seen there is it.
        const at = p.axes.findIndex((v, i) => i >= 4 && Math.abs(v) > 1.05);
        if (at >= 0) hat = hats[p.id] = at;
      }
      if (hat !== undefined && hat < p.axes.length) {
        const v = p.axes[hat];
        // Eight directions from -1 (up) clockwise in steps of 2/7; past 1, centred.
        const dir = Math.abs(v) > 1.05 ? -1 : Math.round((v + 1) * 3.5) % 8;
        const on = (set) => (set.includes(dir) ? { pressed: true, touched: true, value: 1 } : off);
        buttons[12] = on([7, 0, 1]);
        buttons[13] = on([3, 4, 5]);
        buttons[14] = on([5, 6, 7]);
        buttons[15] = on([1, 2, 3]);
      }
      return { id: p.id, index: p.index, connected: p.connected, timestamp: p.timestamp, mapping: 'standard',
               axes: Array.from(p.axes).slice(0, 4), buttons, vibrationActuator: p.vibrationActuator };
    };
    Object.defineProperty(navigator, 'getGamepads', {
      configurable: true,
      value: () => Array.from(raw(), (p) => (p && p.mapping !== 'standard' ? asStandard(p) : p)),
    });
  })();

  // 52in1 sessions (AI Hub Session Protocol v1, docs/AI_HUB.md). With the session client in the
  // page (the hub's build) and the hub's frame around it, this joins the round at once, keeps
  // the hub's events for the game, and hands the game the client's calls. Elsewhere it does
  // nothing. It also hands the game the player's 52in1 settings (window.AIHubSettings), which
  // the hub gives every game it opens, in a session or not.
  (() => {
    const hub = window.AIHub;
    const bridge = { active: !!(hub && hub.active), info: null, waiting: false, events: [], score: 0, won: false,
                     reported: false, settingsChanged: false, roars: 0 };
    const tag = (n) => (document.querySelector(`meta[name="${n}"]`) || {}).content;
    if (bridge.active) {
      const seats = (tag('hub:session-players') || '1-4').split('-').map(Number);
      // Every online mode the page names in hub:multiplayer (the hub picks one each round), else
      // its one session mode.
      const online = ['parallel', 'ghost', 'shared-world', 'moments'];
      const named = (tag('hub:multiplayer') || '').split(',').map((w) => w.trim().split(/\s+/)[0]);
      const modes = online.filter((m) => named.includes(m));
      const mode = modes.length > 1 ? modes : modes[0] || tag('hub:session-mode');
      bridge.waiting = true;
      hub.connect({ mode, seats: [seats[0], seats[1] || seats[0]] }).then((info) => {
        bridge.waiting = false;
        bridge.info = info;
        if (!info) bridge.active = false;
      });
      for (const type of ['start', 'message', 'leave', 'time-up', 'end']) {
        hub.on(type, (...args) => { bridge.events.push(JSON.stringify({ type, args })); });
      }
      // A safety net for a slow frame: if the game hasn't reported soon after time is up, the
      // page reports its last known standing (the hub gives graceMs).
      hub.on('time-up', ({ graceMs }) => setTimeout(() => {
        if (bridge.reported || !bridge.info) return;
        if (bridge.info.mode === 'parallel' || bridge.info.mode === 'ghost' || bridge.info.mode === 'race') {
          bridge.result(JSON.stringify({ score: bridge.score }));
        } else if (bridge.info.mode === 'moments') {
          bridge.result(JSON.stringify({ won: bridge.won, time: Math.max(0, hub.time()) }));
        } else if (bridge.info.isHost) {
          bridge.finish(JSON.stringify({ standings: [bridge.info.players.map((p) => p.id)], won: false }));
        }
      }, Math.min(2500, (graceMs || 5000) / 2)));
    }
    Object.assign(bridge, {
      isActive: () => bridge.active,
      isWaiting: () => bridge.waiting,
      infoJson: () => (bridge.info ? JSON.stringify(bridge.info) : ''),
      take: () => { const e = bridge.events; bridge.events = []; return '[' + e.join(',') + ']'; },
      ready: () => hub.ready(),
      time: () => hub.time(),
      send: (json, to, reliable) => hub.send(JSON.parse(json), { to: to >= 0 ? to : undefined, reliable }),
      progress: (score, label) => { bridge.score = score; hub.progress({ score, label }); },
      result: (json) => { bridge.reported = true; hub.result(JSON.parse(json)); },
      finish: (json) => { bridge.reported = true; hub.finish(JSON.parse(json)); },
      fail: (message) => { if (hub && hub.active) hub.fail(message); },
      momentStanding: (won) => { bridge.won = won; },
      // The player's 52in1 settings as JSON ('' outside 52in1), and whether they changed.
      settingsJson: () => {
        const s = window.AIHubSettings;
        if (!s) return '';
        const ds = s.dualsense || {};
        const flags = ['connected', 'lightbar', 'triggers', 'motion', 'touchpad', 'speaker', 'aim'];
        return JSON.stringify({
          music: s.music ?? 1, effects: s.effects ?? 1, vibration: s.vibration ?? 1,
          mic: !!s.mic, micLater: !!s.micLater, muted: !!s.muted,
          dualsense: Object.fromEntries(flags.map((f) => [f, !!ds[f]])),
        });
      },
      takeSettingsChanged: () => { const c = bridge.settingsChanged; bridge.settingsChanged = false; return c; },
      // The controller's extras (pad_fx.rs). Rumble on every pad that has it (52in1 scales it
      // by the player's vibration); the light bar and the triggers through 52in1 only, while the
      // player allows them; the game never opens the controller itself.
      rumble: (strong, weak, ms) => {
        for (const p of navigator.getGamepads ? navigator.getGamepads() : []) {
          if (p && p.connected && p.vibrationActuator && p.vibrationActuator.playEffect) {
            p.vibrationActuator.playEffect('dual-rumble', { startDelay: 0, duration: ms, strongMagnitude: strong, weakMagnitude: weak })
              .catch(() => {});
          }
        }
      },
      light: (color) => {
        const ds = window.AIHubSettings && window.AIHubSettings.dualsense;
        if (ds && ds.light) ds.light(color || null);
      },
      trigger: (which, effect) => {
        const ds = window.AIHubSettings && window.AIHubSettings.dualsense;
        if (ds && ds.trigger) ds.trigger(which, effect ? JSON.parse(effect) : null);
      },
      // Bit 0: the touchpad pressed since the last call (the standard mapping's button 17);
      // bits 1-2: a swipe across it, left (1) or right (2), from 52in1's DualSense touches.
      padExtra: () => {
        let out = 0;
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        const down = [...pads].some((p) => p && p.connected && p.mapping === 'standard' && p.buttons[17] && p.buttons[17].pressed);
        if (down && !bridge.touchpadDown) out |= 1;
        bridge.touchpadDown = down;
        const ds = window.AIHubSettings && window.AIHubSettings.dualsense;
        if (ds && ds.connected && ds.touchpad) {
          const t = (ds.touches || [])[0];
          if (t && !bridge.swipe) bridge.swipe = { x0: t.x, x: t.x };
          else if (t) bridge.swipe.x = t.x;
          else if (bridge.swipe) {
            const dx = bridge.swipe.x - bridge.swipe.x0;
            if (Math.abs(dx) > 0.3) out |= dx < 0 ? 2 : 4;
            bridge.swipe = null;
          }
        }
        return out;
      },
      // Motion aim (motion.rs): the DualSense's turn left (+) in degrees a second. The game
      // reads it every frame while its Motion aim is on, and only then: while it reads it, 52in1
      // leaves the right stick alone.
      gyroY: () => {
        const ds = window.AIHubSettings && window.AIHubSettings.dualsense;
        const g = ds && ds.connected && ds.motion ? ds.gyro : null;
        return g && Number.isFinite(g.y) ? g.y : 0;
      },
      // The controller's speaker (pad_fx.rs): a short cue synthesized into the node 52in1's
      // openSpeaker() gives in the page's own audio context, made on the first cue. With no
      // node (no DualSense on a cable, the microphone not allowed) nothing more plays: the
      // game's own sounds already do. The game calls it only while its Controller speaker
      // setting is on.
      speaker: (cue, volume) => {
        const ds = window.AIHubSettings && window.AIHubSettings.dualsense;
        if (!ds || !ds.connected || !ds.speaker || typeof ds.openSpeaker !== 'function' || !(volume > 0)) return;
        const sp = bridge.speakerOut || (bridge.speakerOut = { ctx: null, opening: null });
        if (!sp.ctx && !(sp.ctx = pageAudio())) return;
        if (!sp.opening) {
          sp.opening = Promise.resolve().then(() => ds.openSpeaker(sp.ctx)).then((node) => node || null, () => null);
        }
        sp.opening.then((node) => {
          if (!node) return;
          if (sp.ctx.state === 'suspended') sp.ctx.resume().catch(() => {});
          speakerCue(sp.ctx, node, cue, Math.min(1, volume));
        });
      },
      // Shout to roar (voice.rs), the game's voice feature. `on`: the game's Shout to roar is
      // on. While it is and the player's 52in1 settings allow games the microphone (`mic`), the
      // page asks 52in1's openMicrophone() once (never getUserMedia itself) and listens in its
      // own audio context; turned off, or the microphone taken back, it lets the stream go.
      // Returns whether a shout came since the last call: none while `muted` (the DualSense's
      // mute button), and nothing at all outside 52in1.
      shout: (on) => {
        const s = window.AIHubSettings;
        const want = !!(on && s && s.mic && typeof s.openMicrophone === 'function');
        if (want && !mic.want) micOpen(s);
        else if (!want && mic.want) micStop();
        micListen();
        const heard = mic.heard !== null && !(s && s.muted) && mic.an && mic.an.context.currentTime - mic.heard < 1;
        mic.heard = null;
        return !!heard;
      },
      // A shout cast War Cry (the game says so once it went off): counted for checks.
      roared: () => { bridge.roars++; },
      // For checks: the shouts the page heard, taken by the game or not (seconds since it began
      // listening, the last 50), and what its ear makes of the microphone now (RMS, of 1).
      shoutsHeard: [],
      hearing: () => (mic.ear ? { listening: mic.an.context.currentTime - mic.t0, level: mic.ear.level,
                                  threshold: mic.ear.threshold } : null),
    });
    // The page's own audio context (the speaker's cues, the microphone's listening), made the
    // first time one needs it. The browser lets it start after a click or key press.
    let audio = null;
    const pageAudio = () => {
      if (audio) return audio;
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      try { audio = new Ctx(); } catch { return null; }
      const wake = () => { if (audio.state === 'suspended') audio.resume().catch(() => {}); };
      for (const type of ['pointerdown', 'keydown']) addEventListener(type, wake, { capture: true, passive: true });
      return audio;
    };
    // Shout to roar's listening: the hub's stream into an analyser, and what came in since the
    // last look (a look every 30 ms and every frame; the analyser holds the last 0.7 s, so slow
    // frames lose nothing) into the ear (window.shoutDetector, above), which remembers how loud
    // this microphone gets without a shout and hears a shout well over that.
    const mic = { want: false, asking: false, gen: 0, stream: null, src: null, an: null, sink: null, buf: null,
                  timer: 0, at: 0, t0: 0, ear: null, heard: null };
    // 52in1 opens the microphone with the browser's own processing, gain control included (it
    // asks for `audio: true`), and Chrome won't turn gain control off on a track already open
    // (applyConstraints answers yes and leaves it on). Gain control lifts talk's loud syllables
    // to where a shout is and holds the shout down: measured on Chrome's capture of
    // scripts/make_voice_wav.py's voice, talk's loudest 1% of 20 ms blocks reached 0.22 RMS and a
    // shout's quietest tenth 0.20, where without it they were 0.10 and 0.16. So, once 52in1 has
    // given a stream (the player allowed the microphone, and 52in1 chose the device: a DualSense
    // on a cable, or the device's own), the same device is opened again with gain control off
    // (echo cancellation and noise suppression kept) and 52in1's stream is let go. If that
    // fails, 52in1's stream is kept as it is. (While 52in1 says muted, no shout counts: the
    // DualSense's mute button holds either way.)
    // (Chrome keeps one processing setup per open device: 52in1's stream is let go first, so the
    // device opens afresh with the new one; if that fails, 52in1 is asked again.)
    const withoutGainControl = async (stream, hub) => {
      const tr = stream && stream.getAudioTracks()[0];
      const set = tr && tr.getSettings ? tr.getSettings() : {};
      const md = navigator.mediaDevices;
      if (!tr || !set.autoGainControl || !md || !md.getUserMedia) return stream;
      const audio = { autoGainControl: false, echoCancellation: true, noiseSuppression: true };
      if (set.deviceId) audio.deviceId = { exact: set.deviceId };
      stream.getTracks().forEach((t) => t.stop());
      try {
        return await md.getUserMedia({ audio });
      } catch {
        try {
          return (await hub.openMicrophone()) || null;
        } catch {
          return null;
        }
      }
    };
    const micOpen = (s) => {
      mic.want = true;
      mic.asking = true;
      const gen = ++mic.gen;
      Promise.resolve().then(() => s.openMicrophone()).then((st) => st || null, () => null).then((st) => withoutGainControl(st, s)).then((stream) => {
        if (gen !== mic.gen) {
          // Turned off while 52in1 answered.
          if (stream) stream.getTracks().forEach((tr) => tr.stop());
          return;
        }
        mic.asking = false;
        const ctx = stream && pageAudio();
        if (!ctx) {
          if (stream) stream.getTracks().forEach((tr) => tr.stop());
          return;
        }
        try {
          mic.stream = stream;
          // A microphone that goes away (a DualSense unplugged) ends its track: let it go, and
          // the game's next frame asks again (the device's own microphone, now).
          for (const tr of stream.getAudioTracks()) {
            tr.addEventListener('ended', () => { if (mic.stream === stream) micStop(); });
          }
          mic.src = ctx.createMediaStreamSource(stream);
          mic.an = ctx.createAnalyser();
          mic.an.fftSize = 32768;
          // Into the speakers at no volume: a graph that ends nowhere may not run.
          mic.sink = ctx.createGain();
          mic.sink.gain.value = 0;
          mic.src.connect(mic.an).connect(mic.sink).connect(ctx.destination);
        } catch {
          micStop();
          mic.want = true;
          return;
        }
        if (ctx.state === 'suspended') ctx.resume().catch(() => {});
        mic.at = mic.t0 = ctx.currentTime;
        mic.ear = window.shoutDetector(ctx.sampleRate);
        mic.timer = setInterval(micListen, 30);
      });
    };
    const micStop = () => {
      mic.gen++;
      mic.want = false;
      mic.asking = false;
      clearInterval(mic.timer);
      for (const node of [mic.src, mic.an, mic.sink]) if (node) try { node.disconnect(); } catch { /* gone */ }
      if (mic.stream) mic.stream.getTracks().forEach((tr) => tr.stop());
      Object.assign(mic, { stream: null, src: null, an: null, sink: null, timer: 0, ear: null, heard: null });
    };
    const micListen = () => {
      const an = mic.an;
      if (!an || !mic.ear) return;
      const ctx = an.context, now = ctx.currentTime, size = an.fftSize;
      let fresh = Math.round((now - mic.at) * ctx.sampleRate);
      if (fresh <= 0) return;
      mic.at = now;
      if (fresh > size) {
        // Longer than the analyser holds: start over from what it has.
        fresh = size;
        mic.ear.gap();
      }
      if (!mic.buf || mic.buf.length !== size) mic.buf = new Float32Array(size);
      an.getFloatTimeDomainData(mic.buf);
      const muted = !!(window.AIHubSettings && window.AIHubSettings.muted);
      const at = mic.ear.feed(mic.buf, size - fresh, size, now, muted);
      if (at !== null) {
        mic.heard = now;
        bridge.shoutsHeard.push(Math.round((at - mic.t0) * 100) / 100);
        if (bridge.shoutsHeard.length > 50) bridge.shoutsHeard.shift();
      }
    };
    // The speaker's cues, made of tones and a little noise (no files): short and distinct, in
    // the range a controller's small speaker plays well.
    const speakerCue = (ctx, out, cue, volume) => {
      const t0 = ctx.currentTime + 0.01;
      const master = ctx.createGain();
      master.gain.value = 0.55 * volume;
      master.connect(out);
      const tone = (type, f0, f1, at, len, peak) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(f0, t0 + at);
        if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t0 + at + len);
        g.gain.setValueAtTime(0.0001, t0 + at);
        g.gain.exponentialRampToValueAtTime(peak, t0 + at + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + len);
        o.connect(g).connect(master);
        o.start(t0 + at);
        o.stop(t0 + at + len + 0.02);
      };
      const hiss = (at, len, peak) => {
        const n = Math.ceil(ctx.sampleRate * len), buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
        const src = ctx.createBufferSource(), hp = ctx.createBiquadFilter(), g = ctx.createGain();
        src.buffer = buf;
        hp.type = 'highpass';
        hp.frequency.value = 3000;
        g.gain.value = peak;
        src.connect(hp).connect(g).connect(master);
        src.start(t0 + at);
      };
      if (cue === 'potion') {
        // Three gulps, each a bubble rising.
        for (let i = 0; i < 3; i++) tone('sine', 380 + i * 40, 760 + i * 60, i * 0.09, 0.07, 0.9);
      } else if (cue === 'rare') {
        // A bright two-note chime.
        tone('triangle', 1319, 1319, 0, 0.16, 0.7);
        tone('triangle', 1976, 1976, 0.08, 0.22, 0.6);
      } else if (cue === 'unique') {
        // A rising arpeggio with a shimmer.
        [1047, 1319, 1568, 2093].forEach((f, i) => tone('triangle', f, f, i * 0.07, 0.24, 0.6));
        hiss(0.05, 0.35, 0.12);
      } else if (cue === 'level') {
        // A short fanfare that climbs and holds.
        [784, 1047, 1319].forEach((f, i) => tone('square', f, f, i * 0.09, 0.1, 0.22));
        tone('square', 1568, 1568, 0.27, 0.32, 0.26);
      }
      setTimeout(() => master.disconnect(), 1200);
    };
    if (window.AIHubSettings && window.AIHubSettings.addEventListener) {
      let speakerWas = !!(window.AIHubSettings.dualsense && window.AIHubSettings.dualsense.connected && window.AIHubSettings.dualsense.speaker);
      window.AIHubSettings.addEventListener('change', () => {
        bridge.settingsChanged = true;
        // The microphone taken back: its stream goes at once. One 52in1 didn't give (null) is
        // asked for again once the player's settings change.
        const ended = mic.stream && mic.stream.getAudioTracks().every((tr) => tr.readyState === 'ended');
        if (!window.AIHubSettings.mic || ended) {
          if (mic.want) micStop();
        } else if (mic.want && !mic.stream && !mic.asking) {
          mic.want = false;
        }
        const ds = window.AIHubSettings.dualsense;
        const speakerNow = !!(ds && ds.connected && ds.speaker);
        const out = bridge.speakerOut;
        if (out && out.opening) {
          if (speakerNow && !speakerWas) {
            // The speaker came back (a cable plugged in again, allowed again): ask for a fresh
            // node, the old one may lead nowhere now.
            out.opening = null;
          } else {
            // A speaker that wasn't there (no cable, no microphone yet) is asked for again.
            out.opening.then((node) => { if (!node) out.opening = null; });
          }
        }
        speakerWas = speakerNow;
      });
    }
    window.shardfallHub = bridge;
  })();
</script>
<script type="module">
  // Start in a demo room with ?room=NAME, or the pavilion with ?scene=world.
  // Messages name the game by the page's title (its name, before any tagline).
  const name = document.title.split(' — ')[0];
  const msg = document.getElementById('msg');
  msg.textContent = pageLine('page.loading', 'Loading {name}…', { name });
  if (!navigator.gpu) {
    msg.replaceChildren(pageLine('page.webgpu', '{name} needs WebGPU.', { name }), document.createElement('br'),
      pageLine('page.webgpu_help', 'Use a recent Chrome, Edge or Safari (iOS 26 or later) with hardware acceleration enabled.'));
    shardfallHub.fail('WebGPU is not available in this browser');
  } else {
    // The game hides this message once its canvas exists, and takes keyboard focus.
    new MutationObserver((_, obs) => {
      const c = document.querySelector('canvas');
      if (c) { c.setAttribute('aria-label', `${name} game`); msg.remove(); c.focus(); obs.disconnect(); }
    }).observe(document.body, { childList: true });
    // Phones and tablets: the first tap goes full screen, where the browser allows it (Android;
    // an iPhone keeps its bars, or plays full screen from the home screen). Upright or sideways
    // both play: the HUD and the camera follow the screen's shape.
    if (matchMedia('(pointer: coarse)').matches) {
      addEventListener('pointerup', () => {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
        }
      }, { once: true, capture: true });
    }
    try {
      // The game is shardfall.js and its .wasm beside this page. A single-file build
      // (scripts/pack_single_html.py) carries both inside the page and sets window.loadGame.
      if (window.loadGame) await window.loadGame();
      else await (await import('./shardfall.js')).default();
    } catch (error) {
      console.error(`${name} failed to load:`, error);
      msg.textContent = pageLine('page.failed', '{name} could not load. Please reload the page. If it still fails, check that WebGPU and hardware acceleration are enabled.', { name });
      document.body.append(msg);
      shardfallHub.fail(`the game failed to load: ${error}`);
    }
  }
</script>
