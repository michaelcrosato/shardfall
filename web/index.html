<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shardfall</title>
<meta name="description" content="Play Shardfall, a procedural hack-and-slash adventure with an interactive tech demo pavilion.">
<meta name="theme-color" content="#15171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:,">
<style>
  /* The page is the game: no scrolling, zooming, text selection, callouts or tap flashes. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15171c; overscroll-behavior: none;
               touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
               -webkit-tap-highlight-color: transparent; }
  /* winit appends the game canvas to <body>; it fills the page and the game follows its size.
     dvh: the height that is visible while a phone's browser bars come and go. */
  canvas { display: block; width: 100vw !important; height: 100vh !important; height: 100dvh !important;
           outline: none; touch-action: none; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         font: 18px system-ui, sans-serif; color: #c9ccd4; text-align: center; padding: 24px; pointer-events: none; }
  /* Phones held upright: a hint to turn sideways that fades by itself. */
  #turn { display: none; position: fixed; left: 50%; top: 12px; transform: translateX(-50%); padding: 8px 14px;
          border-radius: 18px; background: rgba(0, 0, 0, 0.6); color: #ffd690; font: 14px system-ui, sans-serif;
          pointer-events: none; animation: fade 1s 5s forwards; }
  @media (orientation: portrait) and (pointer: coarse) { #turn { display: block; } }
  @keyframes fade { to { opacity: 0; } }
</style>
</head>
<body>
<div id="msg" role="status" aria-live="polite"></div>
<div id="turn"></div>
<script>
  // The page's own words, before the game runs: lines from the game-lines block (and a
  // translation's, when the page has one for ?lang= or the browser's language). The game
  // itself draws every other line (AI Hub Languages v1, docs/LANGUAGES.md).
  window.pageLine = (() => {
    const block = (id) => { try { return JSON.parse(document.getElementById(id).textContent); } catch { return null; } };
    const own = block('game-lines') || { lines: {} }, tr = block('game-translations') || {};
    const asked = new URLSearchParams(location.search).get('lang');
    const want = [asked, ...(navigator.languages || [])].filter(Boolean);
    const code = want.find((w) => tr[w]) || want.map((w) => Object.keys(tr).find((k) => k.split('-')[0] === w.split('-')[0])).find(Boolean);
    const lines = (code && tr[code] && tr[code].lines) || {};
    return (id, fallback, values = {}) => {
      const line = [lines[id], own.lines[id], fallback].find((l) => typeof l === 'string' && l !== '');
      return line.replace(/\{(\w+)\}/g, (tag, k) => (k in values ? String(values[k]) : tag));
    };
  })();
  document.getElementById('turn').textContent = pageLine('page.turn', 'Turn your phone sideways for the best view');

  // AI Hub sessions (Session Protocol v1, docs/AI_HUB.md). With the session client in the page
  // (the hub's build) and the hub's frame around it, this joins the round at once, keeps the
  // hub's events for the game, and hands the game the client's calls. Elsewhere it does nothing.
  (() => {
    const hub = window.AIHub;
    const bridge = { active: !!(hub && hub.active), info: null, waiting: false, events: [] };
    const tag = (n) => (document.querySelector(`meta[name="${n}"]`) || {}).content;
    if (bridge.active) {
      const seats = (tag('hub:session-players') || '1-4').split('-').map(Number);
      bridge.waiting = true;
      hub.connect({ mode: tag('hub:session-mode'), seats: [seats[0], seats[1] || seats[0]] }).then((info) => {
        bridge.waiting = false;
        bridge.info = info;
        if (!info) bridge.active = false;
      });
      for (const type of ['start', 'message', 'leave', 'time-up', 'end']) {
        hub.on(type, (...args) => { bridge.events.push(JSON.stringify({ type, args })); });
      }
    }
    Object.assign(bridge, {
      isActive: () => bridge.active,
      isWaiting: () => bridge.waiting,
      infoJson: () => (bridge.info ? JSON.stringify(bridge.info) : ''),
      take: () => { const e = bridge.events; bridge.events = []; return '[' + e.join(',') + ']'; },
      ready: () => hub.ready(),
      time: () => hub.time(),
      send: (json, to, reliable) => hub.send(JSON.parse(json), { to: to >= 0 ? to : undefined, reliable }),
      progress: (score, label) => hub.progress({ score, label }),
      result: (json) => hub.result(JSON.parse(json)),
      finish: (json) => hub.finish(JSON.parse(json)),
      fail: (message) => { if (hub && hub.active) hub.fail(message); },
    });
    window.shardfallHub = bridge;
  })();
</script>
<script type="module">
  // Start in a demo room with ?room=NAME, or the pavilion with ?scene=world.
  // Messages name the game by the page's title (its name, before any tagline).
  const name = document.title.split(' — ')[0];
  const msg = document.getElementById('msg');
  msg.textContent = pageLine('page.loading', 'Loading {name}…', { name });
  if (!navigator.gpu) {
    msg.replaceChildren(pageLine('page.webgpu', '{name} needs WebGPU.', { name }), document.createElement('br'),
      pageLine('page.webgpu_help', 'Use a recent Chrome, Edge or Safari (iOS 26 or later) with hardware acceleration enabled.'));
    shardfallHub.fail('WebGPU is not available in this browser');
  } else {
    // The game hides this message once its canvas exists, and takes keyboard focus.
    new MutationObserver((_, obs) => {
      const c = document.querySelector('canvas');
      if (c) { c.setAttribute('aria-label', `${name} game`); msg.remove(); c.focus(); obs.disconnect(); }
    }).observe(document.body, { childList: true });
    // Phones and tablets: the first tap goes full screen and turns sideways, where the browser
    // allows it (Android; an iPhone keeps its bars, or plays full screen from the home screen).
    if (matchMedia('(pointer: coarse)').matches) {
      addEventListener('pointerup', () => {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          el.requestFullscreen({ navigationUI: 'hide' })
            .then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock('landscape'))
            .catch(() => {});
        }
      }, { once: true, capture: true });
    }
    try {
      // The game is shardfall.js and its .wasm beside this page. A single-file build
      // (scripts/pack_single_html.py) carries both inside the page and sets window.loadGame.
      if (window.loadGame) await window.loadGame();
      else await (await import('./shardfall.js')).default();
    } catch (error) {
      console.error(`${name} failed to load:`, error);
      msg.textContent = pageLine('page.failed', '{name} could not load. Please reload the page. If it still fails, check that WebGPU and hardware acceleration are enabled.', { name });
      document.body.append(msg);
      shardfallHub.fail(`the game failed to load: ${error}`);
    }
  }
</script>
</body>
</html>
