# Action moves: every attack, cast and gesture a puppet performs, as numbers instead of code.
# A skill names one (`anim = "overhead"` in game/skills.toml); townsfolk and tools use them too.
# Edit, then `anim_reload` in the REPL (or the running game) and `animsheet move=NAME` to look.
#
# How a move plays. Its progress runs 0..1 over the skill's own time, and the hit lands where the
# skill says; the move's three phases are stretched to fit around that moment:
#   wind     anticipation: the hand travels from wherever it was (the walk, or the last move's
#            end: chained attacks never snap) to the start of the arc; the body coils back.
#   active   the strike: the hand sweeps the arc from `from` to `to` (degrees) at `reach`, the
#            body lunges, leans, twists with the swing and may hop or spin.
#   recover  holds the end pose (`hold` of it), follows through a little, then eases back.
#   hit      the share of `active` where it connects (the skill's hit moment lines up with it).
#
# Fields (defaults in brackets):
#   name, about   what it is called and what it looks like (a model picks moves by `about`)
#   hand          right | left | both (two-handed grip) | pair (both hands, mirrored) | kick (the
#                 right foot)                                                        [right]
#   plane         ground: a level arc around the shoulders (0 = straight ahead, + = the right side);
#                 side: an up-and-down arc in front (0 = straight ahead, + = up)     [ground]
#   from, to      degrees along the arc                                              [0, 0]
#   height        [start, end] above the shoulders, in arm lengths (ground plane); kicks: shares of
#                 hip height above the ground                                        [-0.76]
#   reach         arm lengths from the shoulders (kicks: leg lengths); [start, end] extends a thrust
#                                                                                    [0.82]
#   wind, active, recover   seconds: the move's shape (the skill decides the real time)
#                                                                         [0.06, 0.10, 0.18]
#   hold          share of the recovery spent holding the end pose                   [0.3]
#   lunge, hop    metres the body steps into the strike and jumps (on a 1.8 m figure) [0.064, 0]
#   crouch        0..1 dip                                                           [0.15]
#   lean          radians forward lean through the strike (negative leans back)      [0.3]
#   twist         how much the torso turns with the swing angle                      [1]
#   spin          the whole body turns once during the strike                        [false]
#   trail         the held weapon draws a swing trail                                [true]
#   alt           the move played on alternate swings (a slash answered by a backslash)
#
# The first nine are the engine's original actions, in their original order.

