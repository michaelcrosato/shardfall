# Global Illumination: a screen-space APPROXIMATION of light bouncing around a scene. It is not ray
# traced: the post pass samples nearby visible pixels, so it only knows what is on screen. Two
# things come out of it: colour bleeding (a bright coloured surface tints its neighbours) and
# ambient occlusion (corners and contacts darken). `view.gi` = 0 off, 1 normal, 2 strong.
#   NORTH-WEST  Cornell box: red and green walls bleed onto white blocks, floor and back wall,
#               lit by a hanging lamp
#   NORTH-EAST  contact shadows: spheres, crates, drums and a stair resting on / against things
#   SOUTH       colour spill: a bright orange floor beside a white wall, a glowing strip beside another
#   MIDDLE      GI DIAL: three pads (OFF / ON / STRONG); the setting sticks until another pad or you leave
name = "Global Illumination"
about = "A screen-space approximation of bounced light: a Cornell box whose red and green walls tint the white blocks inside, contact shadows under everything that rests on something, and bright surfaces that spill their colour onto white walls. Not ray traced (it only sees what is on screen), but it grounds the scene; three pads switch it off, normal or strong."
try = [
  "Step on GI OFF, GI ON and GI STRONG in the middle: the setting sticks until you step on another pad or leave",
  "Walk into the Cornell box: with GI on, the floor and white balls get a faint pink wash next to the red wall and a green one next to the green wall",
  "Compare CONTACT SHADOWS at GI OFF and GI STRONG: the soft dark rings under spheres, crates and stair steps are occlusion",
  "Push the light crates and watch their dark ring follow them; climb the stair along the north wall",
  "Stand beside the white wall at the ORANGE FLOOR: its base and the white ball warm up when GI is on",
  "Check the GLOW STRIP: the white ball and wall pick up its cyan wash (the strip is not a light, only GI carries it)",
  "Right-drag to turn the camera: bleed shows best when you look along the coloured walls",
  "Throw a bomb (F) into the Cornell box and watch the flash and the shading react",
]
wing = "vfx"
order = 5
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [17, 27], facing = "south" }

[camera]
tilt = 55.0
distance = 22.0

# A dim room so the bounce light is what you notice. Lit style shows the smooth shading that GI
# adds to. gi = 1 here; the pads below set it (OFF 0, ON 1, STRONG 2) until you leave the room.
[view]
style = "lit"
gi = 1.0
bloom = 0.45
"light.sun_intensity" = 0.3
"light.ambient" = 0.5

[layout]
origin = [-18.0, 0.0, -14.0]

[[layout.layer]]
y = 0
map = '''
####################################
#.............................12345#
#..WWWWWWWWWW...pppppppppppppp12345#
#.wwwwwwwwwwww..ppppppppppppppppppp#
#.wwwwwwwwwwww..ppppppppppppppppppp#
#.wwwwwwwwwwww..ppppppppppppppppppp#
#.wwwwwwwwwwww..ppppppppppppppppppp#
#.wwwwwwwwwwww..ppppppppppppppppppp#
#.wwwwwwwwwwww..ppppppppppppppppppp#
#.wwwwwwwwwwww..pppppppppphhhhhhhhp#
#.wwwwwwwwwwww..ppppppppppppppppppp#
#.wwwwwwwwwwww..ppppppppppppppppppp#
#...............ppppppppppppppppppp#
#..................................#
#...........aaa.bbb.ccc............#
#...........aaa.bbb.ccc............#
#..................................#
#..................................#
#..VVVVVVVVVVVV.......VVVVVVVVVVVV.#
#...ooooooooooV.......ffffffffffff.#
#...ooooooooooV.......ffffffffffff.#
#...ooooooooooV.......ffffffffffff.#
#...ooooooooooV.......ffffffffffff.#
#..................................#
#..................................#
#..................................#
#..................................#
#################..#################
'''

