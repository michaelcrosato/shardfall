# Global Illumination: a screen-space APPROXIMATION of light bouncing around a scene. It is not ray
# traced: the post pass samples nearby visible pixels, so it only knows what is on screen. Two
# things come out of it: colour bleeding (a bright coloured surface tints its neighbours) and
# ambient occlusion (corners and contacts darken). `view.gi` = 0 off, 1 normal, 2 strong.
#   NORTH-WEST  Cornell box: red and green walls bleed onto white blocks, floor and back wall,
#               lit by a glowing ceiling lamp
#   NORTH-EAST  contact shadows: spheres, crates, drums and a stair resting on / against things
#   SOUTH       colour spill: a bright orange floor beside a white wall, an emissive strip beside another
#   MIDDLE      GI DIAL: three pads (OFF / ON / STRONG) you can stand on while looking at the rest
name = "Global Illumination"
about = "A screen-space approximation of bounced light: a Cornell box whose red and green walls tint the white blocks inside, contact shadows under everything that rests on something, and bright surfaces that spill their colour onto white walls. Not ray traced (it only sees what is on screen), but it grounds the scene; the pads switch it off, normal or strong."
try = [
  "Walk into the Cornell box and look at the white blocks: red tint on the west side, green on the east",
  "Stand on GI OFF, then GI ON, then GI STRONG and compare the box, the contacts and the spill",
  "Look under the spheres and crates in CONTACT SHADOWS: the dark rim is occlusion, not a light",
  "Push the crates (they are light) and watch their contact shadow follow them",
  "Climb the stair: each step darkens where it meets the next",
  "Stand next to the white wall at the ORANGE FLOOR: the orange spills onto its base",
  "Compare the glowing strip's cyan wash with the orange one; the glow is real emissive light",
  "Throw a bomb (F) into the Cornell box: the lamp keeps its bounce light while the walls hold",
]
wing = "vfx"
order = 5
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [17, 27], facing = "south" }

[camera]
tilt = 55.0
distance = 22.0

# A calm daylight-ish room so the bounce light is what you notice. Lit style shows the
# smooth shading that GI adds to; gi = 1 here, the pads below change it while you stand on them.
[view]
style = "lit"
gi = 1.0
bloom = 0.45
"light.sun_intensity" = 0.12
"light.ambient" = 0.4

[layout]
origin = [-18.0, 0.0, -14.0]

[[layout.layer]]
y = 0
map = '''
####################################
#.............................12345#
#..WWWWWWWWWW...pppppppppppppp12345#
#..RwwwwwwwwG...ppppppppppppppppppp#
#..RwwwwwwwwG...ppppppppppppppppppp#
#..RwwwwwwwwG...ppppppppppppppppppp#
#..RwwwwwwwwG...ppppppppppppppppppp#
#..RwwwwwwwwG...ppppppppppppppppppp#
#..RwwwwwwwwG...ppppppppppppppppppp#
#..RwwwwwwwwG...pppppppppphhhhhhhhp#
#..RwwwwwwwwG...ppppppppppppppppppp#
#..RwwwwwwwwG...ppppppppppppppppppp#
#...............ppppppppppppppppppp#
#..................................#
#...........aaa.bbb.ccc............#
#...........aaa.bbb.ccc............#
#..................................#
#..WWWWWWWWWWWW.......WWWWWWWWWWWW.#
#...ooooooooooW.......ffffffffffff.#
#...ooooooooooW.......ffffffffffff.#
#...ooooooooooW.......ffffffffffff.#
#...ooooooooooW.......ffffffffffff.#
#...ooooooooooW.......ffffffffffff.#
#..................................#
#..................................#
#..................................#
#..................................#
#################..#################
'''
# Floor, outer wall (3 m), then the Cornell box pieces, plates, wall pieces, stair steps and pads.
