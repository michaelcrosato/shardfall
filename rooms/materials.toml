#.................................RRR#
#.................................RRR#
#.................................RRR#
#....................................#
#....................................#
#.......DDD..........................#
#.......DDD..........................#
#....................................#
#....................................#
#....................................#
#....................................#
#..111..222..333.....................#
#..111..222..333.....................#
#..111..222..333.....................#
#....................................#
#....................................#
#....................................#
#....................................#
#..ffff.ffff..........ffffffffff.....#
#..f..f.f..f..........f..f..f..f.....#
#..f..f.f..f..........f..f..f..f.....#
#..f..f.f..f..........f..f..f..f.....#
#..f..f.f..f..........f..f..f..f.....#
#..f..f.f..f..........f..f..f..f.....#
#..f..f.f..f..........f..f..f..f.....#
#..f..f.f..f..........f..f..f..f.....#
##################..##################
'''

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }, { y0 = 0, y1 = 3.0, color = "#aeb7c2" }]

# Low fences: ramp run-out and the push lanes.
[layout.legend.'f']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }, { y0 = 0, y1 = 0.8, color = "#8f9fae" }]

# Pads.
[layout.legend.'D']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "DROP BALLS", color = "#2a8a57", signal = "drop" }

[layout.legend.'R']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "RESET BOXES", color = "#c9573a", label_size = 0.4, signal = "ramps" }

# Bounce pads: launch speed in m/s (the character falls at about 29 m/s^2, so heights are ~v^2/58).
[layout.legend.'1']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "bounce", speed = 10, label = "LOW", color = "#7ec8e3" }

[layout.legend.'2']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "bounce", speed = 15, label = "MID", color = "#f2c14e" }

[layout.legend.'3']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "bounce", speed = 22, label = "HIGH", color = "#c93c3c" }

