# Pads: stepping on one sends its signal once (the spawners below listen to them).
[layout.legend.'D']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "DROP BOXES", color = "#3bb273", signal = "boxes" }

[layout.legend.'C']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
