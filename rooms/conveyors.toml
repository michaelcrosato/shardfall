zone = { kind = "pad", label = "DROP BALLS", color = "#3bb273", signal = "balls" }

[layout.legend.'K']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "CLEAR", color = "#e07a5f", signal = "clear_balls" }

# UPSTREAM course: leaving START starts the timer, FINISH stops it.
[layout.legend.'S']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
