# Cinderwire: The Ash Exchange — mission 2. Wren sells a copy of the Helix Ledger
# through the broker Okonkwo. The buyer pays half up front. The buyer's other half
# is a kill team. Walk Pale the informant out, pick the HIGH road (quiet) or the LOW
# road (the Pit, loud, behind a timed seal), optionally work the Veil closet and the
# Adjudicator's cache, then run the exfil gates in order to THE GETAWAY.
# Twist on the north wall: MARA BOUGHT HER OWN NAME.
#
# New in this mission vs The Helix Ledger: a fresh map; a real branch (stealth duct
# lane vs combat pit); a kinematic timed seal door; a conveyor exfil boost; an
# always-on alarm state for the back half (one-way view shift); ordered exfil gates;
# an escort follower (Pale) plus Wisp's return; an optional boss pressuring the main
# path. Same promises: no fail state (checkpoints + clock), bypassable boss, score.
#
# Map key (40x30, rows 0-29 south = down):
#   # wall   s venue   S START   H/E loadouts   1/2/3 kiosks   c concrete
#   A alcove   ! alarm pad   K CP1   b high road   t tables   D duct
#   d low road   P pillar   X crates   J CP2   v the Veil   I/O jack in/out
#   x exfil/cache   o conveyor (north)   N CP3   4/5 gates 1/2   V THE GETAWAY
name = "Cinderwire: The Ash Exchange"
about = "Mission 2: sell the Ledger copy at the Exchange, survive the double-cross, walk Pale out. Pick the quiet HIGH road or the loud LOW road behind its timed seal, optionally loot the Veil closet and the Adjudicator's cache, then run the ordered exfil gates to the getaway. Twin-stick gunplay, stealth cones, checkpoints, score-as-nuyen."
try = [
  "Leave START to start the clock, then take ONE rig: GHOST (quiet steps) west, RONIN (rapid fire) east; Pale and Wisp walk out with you",
  "Work the BUYER, PRICE and EXIT kiosks (chip receipts), then head north through the concrete throat",
  "1 THE SETUP: a patrol and two sleeper guns (they only wake close); alcoves still break sight; the alarm pad turns the night red",
  "HIGH road (west): crouch the tables and the duct past the sentry; LOW road (east): the Pit, two guns and crates, through the timed seal — run the gap",
  "Side doors off the mid corridor: the VEIL closet pays datastores west (jack in/out), the ADJUDICATOR's cache pays east (three phases, optional, but it shoots at the corridor)",
  "4 EXFIL: cross the RUN gate, ride the conveyor walkway north, cross DON'T STOP, mind the sweeping eyes and the gate gun",
  "The Adjudicator is optional and so is the Veil: the clock and the score sort out loud, quiet, rich, and fast",
  "Walking back onto START restarts the run; F5 resets the room",
]
wing = "genre"
order = 6
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [18, 29], facing = "south" }
controls = [["Move", "W A S D"], ["Fire (hold, aims at cursor)", "F / left mouse / Space"], ["Crouch (hold, patrols see less)", "C / Ctrl"], ["Camera", "Right-drag · wheel"]]

[camera]
tilt = 70.0
distance = 27.0

# Venue night: warmer than Rain Street (amber deal-light), mild CRT whisper.
[view]
"light.sun_intensity" = 0.4
"light.ambient" = 0.65
"light.sun_elevation" = 45
