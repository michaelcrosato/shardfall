# Secondary Motion: things that trail behind the body. Tails and antennae are verlet chains that
# follow the body and bend back toward a rest direction (settings tail_length, antenna_length and
# wobble: 0 = stiff, 2 = very floppy). Any body plan can have them, bipeds too. Spiders get a
# jiggling abdomen and lizards drag a follow-the-leader spine.
#   NORTH-WEST  WOBBLE DIAL: three bipeds run the same stop-and-go square at wobble 0.2 / 1.0 / 2.0
#   NORTH-EAST  TAIL LENGTHS: three lizards on patrol, tails 0.4 / 1.2 / 2.2
#   MIDDLE-WEST ANTENNAE: three beetles on circles, antennae 0.2 / 0.5 / 0.9
#   MIDDLE-EAST SPIN ZONE: two railed rotating platforms; a critter and a lizard ride them (so can you)
#   SOUTH-WEST  PETS: a lizard and a beetle follow you around a fenced yard (hop the fence)
#   SOUTH-EAST  PLAYER PADS: grow a tail / antennae on your own puppet, floppy or stiff, reset
# Pad changes last until you leave the room. The yard fence is 0.7 m: you can jump it, creatures cannot.
name = "Secondary Motion"
about = "Tails and antennae are springy chains that trail behind the body and swing back to rest. Compare stiff and floppy wobble, short and long tails, antennae, pets that follow you, and a spinning platform that flings a tail outward; then grow your own tail with the pads."
try = [
  "Watch the WOBBLE DIAL: same route, speed, tail and antennae, but STIFF, NORMAL and FLOPPY wobble; the difference shows at every stop and corner",
  "Compare the three lizards: the 2.2 m tail whips at the corners of the patrol, the 0.4 m stub barely moves",
  "Stand next to the beetles and compare antenna lengths 0.2, 0.5 and 0.9 on the circles",
  "Step on GROW A TAIL and ANTENNAE, then run in circles and stop suddenly: the chains swing and settle",
  "Try FLOPPY (wobble 2) and STIFF (wobble 0.1) with your tail, then RESET to clear everything",
  "Hop the low fence into the yard: the lizard and the beetle trail after you and their tails follow their turns",
  "Jump over the rail onto a spinning platform in the SPIN ZONE (grow a tail first): the riders' tails and your own swing outward",
  "Throw a bomb (F or left click) near a pet in the yard: it flinches and gets nudged, then comes back to you",
]
wing = "animation"
order = 5
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 58.0
distance = 24.0

[layout]
origin = [-20.0, 0.0, -15.0]

