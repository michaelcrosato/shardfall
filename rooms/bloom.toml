[layout.legend.'k']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "RESET ALL", color = "#2f8a52", label_size = 0.4, params = { "view.bloom" = 0.8, "view.bloom_threshold" = 1.2, "view.light.sun_intensity" = 0.06, "view.light.ambient" = 0.32, "view.sky" = "#0e1424", "view.light.sun_elevation" = 20.0 } }

