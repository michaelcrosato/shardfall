# Bloom & Glow (vfx wing): glow around anything brighter than view.bloom_threshold, at view.bloom.
# Generated from a small script, then hand-checked. Layout (40 x 26):
#   NORTH   neon signs (thin emissive boxes) on the dark north wall
#   MIDDLE  brightness ladder (emissive 0.5 .. 8) over the BLOOM dial and the DAY / NIGHT pads
#   EAST    sparkles: magic, embers, fireflies, sparks (additive, HDR-bright particles)
# Pads set view.* values; they stay until you leave the room (RESET ALL puts them back).
name = "Bloom & Glow"
about = "Glow around anything brighter than the bloom threshold: a brightness ladder, neon signs, sparkling particles, and pads that turn the bloom strength, threshold and time of day up and down."
try = [
  "Walk along the BRIGHTNESS LADDER: emissive 0.5 and 1 stay plain, 2 starts to glow, 4 and 8 bloom big",
  "Stand on each BLOOM pad (OFF, SUBTLE, STRONG, DREAMY) and watch the neon and the ladder change",
  "Step on THRESHOLD LOW: even dim things (and the 0.5 and 1 spheres) start to glow; HIGH: only the 8 does",
  "Step on DAYLIGHT, then NIGHT: the same glow is almost invisible in the sun and strongest in the dark",
  "Admire the neon signs on the north wall in each bloom setting, then switch bloom OFF to see the bare tubes",
  "Visit the sparkles: magic, embers, fireflies and a sparks grinder glow because their particles are HDR-bright",
  "Throw a bomb (F or click) at the ladder: the explosion flash and sparks bloom too",
  "RESET ALL brings the room back to its starting look",
]
wing = "vfx"
order = 3
primary_device = "keyboard_mouse"
entrance = { at = [19, 25], facing = "south" }

[camera]
tilt = 58.0
distance = 17.0

[view]
"light.sun_intensity" = 0.06
"light.ambient" = 0.25
"light.sun_elevation" = 20.0
sky = "#0e1424"
bloom = 0.8
bloom_threshold = 1.2

[layout]
origin = [-20.0, 0.0, -13.0]

[[layout.layer]]
y = 0
map = '''
########################################
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#..aaabbbcccddd.eeeegggg...............#
#..aaabbbcccddd.eeeegggg...............#
#......................................#
#......................................#
#..hhhhhiiiijjjj.kkkkkk................#
#..hhhhhiiiijjjj.kkkkkk................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
###################..###################
'''

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#262a36" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#262a36" }, { y0 = 0, y1 = 3.0, color = "#191b26" }]

[layout.legend.'a']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "BLOOM OFF", color = "#9aa3b8", params = { "view.bloom" = 0.0 } }

[layout.legend.'b']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "SUBTLE", color = "#7fc8ff", params = { "view.bloom" = 0.35 } }

[layout.legend.'c']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "STRONG", color = "#c58bff", params = { "view.bloom" = 1.0 } }

[layout.legend.'d']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "DREAMY", color = "#ff8bd0", params = { "view.bloom" = 2.0 } }

[layout.legend.'e']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "THRESHOLD LOW", color = "#ffd166", label_size = 0.3, params = { "view.bloom_threshold" = 0.6 } }

[layout.legend.'g']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "THRESHOLD HIGH", color = "#ff9f5a", label_size = 0.28, params = { "view.bloom_threshold" = 2.0 } }

[layout.legend.'h']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "DAYLIGHT", color = "#ffe08a", params = { "view.light.sun_intensity" = 0.9, "view.light.ambient" = 1.0, "view.sky" = "#8fb8d8", "view.light.sun_elevation" = 58.0 } }

[layout.legend.'i']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "DUSK", color = "#ff9a6b", params = { "view.light.sun_intensity" = 0.25, "view.light.ambient" = 0.55, "view.sky" = "#3a2a4e", "view.light.sun_elevation" = 9.0 } }

[layout.legend.'j']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "NIGHT", color = "#7b8cff", params = { "view.light.sun_intensity" = 0.06, "view.light.ambient" = 0.25, "view.sky" = "#0e1424", "view.light.sun_elevation" = 20.0 } }

[layout.legend.'k']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "RESET ALL", color = "#8de0a5", label_size = 0.4, params = { "view.bloom" = 0.8, "view.bloom_threshold" = 1.2, "view.light.sun_intensity" = 0.06, "view.light.ambient" = 0.25, "view.sky" = "#0e1424", "view.light.sun_elevation" = 20.0 } }

