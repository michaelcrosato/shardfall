# Bloom & Glow (vfx wing): glow around anything brighter than view.bloom_threshold, at view.bloom.
# Layout (40 x 26, entrance in the south wall):
#   NORTH   neon signs (thin emissive boxes) on the dark north wall
#   MIDDLE  brightness ladder (emissive 0.5 .. 8) above the BLOOM dial and the DAY / NIGHT pads
#   EAST    sparkles: magic, embers, fireflies, sparks (additive, HDR-bright particles)
#   SOUTH   reference lamps and pushable glow balls
# Pads set view.* values and keep them until you leave the room (RESET ALL puts them back).
# Every emissive object above 0.5 also adds a point light (the renderer takes 64 at most), so the
# neon tubes are single boxes and the whole room stays near 45 lights.
name = "Bloom & Glow"
about = "Glow around anything brighter than the bloom threshold: a brightness ladder, neon signs, sparkling particles and glow balls, plus pads that turn the bloom strength, the threshold and the time of day."
try = [
  "Walk along the BRIGHTNESS LADDER: emissive 0.5 stays plain, 1 is borderline, 2 starts to glow, 4 and 8 bloom big",
  "Stand on each BLOOM pad (OFF, SUBTLE, STRONG, DREAMY) and watch the ladder, the neon and the lamps change",
  "Step on THRESHOLD LOW: the 1 sphere and even the bright pads start to glow; on HIGH mostly the 4 and 8 spheres do",
  "Step on DAYLIGHT, then DUSK and NIGHT: the same glow is washed out in the sun and strongest in the dark",
  "Walk up to the neon signs on the north wall, then switch BLOOM OFF to see the bare tubes",
  "Visit the sparkles: magic, embers, fireflies and the sparks grinder glow because their particles are HDR-bright",
  "Push the three glow balls around: their light travels with them; throw a bomb (F or click) at the ladder",
  "RESET ALL brings the room back to its starting look",
]
wing = "vfx"
order = 3
primary_device = "keyboard_mouse"
entrance = { at = [19, 25], facing = "south" }

[camera]
tilt = 58.0
distance = 17.0

[view]
"light.sun_intensity" = 0.06
"light.ambient" = 0.32
"light.sun_elevation" = 20.0
sky = "#0e1424"
bloom = 0.8
bloom_threshold = 1.2

[layout]
origin = [-20.0, 0.0, -13.0]

[[layout.layer]]
y = 0
map = '''
########################################
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#..aaabbbcccddd.eeeeeggggg.............#
#..aaabbbcccddd.eeeeeggggg.............#
#.........................mmmmmmm......#
#.........................mmmmmmm......#
#..hhhhhiiiijjjj.kkkkkk...mmmmmmm......#
#..hhhhhiiiijjjj.kkkkkk...mmmmmmm......#
#.........................mmmmmmm......#
#......................................#
#......................................#
#......................................#
#......................................#
###################..###################
'''

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#434b66" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#434b66" }, { y0 = 0, y1 = 3.0, color = "#2c3148" }]

[layout.legend.'m']
blocks = [{ y0 = -0.5, y1 = 0, color = "#1d3a2a" }]

[layout.legend.'a']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "BLOOM OFF", color = "#3b4054", params = { "view.bloom" = 0.0 } }

[layout.legend.'b']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a2f3f" }]
zone = { kind = "pad", label = "SUBTLE", color = "#2f6fa8", params = { "view.bloom" = 0.35 } }

[layout.legend.'c']
