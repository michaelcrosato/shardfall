# Cinderwire: The Helix Ledger — a vertical slice of a cyberpunk-noir action RPG.
# An original spiritual successor to the SNES Shadowrun formula: top-down real-time
# infiltration with twin-stick gunplay, keyword intel, hired runners, a Matrix-style
# decking dive, and a corp-vault boss, in one complete run: RAIN STREET -> THE FENCE
# -> SERVER HALL -> THE VEIL (jack in) -> VAULT APPROACH -> THE HELIX LEDGER.
#
# How it plays (one course, "ledger"): leave START to start the clock. Hire ONE runner
# (SLAG = rapid fire, HEX = long range + small hitbox), work the JOHNSON / LEDGER
# kiosks, sneak the fence patrol (alcoves are blind, crouching halves sight), cross the
# server hall, jack into the Veil (the whole screen goes green), loot datastores, dodge
# ICE, jack out, cross the sentry eyes, kill or dodge the HELIX SPIDER, grab the LEDGER
# (finish), beat the clock. Score = nuyen. Death is never the fail state: SPOTTED! and
# knockbacks cost time, not the run.
#
# Map key (40x30, rows 0-29 south = down):
#   # wall (3 m)   s street   l corridor   A alcove   S START   H/E hire pads
#   1/2 kiosks     3/4 dead drops   K/J/N checkpoints   b server hall   P pillar
#   c the Veil (matrix green)   T low tables (crouch cover)   D duct (crouch under)
#   X crates   I jack-in pad   O jack-out pad   d vault approach   p pillar   k crate
#   G gold seal (gate 1)   V THE LEDGER (finish)
name = "Cinderwire: The Helix Ledger"
about = "A cyberpunk-noir shadowrun in one level: get briefed on Rain Street, hire one runner, sneak the fence patrol, cross the server hall, jack into the green Veil to loot datastores, jack out past the sentry eyes, and take the Helix Ledger from the Spider's vault. Twin-stick gunplay, stealth cones, checkpoints, score-as-nuyen."
try = [
  "Leave the green START pad to start the clock, then step on ONE hire pad: SLAG (rapid fire) west of spawn, HEX (long range) east",
  "Work the JOHNSON and LEDGER kiosks on Rain Street (chips drop as receipts), then push east along the fence",
  "1 THE FENCE: the patrol only sees forwards; wait in the alcoves and slip behind it, and check the back-row DEAD DROPS for intel",
  "2 SERVER HALL: pillars cut the cones; shoot the sentry gun (25 nuyen) from cover, then take checkpoint CP 2",
  "Step west into the green to JACK IN: the whole screen is the Veil now; loot the datastores (50 each), dodge the ICE, crouch under the archive stacks",
  "JACK OUT at the north duct, cross the VAULT APPROACH while the sentry eyes point away, then face the HELIX SPIDER (three phases, bar on top)",
  "Grab THE HELIX LEDGER to stop the clock: the run can be shot, sneaked, or mixed, and the Spider itself is optional if you can dodge it",
  "Hold C to crouch anywhere (patrols see 60% range); walking back onto START restarts the run; F5 resets the room",
]
wing = "genre"
order = 5
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [3, 29], facing = "south" }
controls = [["Move", "W A S D"], ["Fire (hold, aims at cursor)", "F / left mouse / Space"], ["Crouch (hold, patrols see less)", "C / Ctrl"], ["Camera", "Right-drag · wheel"]]

[camera]
tilt = 70.0
distance = 27.0

# Rain-street noir: dim blue night, warm lamps, neon bloom, a whisper of CRT.
[view]
"light.sun_intensity" = 0.35
"light.ambient" = 0.6
"light.sun_elevation" = 50
sky = "#0b0e1a"
bloom = 0.7
"filter.scanlines" = 0.25
"filter.scanline_px" = 3.0
"filter.grain" = 0.1
"filter.vignette" = 0.35
"filter.saturation" = 1.05

[params]
"bombs.weapon" = "blaster"
"bombs.shoot_angle" = -1.0
"bombs.fire_interval" = 0.12
"bombs.bullet_speed" = 22.0
"bombs.shot_range" = 35.0
"movement.allow_jump" = false
"movement.hitbox" = 0.2
"movement.face_aim" = true
"movement.crouch_mult" = 0.6

# Fire with Space as well as F (jumping is off in this room).
[keys]
use = ["Space", "KeyF"]
jump = []

[layout]
origin = [-20.0, 0.0, -15.0]

