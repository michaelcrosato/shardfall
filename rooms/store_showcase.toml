# Store Showcase (Workshop wing): the asset store's other kinds in one room. GENERATED by a script
# kept outside the repo (from assets/materials and the S5 runs' done.json); hand-edits are fine, and
# crates/pav_tools/tests/store_rooms.rs checks that every core material is on show.
#   BACK   the 18 core materials, each on a 1.2 m cube (top and front faces) signed with its name
#   MIDDLE three scenes an agent put together from store props for the S5 sprite trial: a treasure
#          nook, a village well corner and a forest camp, each signed with its brief
#   FRONT  16-BIT and PLAIN pads by the door: the S5 trial's pixel look over the whole room
name = "Store Showcase"
about = "The asset store's materials and three scenes built from its props: every core material on a cube, and the S5 trial's treasure nook, village well corner and forest camp, which an agent placed from store props in a few commands each. The 16-BIT pad shows them in the trial's pixel look."
try = [
  "Walk along the cubes: each core material on a top and a front face, with its name (MAT/...) and what it is for",
  "Look at the three scenes: an agent built each from a short brief by placing store props, no new modelling",
  "Step on 16-BIT: the whole room as 4 px pixel art with outlines, the look Shardfall's arm used in the sprite trial",
  "In the REPL: assets find=planks kind=material searches the materials; asset_preview kind=material name=MAT/brick_wall shows one",
]
wing = "misc"
order = 4
primary_device = "keyboard_mouse"
entrance = { at = [16, 24], facing = "south" }

[camera]
tilt = 50.0
distance = 22.0
fov = 40.0

# Station guide (H in the game).
[learn]
what = "The rest of the asset store's library beside its objects: the 18 core materials every build carries (procedural surfaces such as planks, brick, cobbles and gold, each drawn on a cube's top and front), and three small scenes from the S5 sprite trial that an agent made from a one-paragraph brief by placing store props: a dungeon treasure nook, a village well corner and a forest camp."
how = [
  "A material is a few lines of data: a colour and pattern layers (planks, bricks, cobbles, noise, gradients) that the GPU evaluates per pixel exactly as the CPU does, in world units, so a pattern keeps its size on any surface.",
  "Each cube is the stock box with a one-off patch: it binds the library material by name (base = MAT/...) under its own key and becomes a 1.2 m cube. Theme colours ($floor, $wall) take the room's roles.",
  "The scenes are the S5 runs' placements as written (asset, position, turn, scale): the agent found every prop with assets find= and placed it from LIB/core, with no new modelling, in four or five commands.",
  "16-BIT turns on the pixel_art filter (4 px blocks, 24 shades a channel, outlines) for the whole room, the look Shardfall's arm used in the sprite trial; PLAIN turns it off, and leaving the room restores your settings.",
]
uses = [
  "Material libraries: Substance's and Quixel's libraries, Unity's and Unreal's starter content, Blender's asset browser materials.",
  "Kitbashing: level designers dress scenes from a library of modular props instead of modelling each one (Bethesda's and Ubisoft's level kits).",
]
ask = [
  "show me every material we have",
  "a brick wall material on a building",
  "build a small scene from library props",
  "the room in pixel art",
]
cost = "Eighteen cubes and about fifteen props, each drawn as its parts; a material's pattern is a few dozen arithmetic operations per pixel on the GPU. The pixel look adds one post-process pass."
knobs = ["view.filter.pixel_art", "view.filter.pixel_outline"]
terms = ["asset store", "procedural material", "pixel art", "palette"]

[[learn.code]]
title = "A cube bound to a library material by a patch on the stock box"
file = "rooms/store_showcase.toml"
lang = "toml"
src = '''
[[object]]
name = "mat_brick_wall"
asset = "BUILTIN/box"
body = "none"
patch = [
  { op = "add", material = "brick_wall", value = { base = "MAT/brick_wall", color = "#9c4a32" } },
  { op = "set", part = "body", fields = { mat = "brick_wall", color = "#9c4a32", shape = { type = "box", half = [0.6, 0.6, 0.6] }, pos = [0, 0.6, 0] } },
]
'''

[layout]
origin = [-16.0, 0.0, -12.5]

[[layout.layer]]
y = 0
map = '''
################################
#..............................#
#..............................#
#..............................#
#..............................#
#..............................#
#..............................#
#..............................#
#..............................#
#..............................#
#..............................#
#..............................#
#.1wwwwwww..22222222..33333333.#
#.11111111..22222222..33333333.#
#.11111111..22222222..33333333.#
#.11111111..22222222..33333333.#
#.11111111..22222222..33333333.#
#.11111111..22222222..33333333.#
#.11111111..22222222..33333333.#
#.11111111..22222222..33333333.#
#..............................#
#..............................#
#...........xxx..ppp...........#
#...........xxx..ppp...........#
###############..###############
'''

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3d4256" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3d4256" }, { y0 = 0, y1 = 3.0, color = "#2c3042" }]

[layout.legend.'1']
blocks = [{ y0 = -0.5, y1 = 0.05, color = "#45434d" }]

[layout.legend.'2']
blocks = [{ y0 = -0.5, y1 = 0.05, color = "#6b6458" }]

[layout.legend.'3']
blocks = [{ y0 = -0.5, y1 = 0.05, color = "#4c6538" }]

[layout.legend.'w']
blocks = [{ y0 = -0.5, y1 = 2.2, color = "#55525c" }]

[layout.legend.'x']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3d4256" }]
zone = { kind = "pad", label = "16-BIT", color = "#c05a8a", params = { "view.filter.pixel_art" = 4.0, "view.filter.pixel_levels" = 24.0, "view.filter.pixel_outline" = true }, note = "The whole room as 16-bit pixel art: 4 px blocks, 24 shades a channel, dark outlines. The look Shardfall's arm used in the S5 sprite trial." }

[layout.legend.'p']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3d4256" }]
zone = { kind = "pad", label = "PLAIN", color = "#556a8a", params = { "view.filter.pixel_art" = 0.0, "view.filter.pixel_outline" = false }, note = "Back to the plain picture." }

