# Light Shafts (vfx wing): volumetric light from the sun's shadow map, and lamp halos.
# GENERATED by a script kept outside the repo; hand-edits are fine.
#   WEST   THE HALL: 6 m walls, slits in the west wall, a slatted roof (the sun is low in the west)
#   EAST   the colonnade: 6.5 m columns, two trees that sway, lanterns on posts
#   SOUTH  pads: HAZE, BEAMS and SUN rows (they set view.* values until you leave the room)
name = "Light Shafts"
about = "Sunlight you can see: a low sun shines through the slits of a dusty hall and between tall columns, the haze glows where light reaches it and stays dark in shadow, and lanterns glow in the air around them. Pads change the haze, the sunlight in it, the sun and the lamps."
try = [
  "Walk into THE HALL: each slit in the west wall throws a beam of lit dust across the room and a bright stripe on the floor",
  "Stand on HAZE > CLEAR, then DUSTY and FOG: the same light, more and more air for it to light",
  "LOW MIST squeezes the haze into the first metre; TALL lets beams reach the roof",
  "BEAMS > SUNWARD, then right-drag the camera to look west (toward the sun) and east: the haze glows toward the sun",
  "SUN > HIGH: the slits give short patches and the slatted roof stripes the floor; SOUTH swings every shaft",
  "SUN > NIGHT: only the lanterns light the haze. HALOS makes them bigger",
  "Press H for how it works, the settings, the code and the words",
]
wing = "vfx"
order = 6
primary_device = "keyboard_mouse"
entrance = { at = [19, 27], facing = "south" }

[camera]
tilt = 52.0
distance = 20.0
fov = 42.0

[view]
"light.sun_elevation" = 24.0
"light.sun_azimuth" = 270.0
"light.sun_intensity" = 0.9
"light.ambient" = 0.35
sky = "#3a2a4e"
haze = 1.0
haze_height = 3.0
shafts = 2.4
shafts_forward = 0.6
halos = 0.6
bloom = 0.6
bloom_threshold = 1.0
fog = false
"light.shadow_radius" = 40.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "Dusty evening air lit by a low sun from the west. In THE HALL the sun gets in only through the slits in the west wall, so you see bright beams of lit dust between dark air, and stripes on the floor where they land. Outside, every column and tree leaves a dark shaft in the glowing haze, and the lanterns glow in the air around them. The pads change the haze, the sunlight in it, the sun and the lamps."
how = [
  "For every pixel, the composite takes the ray from the camera to the surface it sees (from the depth buffer) and keeps only the part that runs through the haze layer.",
  "It walks that ray in 32 steps. At each step the haze density is looked up: thickest at your feet, thinning out exponentially with height (haze height).",
  "Each step asks the sun's shadow map whether sunlight reaches that point of air. Lit air adds sunlight times the density; air in shadow adds only the sky's dim glow. That difference is what you see as shafts.",
  "How much light turns toward the camera depends on the angle to the sun (the Henyey-Greenstein phase function): with forward scattering the haze glows most when you look toward the sun.",
  "Haze also dims what is behind it (each step multiplies the remaining visibility). Starting each pixel's walk at a slightly different offset turns stair-step banding into fine grain.",
  "Lamp halos need no steps: the light a point lamp scatters along a straight ray has a closed form (an arctangent), so each lamp costs a few instructions per pixel.",
]
uses = [
  "Cathedrals and ruins: sun through stained glass and broken roofs (Ico, The Last of Us, Dark Souls).",
  "Forests: god rays through the canopy, dust and pollen in the beams (Ori, Red Dead Redemption 2).",
  "Horror and mystery: torches and streetlamps glowing in fog (Silent Hill, Inside, Limbo).",
  "Stage lighting: spotlights and searchlights you can see (Hotline Miami's clubs, Metal Gear's searchlights).",
]
ask = [
  "volumetric light shafts from the sun's shadow map",
  "god rays through windows in a dusty hall",
  "ray-marched height fog with light shafts",
  "lamp halos glowing in the fog",
  "Henyey-Greenstein forward scattering toward the sun",
]
cost = "32 shadow-map lookups per pixel at full resolution, plus a short loop over the lights for halos: around a millisecond on a desktop GPU at 1080p. The march only covers the part of the ray inside the haze layer, so a low haze height is cheaper. Turning haze and halos to 0 skips it entirely."
knobs = ["view.haze", "view.haze_height", "view.shafts", "view.shafts_forward", "view.halos", "view.light.sun_elevation", "view.light.sun_azimuth"]
terms = ["volumetric light", "ray marching", "shadow map", "phase function", "halo", "hdr", "fog"]

[[learn.code]]
title = "Marching the haze, asking the shadow map"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = '''
for (var i = 0; i < steps; i++) {
    let x = ro + rd * (t0 + (f32(i) + jitter) * ds);
    let k = sigma0 * exp(-max(x.y - base, 0.0) / h) * smoothstep(bottom, base, x.y) * ds;
    var vis = 1.0;
    if (shafts) {
        vis = sun_reaches(x);
    }
    light += trans * k * (sun * vis + amb);
    trans *= exp(-k);
}
'''

[[learn.code]]
title = "Henyey-Greenstein: light scattered toward the camera"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = '''
let g = post.air2.x;
let cos_t = dot(-rd, post.sun_dir.xyz);
let phase = (1.0 - g * g) / pow(max(1.0 + g * g - 2.0 * g * cos_t, 1e-4), 1.5);
let sun = post.sun_color.rgb * phase * post.air.w;
'''

[[learn.code]]
title = "Lamp halos in closed form"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = '''
let tc = dot(pl.pos_radius.xyz - ro, rd);
let hd = max(length(ro + rd * tc - pl.pos_radius.xyz), 0.03);
if (hd < r) {
    // The integral of 1 / distance^2 along the ray (in front of the surface).
    let s = (atan((len - tc) / hd) - atan(-tc / hd)) / hd;
    let fade = (1.0 - hd / r) * (1.0 - hd / r);
    light += pl.color.rgb * s * fade * halos * 0.035;
'''

