# Dodge Gauntlet: a timed course from the south entrance to the FINISH through five lanes of
# projectile turrets. The HUD counts hits (a hit = knockback + a short stun); the goal is to
# finish fast with as few hits as possible. Every turret is a fixed [[object]] with an emitter
# behaviour: `height` is the muzzle height above the object's centre, `range` keeps a turret
# silent until you are near, `delay` and different intervals desynchronise the streams.
#
# Path (the course snakes through three bands):
#   band 1 (south, east-bound)   START -> 1 JUMP -> CP 1 -> 2 DUCK -> CP 2
#   band 2 (middle, west-bound)  3 CRAWL -> CP 3 -> 4 AIMED -> (gap) -> CP 4
#   garden (north)               5 BULLET GARDEN -> FINISH (north-east corner)
# Turret rows sit on the lane edges (north edge fires south = yaw 0, south edge fires north =
# yaw 180). Muzzle heights (floor = 0): JUMP 0.35 m, DUCK 1.4 m (a crouched character is
# 1.15 m tall), CRAWL 1.1 m between slabs with a 0.8 m slot underneath (crawling is 0.66 m),
# AIMED 0.7 m, GARDEN 0.7 m. Speeds are 3.5-7 m/s and each turret only fires while you are within
# `range` metres, so the lanes wake up as you arrive.
name = "Dodge Gauntlet"
about = "A timed gauntlet through five projectile lanes: jump the floor shots, crouch under head-height shots, crawl under the slabs, outrun aimed turrets from behind cover and weave through the bullet garden. The HUD counts your hits."
try = [
  "Run START to FINISH and watch the hit counter: fewer hits and a faster time are better",
  "1 JUMP: low shots skim the floor, jump (Space) just before one reaches you",
  "2 DUCK: head-height shots, hold C to crouch under them (slower, but safe)",
  "3 CRAWL: press Z to crawl through the low slots under the amber slabs while slow shots fly over your back (Z again to stand up)",
  "4 AIMED: the turrets track you, so keep moving and break their line of sight behind the pillars",
  "5 BULLET GARDEN: rings and spirals of slow bullets, weave through the gaps",
  "Step on the ROLL pad (start area): with the committed model, crouching while running is a dodge-roll; the INSTANT pad switches back",
]
wing = "movement"
order = 5
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [3, 29], facing = "south" }

[camera]
tilt = 64.0
distance = 18.0

# Map key: # wall (4 m), . floor, S START, F FINISH, 1-4 checkpoints, R/I model pads,
# j/d/k/a/g floor tints of the JUMP/DUCK/CRAWL/AIMED/GARDEN sections, b crawl slab (0.8 m slot),
# p cover pillar (AIMED), q pillar (GARDEN). Turrets are the [[object]]s at the end.
[layout]
origin = [-18.0, 0.0, -15.0]

[[layout.layer]]
y = 0
map = '''
####################################
#gggggggggggggggggggggggggggggggFFF#
#gggggggggggggggggggggggggggggggFFF#
#gggggggggggggggggggggggggggggggFFF#
#ggggggggggggggggggggggggqggggggFFF#
#gggggqggggggggqggggggggggggggggggg#
#gggggggggggggggggggggggggggggggggg#
#gggggggggggggggggggggggggggggggggg#
#ggggggggggggggggggqggggggggggggggg#
#gggggggggggggggggggggggggggggqgggg#
#gggggqgggggggggggggggggggggggggggg#
#gggggggggggggggggggggggggggggggggg#
#444ggggggggggqggggggggggqggggggggg#
#444ggggggggggggggggggggggggggggggg#
#444ggggggggggggggggggggggggggggggg#
#...################################
#aaaaaaaaaaaaaaaaa333kbkbkbkbkbk...#
#aaapaaaaapaaaaaaa333kbkbkbkbkbk...#
#aaaaaaaaaaaapaaaa333kbkbkbkbkbk...#
#aaaaaapaaaaaaaaaa333kbkbkbkbkbk...#
#aaapaaaaapaaaaaaa333kbkbkbkbkbk...#
#aaaaaaaaaaaaaaaaa333kbkbkbkbkbk...#
################################...#
#RRRSSjjjjjjjjjjjj111ddddddddddd222#
#RRRSSjjjjjjjjjjjj111ddddddddddd222#
#...SSjjjjjjjjjjjj111ddddddddddd222#
#IIISSjjjjjjjjjjjj111ddddddddddd222#
#IIISSjjjjjjjjjjjj111ddddddddddd222#
#...SSjjjjjjjjjjjj111ddddddddddd222#
###.################################
'''


# Neutral floor and the 4 m wall (outer wall and the dividers between the lanes). Ledge grab
# reaches up to ~3.4 m, so anything lower could be climbed and walked along, skipping lanes.
[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }, { y0 = 0, y1 = 4.0, color = "#b9c3cf" }]

# Movement model pads in the hub: ROLL switches to the committed model, INSTANT back.
[layout.legend.'R']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }]
zone = { kind = "pad", label = "ROLL", color = "#9b5de5", params = { "movement.model" = "committed" } }

[layout.legend.'I']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }]
zone = { kind = "pad", label = "INSTANT", color = "#5b8def", params = { "movement.model" = "instant" } }

# START (leaving it starts the timer) and FINISH (stops it) of the "gauntlet" course.
[layout.legend.'S']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }]
zone = { kind = "start", course = "gauntlet", label = "START", facing = "east" }

[layout.legend.'F']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }]
zone = { kind = "finish", course = "gauntlet", label = "FINISH" }

# Checkpoints between the sections (the respawn point; `facing` = the way you look after).
[layout.legend.'1']
blocks = [{ y0 = -0.5, y1 = 0, color = "#b9c9dd" }]
zone = { kind = "checkpoint", course = "gauntlet", label = "CP 1", facing = "east" }

[layout.legend.'2']
blocks = [{ y0 = -0.5, y1 = 0, color = "#b9c9dd" }]
zone = { kind = "checkpoint", course = "gauntlet", label = "CP 2", facing = "north" }

[layout.legend.'3']
blocks = [{ y0 = -0.5, y1 = 0, color = "#b9c9dd" }]
zone = { kind = "checkpoint", course = "gauntlet", label = "CP 3", facing = "west" }

[layout.legend.'4']
blocks = [{ y0 = -0.5, y1 = 0, color = "#b9c9dd" }]
zone = { kind = "checkpoint", course = "gauntlet", label = "CP 4", facing = "north" }

# Section floors, tinted so you can tell the lanes apart from above.
[layout.legend.'j']
blocks = [{ y0 = -0.5, y1 = 0, color = "#e6d8b8" }]

[layout.legend.'d']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d8c8e2" }]

[layout.legend.'k']
blocks = [{ y0 = -0.5, y1 = 0, color = "#bcd9d3" }]

# Crawl bars: a slab with a 0.8 m slot underneath (a crawling character is 0.66 m tall, a crouching
# one 1.15 m). The slab is tall so it cannot be climbed and walked over.
[layout.legend.'b']
blocks = [{ y0 = -0.5, y1 = 0, color = "#bcd9d3" }, { y0 = 0.8, y1 = 4.0, color = "#e0a458", rounded = true }]

[layout.legend.'a']
blocks = [{ y0 = -0.5, y1 = 0, color = "#e5c6c0" }]

# Cover pillars for the aimed turrets (bullets stop at them).
[layout.legend.'p']
blocks = [{ y0 = -0.5, y1 = 0, color = "#e5c6c0" }, { y0 = 0, y1 = 1.6, color = "#c9a27a", rounded = true }]

[layout.legend.'g']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c6d3ea" }]

[layout.legend.'q']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c6d3ea" }, { y0 = 0, y1 = 1.6, color = "#9aa5b1", rounded = true }]

