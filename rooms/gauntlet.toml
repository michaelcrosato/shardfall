# Dodge Gauntlet: a timed course from the south entrance to the FINISH through five lanes of
# projectile turrets. The HUD counts hits (a hit = knockback + a short stun); the goal is to
# finish fast with as few hits as possible. Every turret is a fixed [[object]] with an emitter
# behaviour: `height` is the muzzle height above the object's centre, `range` keeps a turret
# silent until you are near, `delay` and different intervals desynchronise the streams.
#
# Path (the course snakes through three bands):
#   band 1 (south, east-bound)   START -> 1 JUMP -> CP 1 -> 2 DUCK -> CP 2
#   band 2 (middle, west-bound)  3 CRAWL -> CP 3 -> 4 AIMED -> (gap) -> CP 4
#   garden (north)               5 BULLET GARDEN -> FINISH (north-east corner)
# Turret rows sit on the lane edges (north edge fires south = yaw 0, south edge fires north =
# yaw 180). Muzzle heights (floor = 0): JUMP 0.35 m, DUCK 1.4 m (a crouched character is
# 1.15 m tall), CRAWL 1.1 m between slabs with a 0.8 m slot underneath (crawling is 0.66 m),
# AIMED 0.7 m, GARDEN 0.7 m. Speeds are 3.5-7 m/s and each turret only fires while you are within
# `range` metres, so the lanes wake up as you arrive.
name = "Dodge Gauntlet"
about = "A timed gauntlet through five projectile lanes: jump the floor shots, crouch under head-height shots, crawl under the slabs, outrun aimed turrets from behind cover and weave through the bullet garden. The HUD counts your hits."
try = [
  "Run START to FINISH and watch the hit counter: fewer hits and a faster time are better",
  "1 JUMP: low shots skim the floor, jump (Space) just before one reaches you",
  "2 DUCK: head-height shots, hold C to crouch under them (slower, but safe)",
  "3 CRAWL: press Z to crawl through the low slots under the amber slabs while slow shots fly over your back (Z again to stand up)",
  "4 AIMED: the turrets track you, so keep moving and break their line of sight behind the pillars",
  "5 BULLET GARDEN: rings and spirals of slow bullets, weave through the gaps",
  "Step on the ROLL pad (start area): with the committed model, crouching while running is a dodge-roll; the INSTANT pad switches back",
]
wing = "movement"
order = 5
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [3, 29], facing = "south" }

[camera]
tilt = 64.0
distance = 18.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "Five turret lanes between START and FINISH, each asking for a different move: 1 JUMP (shots skimming the floor at 0.35 m), 2 DUCK (head height, 1.4 m), 3 CRAWL (shots at 1.1 m between the amber slabs), 4 AIMED (three-shot fans aimed at you, with pillars for cover) and 5 BULLET GARDEN (rings and spirals). The course HUD counts your hits, CP 1 to CP 4 split the run, and the ROLL and INSTANT pads at the start swap the movement model."
how = [
  "A turret is a fixed object with an emitter behaviour: it keeps a timer, stays silent until you are within its range (10 to 16 m here) and then fires every interval seconds. A start delay puts neighbours out of step, so the lanes wake up as you arrive.",
  "Each shot is a set of directions: forward fires along the turret's facing, aimed turns toward where you are right now (it does not lead you, so moving sideways makes it miss), ring spaces bullets evenly round a circle, and spiral is a ring that turns a few degrees every shot.",
  "Bullets are not physics bodies but plain data moved in a straight line each tick, so thousands are cheap. Each one measures its distance to the centre line of your capsule, and casts a ray against fixed geometry, which is why pillars and slabs stop them.",
  "Your hitbox is that centre line plus movement.hitbox (0.32 m), and it shrinks with your posture: standing it reaches 1.7 m, crouching 1.15 m, crawling 0.66 m. So the 1.4 m shots pass over a crouch, the 1.1 m shots only over a crawl, and a floor shot misses only while your feet are about 0.5 m up.",
  "A hit knocks you back, takes away control for hit_stun (0.35 s) and makes you untouchable for 0.6 s, and the course counts it. It never sends you back to a checkpoint; it only costs time.",
  "On the ROLL pad (committed model) crouch while running is a 0.42 s roll at 8.5 m/s in the crawl posture: it passes under the DUCK and CRAWL shots at speed, but it has no invincibility frames, so it still has to dodge.",
]
uses = [
  "Bullet hell: rings and spirals of slow bullets against a tiny hitbox (Touhou Project, Enter the Gungeon).",
  "Run-and-gun: jump the low shots, duck the high ones (Contra, Metal Slug).",
  "Dodge rolls: a quick, low move through danger, usually with invincibility frames (Dark Souls, Enter the Gungeon).",
  "Cover: put something solid between you and the guns (Gears of War).",
]
ask = [
  "projectile turrets with aimed, ring and spiral patterns",
  "cheap non-physics bullets that stop at walls",
  "hitbox that shrinks when crouching or crawling",
  "dodge roll with a low profile",
  "knockback and hit stun with brief invulnerability",
  "turrets that only fire when the player is in range",
]
cost = "Bullets are stepped on the CPU: each tick each one does a distance test against every character and one ray cast against fixed geometry, so the cost grows with bullets times characters, and a hard cap of 6000 bullets stops a runaway emitter. Each bullet is drawn as one small SDF sphere on the GPU."
knobs = ["movement.hitbox", "movement.hit_stun", "movement.model", "movement.roll_time", "movement.roll_speed", "movement.crouch_mult"]
terms = ["game feel", "raycast", "sdf", "rigid body", "interpolation", "fixed timestep"]

[[learn.code]]
title = "Turrets wake up when you come near"
file = "crates/pav_core/src/behaviors.rs"
lang = "rust"
src = """
Behavior::Emitter(mut em) => {
    let near = player.is_some_and(|p| p.distance(epos) < em.range);
    em.timer += dt;
    if near && em.timer >= em.delay {
        let wait = if em.burst > 0 && em.shots > 0 && em.shots % em.burst == 0 { em.pause } else { 0.0 };
        if em.timer - em.delay >= em.interval + wait {
            em.timer = em.delay;
            self.fire(id, epos, erot, &mut em, player);
        }
    } else if !near {
        em.timer = em.timer.min(em.delay);
    }
    if let Some(e) = self.state.entities.get_mut(id) {
        e.behavior = Behavior::Emitter(em);
    }
}
"""

[[learn.code]]
title = "Aimed fans, rings and spirals"
file = "crates/pav_core/src/behaviors.rs"
lang = "rust"
src = """
let base = match em.pattern {
    Pattern::Aimed => player.map(|p| flat(p + Vec3::Y * 0.9 - muzzle)).unwrap_or(flat(fwd)),
    _ => flat(fwd),
};
    // ...
    Pattern::Ring | Pattern::Spiral => {
        if em.pattern == Pattern::Spiral {
            em.angle += em.spin;
        }
        for i in 0..n {
            let a = yaw0 + (em.angle + 360.0 * i as f32 / n as f32).to_radians();
            dirs.push(Vec3::new(a.sin(), 0.0, a.cos()));
        }
    }
    // ...
    Pattern::Aimed | Pattern::Forward => {
        for i in 0..n {
            let f = if n == 1 { 0.0 } else { i as f32 / (n - 1) as f32 - 0.5 };
            let a = yaw0 + (f * em.spread).to_radians();
            dirs.push(Vec3::new(a.sin(), 0.0, a.cos()));
        }
    }
"""

[[learn.code]]
title = "A bullet against your capsule"
file = "crates/pav_core/src/projectile.rs"
lang = "rust"
src = """
for t in targets {
    if Some(t.id) == p.owner {
        continue;
    }
    let a = t.feet + Vec3::Y * RADIUS;
    let b = t.feet + Vec3::Y * (t.height - RADIUS).max(RADIUS);
    // Test the midpoint and the end so fast bullets don't skip through.
    let d = segment_distance(next, a, b).min(segment_distance(p.pos + step * 0.5, a, b));
    if d < t.radius + p.radius {
        out.hits.push((t.id, next, p.vel.normalize_or(Vec3::X), p.knockback));
        return false;
    }
}
"""

