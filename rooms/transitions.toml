# Screen Transitions (aesthetic wing): fade, iris, diamonds, dissolve, mosaic, blinds.
# GENERATED by a script kept outside the repo; hand-edits are fine.
#   NORTH  a small garden with a gardener and two statues (something to cover and uncover)
#   SOUTH  a pad per transition (it loops: view.filter.transition_demo), SPEED pads, STOP and NONE
name = "Screen Transitions"
about = "Screen transitions you can play on demand: fade, iris, diamonds, dissolve, mosaic and blinds, each a mask worked out per pixel from one number. The last one you pick plays whenever you arrive somewhere new."
try = [
  "Step on IRIS and watch the circle close on you; walk around while it plays: it follows you",
  "Try each kind, then SPEED > QUICK and SLOW",
  "Pick one, step on STOP, then press F2 and go to any room: it plays once when you arrive",
  "NONE turns arrival transitions off; Esc > Look & filters > Screen picks one too",
  "Press H for how they work and the shader code",
]
wing = "aesthetic"
order = 6
primary_device = "keyboard_mouse"
entrance = { at = [14, 21], facing = "south" }

[camera]
tilt = 58.0
distance = 18.0
fov = 40.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "Each pad plays one screen transition over and over, closing on you: a fade, an iris, a wave of diamonds, random blocks, growing pixels and closing blinds. The last one you pick is also what plays when you arrive somewhere new: teleport with F2, or in Shardfall go down a level or through a portal."
how = [
  "A transition is one number, how covered the screen is (0 = clear, 1 = black), plus a kind and a centre (the player's position on screen).",
  "When you arrive somewhere, the game starts at 1 and eases down to 0 over the transition time; the loop on these pads goes up and down forever.",
  "The composite shader turns that number into a mask per pixel: the iris compares each pixel's distance from the centre with a shrinking radius; diamonds compare the diamond distance inside a 56 px cell with a sweep; dissolve gives each block a random threshold; blinds compare the position inside a band.",
  "The mask darkens the finished picture. Mosaic is different: it also enlarges the pixelate block size with the progress, so the picture breaks into blocks before it fades.",
  "Because it is all done on the final image, any transition works with any look, filter or scene, and costs one more step in a pass that already runs.",
]
uses = [
  "Iris: classic cartoons and Nintendo games (Super Mario World's course clear, Zelda's doors and caves).",
  "Fades: almost every game between scenes, deaths and chapters.",
  "Mosaic and dissolve: SNES-era battle and level changes (Final Fantasy, Super Mario World's warp).",
  "Diamonds and blinds: stylish menus and stage changes (Persona's menus, Cuphead's iris and wipes).",
]
ask = [
  "an iris wipe that closes on the player",
  "a screen transition shader driven by one progress value",
  "a diamond-wipe transition between levels",
  "a pixel mosaic transition like the SNES",
  "a quick fade on room change",
]
cost = "A handful of instructions per pixel in the final pass, and nothing when no transition is playing. No extra render targets: it never needs a copy of the previous scene."
knobs = ["view.filter.transition", "view.filter.transition_time", "view.filter.transition_demo"]
terms = ["screen transition", "post-process", "uniform", "fragment shader"]

[[learn.code]]
title = "The iris and the diamond wipe"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = '''
    if (kind == 1u) {
        // The paint plus what the outlines and GI added here, then brush strokes and canvas.
        var c = paint(p, dims, size, post.filt6.z) + (s - bp);
        c *= brush(p, dims, size);
        c *= 1.0 + 0.03 * sin(p.x * 1.9) * sin(p.y * 1.9);
        let under = vec3<f32>(0.42, 0.3, 0.2) * (0.3 + 1.4 * luma(c));
        return mix(under, c, keep);
    }
    if (kind == 2u) {
        return halftone(p, dims, size, keep) * shade;
    }
    if (kind == 3u) {
        return ascii(p, dims, size, keep);
    }
    return sketch(p, s, bp, dims, size, keep);
}

// How much a screen transition covers the pixel at `frag` (1 = covered).
fn transition_cover(frag: vec2<f32>, fd: vec2<f32>) -> f32 {
    let t = clamp(post.filt8.x, 0.0, 1.0);
    let kind = u32(post.filt8.y + 0.5);
    if (kind == 1u) {
        // Iris: a circle around the centre shrinks to nothing.
        let c = post.filt8.zw * fd;
        let far = max(max(length(c), length(c - vec2<f32>(fd.x, 0.0))), max(length(c - vec2<f32>(0.0, fd.y)), length(c - fd)));
        let r = (1.0 - t) * (far + 2.0);
        return smoothstep(r - 1.5, r + 1.5, length(frag - c));
    }
    if (kind == 2u) {
        // Diamonds grow in a wave from left to right.
        let q = abs(fract(frag / 56.0) - 0.5) * 2.0;
        let sweep = t * 2.0 - frag.x / fd.x;
        return smoothstep(-0.03, 0.03, sweep - (q.x + q.y) * 0.5);
}
'''

[[learn.code]]
title = "Arriving: the screen opens on the player"
file = "crates/pav_app/src/app.rs"
lang = "rust"
src = '''
if let Some(t0) = self.arrival {
    let t = t0.elapsed().as_secs_f32() / view.filter.transition_time.max(0.05);
    match view.filter.transition.kind() {
        Some(kind) if t < 1.0 => {
            scene.filter.transition = 1.0 - t * t * (3.0 - 2.0 * t);
            scene.filter.transition_kind = kind;
            scene.filter.transition_center = pav_view::build::screen_uv(&scene.camera, feet + Vec3::Y * 0.9);
        }
        _ => self.arrival = None,
    }
}
'''

