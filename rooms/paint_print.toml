# Paint & Print (aesthetic wing): oil paint, halftone, ASCII and pencil styles on a part of the scene.
# GENERATED by a script kept outside the repo; hand-edits are fine.
#   WEST   a row per style (OIL PAINT, HALFTONE, ASCII, SKETCH) with OFF / ALL / OBJECTS / WORLD, then SIZE and
#          COLOUR rows (they change the current style)
#   CENTRE a village diorama: grass, a path, cottages, swaying trees, a pond, walkers, crates and balls
#   EAST   whole looks from crates/pav_view/src/looks.toml (each sets every look setting); CLEAN resets
name = "Paint & Print"
about = "The picture redrawn: oil paint, halftone print, ASCII characters and pencil sketch, each on the whole scene, only the characters & objects, or only the environment, around a little village with walkers, water and trees. Pads pick the style, where it goes, its size and how much colour it keeps; whole looks on the east."
try = [
  "OIL PAINT > WORLD: a painted village with crisp walkers; OBJECTS paints only them",
  "HALFTONE > ALL, then COLOUR > INK ONLY: from a comic to a newspaper",
  "ASCII > ALL with SIZE > FINE, MEDIUM and BROAD; INK ONLY gives green terminal text",
  "SKETCH > WORLD and stand still: the lines wobble as if redrawn",
  "SIZE > BROAD with OIL PAINT: the strokes swallow the detail",
  "The east pads are whole looks (they also set outlines and shading): COMIC BOOK, PAINTED WORLD, TERMINAL...",
  "Press H for how each style works and the shader code",
]
wing = "aesthetic"
order = 5
primary_device = "keyboard_mouse"
entrance = { at = [22, 26], facing = "south" }

[camera]
tilt = 58.0
distance = 22.0
fov = 40.0

[view]
"cutaway.height_cut" = false

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "The same village drawn four ways. OIL PAINT turns it into flat strokes of colour with brush streaks; HALFTONE prints it in dots of cyan, magenta, yellow and black; ASCII rebuilds it from text characters; SKETCH draws it in pencil hatching. Each can cover the whole scene, only the characters & objects, or only the environment, so a painted world can hold crisp, inked heroes."
how = [
  "All four styles run in the composite shader, after lighting, outlines and tonemapping, on the finished picture. A cheap version of the picture (no outlines or GI) is what they sample around each pixel.",
  "Oil paint is a generalized Kuwahara filter: around each pixel, eight overlapping pie-slice sectors average their colours, and the calmest sectors (least variation) win. Flat areas become single strokes, but edges stay sharp. Streaky noise drawn out along the picture's edges adds brush strokes and ridges.",
  "Halftone turns each ink into a grid of dots turned to its own angle (cyan 15, magenta 75, yellow 0, black 45 degrees). Each dot reads the picture at its centre and grows with the ink there, so dot area tracks darkness.",
  "ASCII splits the screen into cells, averages each cell's brightness and picks one of 12 characters from blank to @ by how much ink it has. The characters are 5 x 7 bitmaps packed into integers, one bit per dot.",
  "Sketch lifts the tones, then adds one family of diagonal hatching for midtones, a crossing family for darker areas and a third for the darkest. Contours come from a Sobel filter (how fast brightness changes); the lines wobble and redraw six times a second.",
  "The part of the scene comes from the normal buffer: characters and objects carry a mark the composite can read per pixel, so the style can be skipped on one part, and the paint never mixes colours across the two.",
]
uses = [
  "Painterly games: Okami (sumi-e ink brush), Gris and Hades (hand-painted worlds behind crisp characters).",
  "Comics: Borderlands' inked cel look, Comix Zone's panels, Hi-Fi Rush's halftone shading, Sable's line art.",
  "Text mode: roguelikes from Rogue to Dwarf Fortress, and ASCII modes as a tribute or a hacker screen.",
  "Sketchy styles: Return of the Obra Dinn's 1-bit engraving look, hand-drawn notebook menus, storyboards and concept previews.",
]
ask = [
  "a Kuwahara oil-paint post-process",
  "CMYK halftone dots like a printed comic",
  "an ASCII-art post-process with a character ramp",
  "pencil hatching that gets denser in shadows",
  "a painted background with crisp, inked characters",
  "newsprint black-and-white halftone",
]
cost = "Halftone (4 lookups per pixel), ASCII (4 per pixel) and sketch (9 per pixel) are cheap. Oil paint reads every pixel in a disc around each pixel: about 3 x radius squared lookups, so 6 px is ~120 per pixel; the brush is capped at 8 px. All of it is one pass with no extra render targets."
knobs = ["view.filter.stylize", "view.filter.stylize_on", "view.filter.stylize_size", "view.filter.stylize_mix", "view.filter.stylize_color"]
terms = ["kuwahara", "halftone", "cmyk", "ascii art", "hatching", "sobel", "post-process", "parts of the scene"]

[[learn.code]]
title = "Kuwahara: the calmest sectors win"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = '''
var acc = vec4<f32>(0.0);
for (var k = 0; k < 8; k++) {
    if (m[k].w <= 0.0) {
        continue;
    }
    let mean = m[k].rgb / m[k].w;
    let v3 = abs(s[k] / m[k].w - mean * mean);
    let wk = 1.0 / (1.0 + pow(8000.0 * (v3.r + v3.g + v3.b), 4.0));
    acc += vec4<f32>(mean * wk, wk);
}
if (acc.w <= 0.0) {
    return base_color(ci, dims);
}
return acc.rgb / acc.w;
'''

[[learn.code]]
title = "One dot screen"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = '''
fn dot_screen(p: vec2<f32>, dims: vec2<i32>, angle: f32, cell: f32, ink: i32) -> f32 {
    let cs = cos(angle);
    let sn = sin(angle);
    let q = vec2<f32>(cs * p.x + sn * p.y, -sn * p.x + cs * p.y) / cell;
    let cq = floor(q) + 0.5;
    let centre = vec2<f32>(cs * cq.x - sn * cq.y, sn * cq.x + cs * cq.y) * cell;
    // Print lightens the midtones a little so the paper shows.
    let col = pow(base_color(vec2<i32>(centre), dims), vec3<f32>(0.75));
    var amount = 1.0 - luma(col);
    if (ink >= 0) {
        amount = cmyk(col, ink);
    }
    let radius = sqrt(amount) * 0.66;
    let aa = 0.8 / cell;
    // Anti-aliased edge; dots smaller than the edge fade out instead of leaving specks.
    return clamp((radius - length(q - cq)) / (2.0 * aa) + 0.5, 0.0, 1.0) * clamp(radius / aa, 0.0, 1.0);
}
'''

[[learn.code]]
title = "Picking a character"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = '''
let idx = u32(clamp(floor(pow(l, 0.8) * 12.0), 0.0, 11.0));
let f = (p - cell * csz) / csz;
let gx = i32(floor(f.x * 7.0)) - 1;
let gy = i32(floor(f.y * 9.0)) - 1;
var on = false;
if (gx >= 0 && gx < 5 && gy >= 0 && gy < 7) {
    // " .-:+=o&*8#@"
    var top = array<u32, 12>(0u, 0u, 491520u, 6336u, 1020032u, 31744u, 571392u, 206118u, 1030816u, 476718u, 359754u, 718382u);
    var bottom = array<u32, 12>(0u, 6336u, 0u, 198u, 132u, 31u, 14897u, 22837u, 686u, 14897u, 10591u, 30781u);
    var bits = top[idx] >> u32(gx + 5 * gy);
    if (gy >= 4) {
        bits = bottom[idx] >> u32(gx + 5 * (gy - 4));
    }
    on = (bits & 1u) == 1u;
}
'''

