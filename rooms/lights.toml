# Lights & Shadows: a dusk room where every light feature can be seen and played with.
#   NORTH-WEST  TORCH HALL: pillars and crates lit by three flickering, shadow-casting torches
#   NORTH       COLOUR MIXING: red, green and blue lights add up on a white plate and sphere
#   NORTH-EAST  SUN DIAL: pads change the sun (dawn, noon, dusk, night, reset); an obelisk and an
#               arch swing their sun shadows; the SHADOW SWITCH area below has more shadow casters
#   SOUTH-WEST  PULSE & FLICKER: five lamps with different flicker and pulse settings
#   SOUTH       MOVING LIGHT: a lantern glides along a track past a row of posts and sweeps their shadows
#   SOUTH-EAST  SHADOW SWITCH: sun shadows on/off pads beside a little stone garden
# Only the 4 shadow lights nearest the player get shadow maps: this room has exactly 4 (three
# torches and the lantern), so every one of them always casts. Sun settings set by pads last until
# you leave the room.
# Sun azimuths are WORLD compass values (the sun does not turn with the room): this room sits on the
# west side of the vfx corridor with its entrance facing east, so world azimuth = layout azimuth + 270.
# Low suns are chosen so the 3 m walls do not shade the dial: dawn and dusk come from the south and
# west of the layout. Sun light on the floor is sun_intensity * sin(elevation), so low suns need a
# high intensity to show shadows at all. The sky colour only shows beyond the walls.
name = "Lights & Shadows"
about = "A dusk room for lighting: flickering shadow-casting torches, red/green/blue lights that add up, pulsing lamps, a lantern sweeping shadows across the floor, and pads that turn the sun from dawn to night."
try = [
  "Walk through the TORCH HALL and watch the pillars and your own shadow swing around the torches",
  "Stand in the COLOUR MIXING plate: where red, green and blue overlap you get yellow, cyan, magenta and white",
  "Compare the five lamps in PULSE & FLICKER: flicker 0 / 0.5 / 1 and pulse 0.5 / 2",
  "Follow the lantern gliding along the MOVING LIGHT track and watch the post shadows sweep across the floor",
  "Step on NOON, then DAWN and DUSK, and watch the obelisk and arch shadows swing around",
  "Step on NIGHT for a nearly dark room where only the lamps and torches light things",
  "Step on DAWN or DUSK, then SHADOWS OFF and SHADOWS ON, to compare the sun with and without shadows",
  "Step on RESET to go back to the room's own dusk (all sun settings last until you leave)",
]
wing = "vfx"
order = 1
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 55.0
distance = 16.0

# Dusk: a low, dim sun, little ambient light, a dark sky and a touch of bloom. The RESET pad
# repeats these values.
[view]
"light.sun_elevation" = 22.0
"light.sun_azimuth" = 235
"light.sun_intensity" = 0.12
"light.ambient" = 0.32
"light.shadows" = true
sky = "#141a30"
style = "lit"
bloom = 0.5

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "Every lamp here is a point light: three flickering torches in the TORCH HALL swing the pillar shadows (and yours) around, red, green and blue lamps add up to yellow, cyan, magenta and white on the COLOUR MIXING plate, five lamps in PULSE & FLICKER show the two animations, and a lantern sweeps post shadows along the MOVING LIGHT track. The SUN DIAL pads move the sun from dawn to night and the SHADOW SWITCH turns its shadows off."
how = [
  "The sun is a directional light with one 2048 x 2048 shadow map: the scene's depth is drawn once as seen from the sun, then each pixel asks whether something nearer the sun covers it. Nine neighbouring texels are tested and averaged (PCF), which softens the shadow's edge.",
  "Point lights are a list of up to 64 (position, colour, radius). Every pixel loops over them and adds colour x (1 - distance / radius) squared x how directly the surface faces the lamp, so each light fades to exactly zero at its radius.",
  "Colours add per channel: red and green light on the white plate make yellow, all three make white.",
  "A shadow-casting lamp needs six depth maps of 512 x 512, one per axis direction (90-degree views that together cover a cube). Only the 4 nearest the player get them; this room has exactly four, the three torches and the lantern.",
  "Flicker and pulse are worked out on the CPU every frame: flicker mixes three sine waves of different speeds into a wobble that dims the lamp by up to 70%; pulse is one slow sine between 10% and full, at that many beats per second.",
  "Lamp halos (view.halos) light the air around each point light. The light scattered along a view ray past a lamp has a closed form (an arctangent), so the composite adds the glow without marching through the air.",
]
uses = [
  "Torchlit dungeons: flickering lights with moving shadows; Doom 3 built its whole look on dynamic per-pixel lights and shadows.",
  "Time of day: a moving sun with long dawn and dusk shadows (The Legend of Zelda: Breath of the Wild, Red Dead Redemption 2).",
  "Carried lights: a lantern or flashlight that sweeps shadows as you move (Amnesia: The Dark Descent, Alan Wake).",
  "Signals and mood: pulsing alarm lamps, flickering broken bulbs and coloured lights that mix on walls.",
]
ask = [
  "flickering torches with point-light shadows",
  "day and night sun with long dusk shadows",
  "pulsing alarm lamp",
  "lantern that sweeps shadows as it moves",
  "RGB lights that mix on a white wall",
  "glowing halos around lamps in the air",
]
cost = "Every pixel loops over all point lights (up to 64), so cost grows with lights x pixels. Shadows cost the most: each shadow-casting lamp redraws the scene six times into its 512 x 512 maps and the sun redraws it once into 2048 x 2048, which is why only four lamps get shadows. Halos add a short loop over the lights per pixel when they are on."
knobs = ["view.light.sun_elevation", "view.light.sun_azimuth", "view.light.sun_intensity", "view.light.ambient", "view.light.shadows", "view.halos"]
terms = ["point light", "shadow map", "pcf", "halo", "volumetric light", "specular", "hdr"]

[[learn.code]]
title = "Point lights fade to zero at their radius"
file = "crates/pav_render/src/shaders/scene.wgsl"
lang = "wgsl"
src = """
let count = u32(g.params.y);
for (var i = 0u; i < count; i++) {
    let pl = point_lights[i];
    let d = pl.pos_radius.xyz - p;
    let dist = length(d);
    let r = pl.pos_radius.w;
    if (dist < r) {
        let ld = d / max(dist, 1e-4);
        var att = pow(clamp(1.0 - dist / r, 0.0, 1.0), 2.0);
        if (pl.color.w > 0.5 && (flags & FLAG_NO_RECEIVE_SHADOW) == 0u) {
            att *= point_shadow_factor(u32(pl.color.w - 0.5), pl.pos_radius.xyz, p, n);
        }
        var k = max(dot(n, ld), 0.0) * att;
        // ...
        col += albedo * pl.color.rgb * k;
    }
}
"""

[[learn.code]]
title = "Six views per shadow-casting lamp"
file = "crates/pav_render/src/shadows.rs"
lang = "rust"
src = """
pub fn face_matrices(pos: Vec3, radius: f32) -> [(Vec3, Mat4); 6] {
    let proj = glam::camera::rh::proj::directx::perspective(std::f32::consts::FRAC_PI_2, 1.0, NEAR, radius.max(NEAR * 4.0));
    let dirs = [
        (Vec3::X, Vec3::Y),
        (Vec3::NEG_X, Vec3::Y),
        (Vec3::Y, Vec3::Z),
        (Vec3::NEG_Y, Vec3::Z),
        (Vec3::Z, Vec3::Y),
        (Vec3::NEG_Z, Vec3::Y),
    ];
    dirs.map(|(d, up)| (d, proj * glam::camera::rh::view::look_to_mat4(pos, d, up)))
}
"""

[[learn.code]]
title = "Flicker and pulse"
file = "crates/pav_view/src/fx.rs"
lang = "rust"
src = """
let mut k = def.intensity;
if def.flicker > 0.0 {
    let n = (t * 13.0 + seed).sin() * 0.5 + (t * 7.3 + seed * 1.7).sin() * 0.3 + (t * 23.0 + seed * 0.3).sin() * 0.2;
    k *= 1.0 - def.flicker * 0.7 * (n * 0.5 + 0.5);
}
if def.pulse > 0.0 {
    k *= 0.55 + 0.45 * (t * def.pulse * std::f32::consts::TAU + seed).sin();
}
"""

