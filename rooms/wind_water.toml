# Wind & Water (vfx wing): grass and foliage in the wind (vertex shader), a rippling pond (CPU wave equation).
# GENERATED by a script kept outside the repo; hand-edits are fine.
#   WEST   the meadow: grass legend cells (`grass = { density, height, color }`), trees with swaying
#          canopies (`sway = "leaves"`), banners, tall reeds along the pond
#   EAST   the pond: a step, a wading ring (0.5 m) and a deep middle (1.8 m); one surface, a ball dropper above it
#   SOUTH  pads: WIND, TOWARD and WATER rows; DROP / CLEAR send the dropper's signals
name = "Wind & Water"
about = "Things that move by themselves: a meadow of grass and swaying trees in gusty wind (vertex animation on the GPU), and a pond whose surface is a wave simulation on the CPU, rippling wherever something moves through it. Pads change the wind, its direction and the water."
try = [
  "Walk into the tall grass: it parts around your feet. NO PUSH turns that off",
  "WIND > GALE, then STORM: waves roll over the meadow along the wind; TOWARD turns it",
  "Wade into the POND and walk around: you leave a wake. The middle is deep: swim",
  "DROP balls into the pond and watch the rings; FAST and SLOW change the wave speed, LONG FADE keeps it sloshing",
  "RAIN on the water; STILL turns the simulation off so you can compare with a flat pond",
  "Throw a bomb (F) into the water: a big dent and a ring",
  "Press H for how it works, the settings, the code and the words",
]
wing = "vfx"
order = 7
primary_device = "keyboard_mouse"
entrance = { at = [20, 29], facing = "south" }

[camera]
tilt = 55.0
distance = 19.0
fov = 42.0

[view]
"light.sun_elevation" = 50.0
"light.sun_azimuth" = 200.0
"light.sun_intensity" = 0.75
sky = "#9cc4e0"
wind = 0.9
wind_angle = 60.0
wind_gusts = 1.1
"cutaway.height_cut" = false

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "A meadow and a pond, both moving. Thousands of grass tufts bend in waves as gusts roll across, the tree canopies and banners sway, and the grass parts around your feet. In the pond, everything that moves through the water leaves rings: you wading, the walker, dropped balls, raindrops. The rings spread, bounce off the edges and fade."
how = [
  "Wind is vertex animation: the scene's vertex shader moves each grass and leaf vertex sideways, more the higher it is above the bottom of its instance (grass with the square of its height, so blades curve).",
  "Gusts are a slow wave travelling along the wind direction (a sine of position along the wind minus time), so neighbouring tufts move together and you see waves roll over the meadow; a faster flutter rides on top.",
  "Grass also bends away from one point, your feet, within 0.9 m; a bent blade sinks a little so it seems to keep its length. The shadow pass uses the same code, so shadows sway too.",
  "Water is a CPU simulation: each water zone gets a grid of heights (cells about 14 cm). Every step, each point accelerates toward the average of its four neighbours (the wave equation), the edges reflect, and a damping factor makes ripples fade.",
  "Things crossing the waterline push the surface down where they are, in proportion to their speed; splashes and explosions drop in bigger dents and rain drops small ones at random.",
  "Every frame the grid becomes a mesh. Its vertex colours are lighter where a slope faces the sun and foamy on crests, so ripples show even in flat or cel shading.",
]
uses = [
  "Open-world grass: fields that ripple in the wind and part around the player (Breath of the Wild, Ghost of Tsushima).",
  "Foliage everywhere: swaying trees and bushes are vertex animation in almost every 3D game since the 2000s.",
  "Interactive water: ripples under the player, rain on puddles and ponds (Mario Sunshine, Okami, Ori's pools).",
  "Juice: splash rings when something lands in water, wakes behind boats and swimmers.",
]
ask = [
  "vertex-shader wind on grass and trees with rolling gusts",
  "grass that bends away from the player",
  "a wave-equation ripple simulation for water",
  "rain drops making rings on puddles",
  "wakes behind things moving through water",
]
cost = "Wind costs a few instructions per vertex on the GPU and nothing on the CPU; thousands of tufts are one instanced draw. The water costs about 5 operations per grid cell per step on the CPU (a 16 x 14 m pond is about 11,000 cells), then uploading the mesh each frame; big lakes get coarser cells (at most 160 x 160)."
knobs = ["view.wind", "view.wind_angle", "view.wind_gusts", "view.grass_push", "view.water_ripples", "view.water_speed", "view.water_fade", "view.water_rain"]
terms = ["vertex animation", "wind", "vertex shader", "instancing", "wave equation", "heightfield"]

[[learn.code]]
title = "Wind in the vertex shader"
file = "crates/pav_render/src/shaders/scene.wgsl"
lang = "wgsl"
src = '''
fn wind_offset(world: vec3<f32>, h: f32, grass: bool) -> vec3<f32> {
    let w = g.wind;
    let t = g.params.x;
    let dir = vec3<f32>(w.x, 0.0, w.y);
    let along = dot(world.xz, w.xy);
    let gust = 0.6 + 0.4 * sin(along * 0.25 - t * 1.6 * max(w.w, 0.05)) + 0.25 * sin(along * 0.61 - t * 2.9 * max(w.w, 0.05));
    let flutter = sin(t * 4.7 + world.x * 1.31 + world.z * 0.93);
    var k = h * 0.045;
    if (grass) {
        k = h * h * 1.6;
    }
    var off = dir * (w.z * gust * k) + vec3<f32>(-w.y, 0.0, w.x) * (w.z * flutter * k * 0.18);
    if (grass) {
        if (g.push.w > 0.0) {
            let d = world.xz - g.push.xz;
            let dist = length(d);
            if (dist < g.push.w && abs(world.y - g.push.y) < 1.5) {
                let s = 1.0 - dist / g.push.w;
                off += vec3<f32>(d.x, 0.0, d.y) / max(dist, 1e-3) * s * s * h * 1.3;
            }
        }
        let l = length(off.xz);
        off.y -= min(l * l / max(h, 0.05) * 0.5, h * 0.8);
    }
    return off;
}
'''

[[learn.code]]
title = "One step of the wave equation"
file = "crates/pav_view/src/water.rs"
lang = "rust"
src = '''
let c = s.speed * h / self.cell;
let c2 = (c * c).min(0.45);
// Damping the velocity by d per step shrinks the amplitude by about sqrt(d): square the
// per-step factor so `fade` is the amplitude's half-life.
let damp = 0.25f32.powf(h / s.fade.max(0.05));
let (nx, nz) = (self.nx, self.nz);
let mut next = std::mem::take(&mut self.prev);
for j in 0..=nz {
    for i in 0..=nx {
        let k = j * (nx + 1) + i;
        let at = |ii: usize, jj: usize| self.h[jj * (nx + 1) + ii];
        let l = at(i.saturating_sub(1), j);
        let r = at((i + 1).min(nx), j);
        let u = at(i, j.saturating_sub(1));
        let d = at(i, (j + 1).min(nz));
        let lap = l + r + u + d - 4.0 * self.h[k];
        // A weak spring back to the waterline settles what the waves leave behind.
        let rest = -0.002 * self.h[k];
        next[k] = (self.h[k] + (self.h[k] - next[k]) * damp + c2 * lap + rest).clamp(-MAX_HEIGHT, MAX_HEIGHT);
    }
}
self.prev = std::mem::replace(&mut self.h, next);
'''

[[learn.code]]
title = "Things moving through the water push it down"
file = "crates/pav_view/src/water.rs"
lang = "rust"
src = '''
if let Some(last) = self.seen.get(&o.id.0) {
    let v = (o.pos - *last) / h;
    let push = (Vec3::new(v.x, 0.0, v.z).length() * 0.006 + v.y.abs() * 0.02).min(0.06);
    if push > 0.0005 {
        self.dent(o.pos, radius, push);
    }
} else {
    // Just fell in (or walked in): a splash.
    self.dent(o.pos, radius * 1.4, 0.08);
}
'''

