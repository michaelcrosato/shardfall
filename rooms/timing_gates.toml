# --- the course objects (all kinematic, positions in layout space: x = column, z = row) ---------
# Vectors are in the object's own frame. A `move` goes from `pos` (amount 0) to `pos + offset`
# (amount 1); `hold` is the share of the cycle spent waiting at the ends.

# 1. SLIDING DOORS: four wall-to-wall slabs (0.8 x 2.5 m) that slide up 2.6 m, clear of the 1.7 m
# player, and drop back down. Period 3 s with hold 0.4: a door is open for about 1.1 s of every 3 s.
# The phases make a wave through doors 1-2, a stop at door 3 and another wave through door 4.
