# Timing Gates: a timed obstacle course through five sections of moving obstacles. Every mover
# is a kinematic object whose motion is a pure function of time, so the rhythm is the same on
# every run and you can learn it.
name = "Timing Gates"
about = "A timed obstacle course from START to FINISH through five sections of moving obstacles: sliding doors, crushers, sweepers, platforms over a pit and pendulums. Read the rhythm, pick your moment, and use the checkpoints between the sections."
try = [
  "Walk out of the green START pad to start the clock, and run the course to the checkered FINISH",
  "Sliding doors: wait in the bays between the doors; each one opens on its own beat",
  "Crushers: sneak under while the block is up (touching one sends you back to the checkpoint); some are split in two lanes that take turns",
  "Sweepers: the bars are knee high, so jump over them (a hit knocks you back)",
  "Moving platforms: step onto a platform when it docks, ride it over the pit and step off on the pier (falling respawns you at the last checkpoint)",
  "Pendulums: cross the swing when the bob is at the far side of the corridor",
  "Beat your best time: the course HUD shows the timer, hits and falls",
]
wing = "movement"
order = 4
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [3, 29], facing = "south" }

[camera]
tilt = 64.0
distance = 18.0

[layout]
origin = [-18.0, 0.0, -15.0]

[[layout.layer]]
y = 0
map = '''
####################################
#eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeefFf#
#eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeFfF#
#eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeefFf#
#eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeFfF#
#eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeefFf#
#eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeFfF#
#JJJJeeeeeeeeeeeeeeeeeeeeeeeeeeefFf#
#JJJJ%%%%%%%%XXXXXXXXXXXXXXX%%%%%%%#
#LLLLLLLLLLLL______kkk______LLLLLLL#
#LLLLLLLLLLLL______kkk______LLLLLLL#
#LLLLLLLLLLLL______kkk______LLLLLLL#
#LLLLLLLLLLLL______kkk______LLLLLLL#
#LLLLLLLLLLLL______kkk______LLLKKKK#
#%%%%%%%%%%%%XXXXXXXXXXXXXXX%%%KKKK#
#cccccccccccccccccccccccccccccccccc#
#cccccccccccccccccccccccccccccccccc#
#cccccccccccccccccccccccccccccccccc#
#JJJJcccccccccccccccccccccccccccccc#
#JJJJ%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbKKKK#
#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%KKKK#
#aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa#
#aSSSaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa#
#aSSSaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa#
#aSSSaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa#
###..###############################
'''


# --- tiles ------------------------------------------------------------------------------
# Floors are tinted per section so you always know where you are.
[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d5d9cf" }]

[layout.legend.'a']          # 1 doors
blocks = [{ y0 = -0.5, y1 = 0, color = "#e6dcc4" }]
[layout.legend.'b']          # 2 crushers
blocks = [{ y0 = -0.5, y1 = 0, color = "#e5d0c8" }]
[layout.legend.'c']          # 3 sweepers
blocks = [{ y0 = -0.5, y1 = 0, color = "#cde0e6" }]
[layout.legend.'e']          # 5 pendulums
blocks = [{ y0 = -0.5, y1 = 0, color = "#dcd3e8" }]

# Outer wall (2.8 m) and the taller partitions between the sections (too high to ledge-grab).
[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d5d9cf" }, { y0 = 0, y1 = 2.8, color = "#b9c3cf" }]
[layout.legend.'%']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d5d9cf" }, { y0 = 0, y1 = 3.6, color = "#a6b2c2" }]

# The pit: ledges and partitions go down to the pit floor (y -4); the floor is y -4 .. -3.5 and
# the kill zone sits just above it (y -3.4 .. -1), so a fall respawns you at the last checkpoint.
[layout.legend.'L']
blocks = [{ y0 = -4.0, y1 = 0, color = "#c4d0bc" }]
[layout.legend.'X']
blocks = [{ y0 = -4.0, y1 = 0, color = "#c4d0bc" }, { y0 = 0, y1 = 3.6, color = "#a6b2c2" }]
[layout.legend.'_']
blocks = [{ y0 = -4.0, y1 = -3.5, color = "#4b525c" }]
zone = { kind = "kill", y0 = -3.4, y1 = -1.0 }

# START (leaving it starts the clock), CHECKPOINTs (respawn points; `facing` = the way you
# face after a respawn) and the checkered FINISH.
[layout.legend.'S']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfe3cf" }]
zone = { kind = "start", course = "timing", facing = "east", label = "START" }

[layout.legend.'K']          # checkpoint, the way on leads west
blocks = [{ y0 = -0.5, y1 = 0, color = "#f1e6b8" }]
zone = { kind = "checkpoint", facing = "west", label = "CHECKPOINT" }
[layout.legend.'J']          # checkpoint, the way on leads east
blocks = [{ y0 = -0.5, y1 = 0, color = "#f1e6b8" }]
zone = { kind = "checkpoint", facing = "east", label = "CHECKPOINT" }
[layout.legend.'k']          # checkpoint on the pier in the pit
blocks = [{ y0 = -4.0, y1 = 0, color = "#f1e6b8" }]
zone = { kind = "checkpoint", facing = "west", label = "CHECKPOINT" }

[layout.legend.'F']
blocks = [{ y0 = -0.5, y1 = 0, color = "#f4f4ee", look = "flat" }]
zone = { kind = "finish", course = "timing", color = "none" }
[layout.legend.'f']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2b2d35", look = "flat" }]
zone = { kind = "finish", course = "timing", color = "none" }



# 1. SLIDING DOORS: wall-to-wall slabs that slide up out of the way and drop back down.
# Every door has its own phase, so you stop in the bays and wait for the next opening.
