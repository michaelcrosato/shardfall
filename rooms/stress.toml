# Stress test: pile up hundreds of rigid bodies and watch the cost per tick in the physics
# overlay (it opens automatically here). Pads send signals to the spawners above the arena.
name = "Stress Test"
about = "Drop hundreds of bodies into the arena and watch the simulation cost: the physics overlay shows ticks per second, milliseconds per tick against the budget, bodies, sleeping bodies and contacts."
try = [
  "Step on +100 / +500 pads to drop boxes, balls and capsules into the arena",
  "Watch the physics overlay: ms per tick vs the budget line, contacts, sleeping bodies",
  "Throw bombs (F / click) into the pile and watch everything wake up",
  "Walk into the fenced corner (south-east) for a bullet storm of thousands of projectiles",
  "CLEAR removes everything; F9 / F8 change the simulation speed",
]
wing = "physics"
order = 7
primary_device = "keyboard_mouse"
movement_model = "instant"
overlays = ["physics"]
entrance = { at = [15, 27], facing = "south" }

[camera]
tilt = 58.0
distance = 26.0

[layout]
origin = [-16.0, 0.0, -14.0]

[[layout.layer]]
y = 0
map = '''
################################
#..............................#
#..............................#
#.....wwwwwwwwwwwwwwwwwwww.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....w..................w.....#
#.....wwwwwwwwwwwwwwwwwwww.....#
#..............................#
#..............................#
#..............................#
#.aaa..bbb..ccc..ddd..eee..xxx.#
#.aaa..bbb..ccc..ddd..eee..xxx.#
#........................ffffff#
#........................f.....#
#..............................#
#........................f.....#
#........................f.....#
###############..###############
'''

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }, { y0 = 0, y1 = 4.0, color = "#aab3bf" }]

# Arena rim: knee-high so the pile stays inside but you can see in.
[layout.legend.'w']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }, { y0 = 0, y1 = 0.9, color = "#8e99a8" }]

# Fence of the bullet corner.
[layout.legend.'f']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }, { y0 = 0, y1 = 2.5, color = "#7d6f8f" }]

[layout.legend.'a']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }]
zone = { kind = "pad", label = "+100 BOXES", color = "#e8704a", signal = "boxes100" }

[layout.legend.'b']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }]
zone = { kind = "pad", label = "+100 BALLS", color = "#5b8def", signal = "balls100" }

[layout.legend.'c']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }]
zone = { kind = "pad", label = "+100 CAPSULES", color = "#3bb273", signal = "caps100" }

[layout.legend.'d']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }]
zone = { kind = "pad", label = "+500 BOXES", color = "#c0392b", signal = "boxes500" }

[layout.legend.'e']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }]
zone = { kind = "pad", label = "+500 MIXED", color = "#8e44ad", signal = "mixed500" }

[layout.legend.'x']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c9cdd3" }]
zone = { kind = "pad", label = "CLEAR", color = "#2b2d35", signal = "clear" }

[[label]]
text = "STRESS TEST"
pos = [16.0, 0.03, 18.2]
size = 0.8

[[label]]
text = "BULLET STORM"
pos = [28.0, 0.03, 21.2]
size = 0.4

# Spawners hover over the arena (body = "none"); each listens to one pad and to "clear".
[[object]]
name = "boxes"
shape = { type = "sphere", radius = 0.1 }
pos = [16.0, 6.0, 9.5]
body = "none"
behavior = { type = "spawner", shape = { type = "box", half = [0.3, 0.3, 0.3] }, count = 100, max = 1500, area = [8.0, 1.5, 5.0], signal = "boxes100", clear = "clear" }

[[object]]
name = "boxes_big"
shape = { type = "sphere", radius = 0.1 }
pos = [16.0, 7.0, 9.5]
body = "none"
behavior = { type = "spawner", shape = { type = "box", half = [0.25, 0.25, 0.25] }, count = 500, max = 2000, area = [8.0, 2.0, 5.0], signal = "boxes500", clear = "clear" }

[[object]]
name = "balls"
shape = { type = "sphere", radius = 0.1 }
pos = [16.0, 6.0, 9.5]
body = "none"
behavior = { type = "spawner", shape = { type = "sphere", radius = 0.3 }, count = 100, max = 1500, area = [8.0, 1.5, 5.0], restitution = 0.3, signal = "balls100", clear = "clear" }

[[object]]
name = "capsules"
shape = { type = "sphere", radius = 0.1 }
pos = [16.0, 6.0, 9.5]
body = "none"
behavior = { type = "spawner", shape = { type = "capsule", half_height = 0.25, radius = 0.18 }, count = 100, max = 1500, area = [8.0, 1.5, 5.0], signal = "caps100", clear = "clear" }

[[object]]
name = "mixed_a"
shape = { type = "sphere", radius = 0.1 }
pos = [16.0, 7.0, 9.5]
body = "none"
behavior = { type = "spawner", shape = { type = "rounded_box", half = [0.35, 0.2, 0.25], radius = 0.08 }, count = 250, max = 1500, area = [8.0, 2.0, 5.0], signal = "mixed500", clear = "clear" }

[[object]]
name = "mixed_b"
shape = { type = "sphere", radius = 0.1 }
pos = [16.0, 7.5, 9.5]
body = "none"
behavior = { type = "spawner", shape = { type = "cylinder", half_height = 0.25, radius = 0.22 }, count = 250, max = 1500, area = [8.0, 2.0, 5.0], signal = "mixed500", clear = "clear" }

# Bullet storm: two spirals that only fire while you are in the corner.
[[object]]
name = "storm_a"
shape = { type = "sphere", radius = 0.25 }
pos = [28.0, 1.0, 24.5]
color = "#f15bb5"
body = "none"
look = "unlit"
emissive = 1.0
behavior = { type = "emitter", pattern = "spiral", count = 24, interval = 0.05, speed = 2.5, spin = 7, life = 6, radius = 0.08, range = 5.0, knockback = 2, color = "#f15bb5" }

[[object]]
name = "storm_b"
shape = { type = "sphere", radius = 0.25 }
pos = [28.0, 1.0, 24.5]
color = "#00bbf9"
body = "none"
look = "unlit"
emissive = 1.0
behavior = { type = "emitter", pattern = "spiral", count = 24, interval = 0.05, speed = 2.0, spin = -9, life = 6, radius = 0.08, range = 5.0, knockback = 2, color = "#00bbf9", height = 0.6 }
