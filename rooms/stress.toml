# Stress test: pile up hundreds of rigid bodies and watch the cost per tick in the physics
# overlay (it opens automatically here). Pads send signals to the spawners above the arena.
name = "Stress Test"
about = "Drop hundreds of bodies into the arena and watch the simulation cost: the physics overlay shows ticks per second, milliseconds per tick against the budget, bodies, sleeping bodies and contacts."
try = [
  "Step on +100 / +500 pads to drop boxes, balls and capsules into the arena",
  "Watch the physics overlay: ms per tick vs the budget line, contacts, sleeping bodies",
  "Throw bombs (F / click) into the pile and watch everything wake up",
  "Walk into the fenced corner (south-east) for a bullet storm of thousands of projectiles",
  "CLEAR removes everything; F9 / F8 change the simulation speed",
]
wing = "physics"
order = 7
primary_device = "keyboard_mouse"
movement_model = "instant"
overlays = ["physics"]
entrance = { at = [15, 27], facing = "south" }

[camera]
tilt = 58.0
distance = 26.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "An empty arena with a knee-high rim and spawners hovering above it. The +100 and +500 pads rain boxes, balls, capsules, rounded boxes and cylinders into the pit, and the physics overlay counts the cost: ticks per second, milliseconds per tick against the budget line, moving and sleeping bodies, contacts and projectiles. The fenced BULLET STORM corner fires two spirals of bullets while you stand in it."
how = [
  "Spawners listen for the pad's signal and drop their bodies at most 25 per tick, so a +500 lands over 20 ticks instead of all at once.",
  "Every tick Rapier finds pairs of colliders whose bounding boxes overlap (broad phase), works out the exact contact points of each pair (narrow phase), then solves all contacts together in 4 iterations, starting from last tick's answer (warm starting).",
  "Sleeping: a body slower than 5 cm/s for half a second goes to sleep with its island (everything touching it) and drops out of the solver. Watch the asleep count climb and ms per tick fall once the pile settles; a bomb wakes everything within its reach plus 4 m.",
  "The budget: the simulation runs at a fixed rate (sim.tick_rate, 60 ticks per second), so one tick may take 16.7 ms. When ticks run long, the host runs up to 8 per frame to catch up, then drops time, so the game slows down instead of locking up.",
  "Bullets are not physics bodies: they are plain structs moved in a loop, tested against character capsules and stopped by one ray cast against static walls. That is why thousands of them cost less than a few hundred boxes.",
  "Rewind keeps a full copy of the world every 20 ticks for sim.history_seconds, so a big pile also makes every snapshot bigger.",
]
uses = [
  "Physics sandboxes: Garry's Mod servers are famous for slowing to a crawl when players spawn too many props.",
  "Bullet hell: Touhou and other danmaku shooters fill the screen with thousands of simple bullets, never physics bodies.",
  "Profilers: Unreal's stat unit and Unity's Profiler graph time per frame against a budget, like this overlay does per tick.",
  "Debris budgets: games cap rubble and shell casings and remove the oldest first, as these spawners do beyond their max.",
]
ask = [
  "physics stress test with hundreds of rigid bodies",
  "performance overlay with ms per tick against the budget",
  "sleeping bodies so settled piles cost nothing",
  "bullet hell with thousands of cheap projectiles",
  "spawner that spreads a big drop over several frames",
  "cap on debris that removes the oldest pieces",
]
cost = "All CPU, on the simulation thread. Cost follows awake bodies and above all contacts: a settled pile sleeps and costs little, the same pile tumbling after a bomb costs many times more. Curved shapes (cylinders, rounded boxes) need a slower general contact test than boxes and balls, and every rewind snapshot copies the whole pile."
knobs = ["sim.tick_rate", "sim.history_seconds", "sim.gravity", "bombs.radius", "bombs.push"]
terms = ["rigid body", "fixed timestep", "determinism", "raycast", "instancing", "draw call"]

[[learn.code]]
title = "What the overlay counts"
file = "crates/pav_core/src/sim.rs"
lang = "rust"
src = """
let (mut dynamic, mut sleeping) = (0, 0);
for (_, b) in ph.bodies.iter() {
    if b.is_dynamic() {
        dynamic += 1;
        if b.is_sleeping() {
            sleeping += 1;
        }
    }
}
crate::frame::PhysicsStats {
    dynamic,
    sleeping,
    colliders: ph.colliders.len(),
    // ...
    contacts: ph.narrow_phase.contact_pairs().filter(|p| p.has_any_active_contact()).count(),
    projectiles: self.state.projectiles.list.len(),
}
"""

[[learn.code]]
title = "Catch up 8 ticks at most, then drop time"
file = "crates/pav_app/src/simhost.rs"
lang = "rust"
src = """
let mut n = 0;
while now >= self.next && n < 8 {
    self.next += Duration::from_secs_f32(tick_wall);
    tick_once(sim, self.next);
    n += 1;
}
if n == 8 && now > self.next {
    self.next = now; // too far behind: drop time instead of spiralling
}
"""

[[learn.code]]
title = "Spawners spread a big drop over several ticks"
file = "crates/pav_core/src/behaviors.rs"
lang = "rust"
src = """
// Spread big drops over several ticks.
let n = sp.pending.min(25);
sp.pending -= n;
for _ in 0..n {
    let rng = &mut self.state.rng;
    let off = Vec3::new(rng.range(-1.0, 1.0), rng.range(-1.0, 1.0), rng.range(-1.0, 1.0)) * sp.area;
    // ...
}
while sp.spawned.len() > sp.max as usize {
    if let Some(old) = sp.spawned.pop_front() {
        self.despawn(old);
    }
}
"""

