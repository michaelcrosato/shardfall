#FFFFFFFFFFF..FFFFFFFFFFF..............#
#FsssssssssF..FrrrrrrrrrF...pppppppppp.#
#FsssssssssF..FrrrrrrrrrF...pppppppppp.#
#FsssssssssF..FrrrrrrrrrF...pppppppppp.#
#FsssssssssF..FrrrrrrrrrF...pppppppppp.#
#FsssssssssF..FrrrrrrrrrF...pppppppppp.#
#FsssssssssF..FrrrrrrrrrF...pppppppppp.#
#FsssssssssF..FrrrrrrrrrF...pppppppppp.#
#FFFFFssFFFF..FFFFFrrFFFF..............#
#......................................#
#.tttttttttttttttttttttttttttttttttttt.#
#.tttttttttttttttttttttttttttttttttttt.#
#.tttttttttttttttttttttttttttttttttttt.#
#.tttttttttttttttttttttttttttttttttttt.#
#......................................#
#...........................ggggggggggg#
#..ddddddddd................ggggggggggg#
#..ddddddddd................ggggggggggg#
#..ddddddddd................ggggggggggg#
#..ddddddddd................ggggggggggg#
