# Dark floors (so the bullets glow) in three tints that tell the stages apart from above.
[layout.legend.'a']
blocks = [{ y0 = -0.5, y1 = 0, color = "#171b2e" }]

[layout.legend.'b']
blocks = [{ y0 = -0.5, y1 = 0, color = "#1c2138" }]

[layout.legend.'c']
blocks = [{ y0 = -0.5, y1 = 0, color = "#1e1833" }]

[layout.legend.'d']
blocks = [{ y0 = -0.5, y1 = 0, color = "#241d3c" }]

[layout.legend.'e']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2c161d" }]

[layout.legend.'f']
blocks = [{ y0 = -0.5, y1 = 0, color = "#341b24" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#171b2e" }, { y0 = 0, y1 = 3.0, color = "#4a5472" }]

# START strip: leaving it (walking north) starts the timer.
[layout.legend.'S']
blocks = [{ y0 = -0.5, y1 = 0, color = "#1d3a2a" }]
zone = { kind = "start", course = "arena", label = "START", facing = "north" }

# Barriers between the stages: 2 m, stop bullets.
[layout.legend.'B']
blocks = [{ y0 = -0.5, y1 = 0, color = "#171b2e" }, { y0 = 0, y1 = 2.0, color = "#5a6690" }]

# Cover pillars: 2 m, stop bullets.
[layout.legend.'p']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2c161d" }, { y0 = 0, y1 = 2.0, color = "#8e9bc0", rounded = true }]

# FINISH pocket (sealed): the boss kill finishes the course by itself.
[layout.legend.'F']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2c161d" }]
zone = { kind = "finish", course = "arena", label = "FINISH" }

