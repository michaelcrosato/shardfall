# Bullet Hell: a top-down shoot-'em-up arena. You always fire north (hold the button), the
# enemies fill the screen with bullets, and the course ends when the boss goes down.
#   START strip (south) -> stage 1: drones (aimed shots, small rings) -> barrier A (gap in the
#   WEST) -> stage 2: turrets (spirals, a swaying ring, swaying fans) -> barrier B (gap in the
#   EAST) -> stage 3: the BOSS (three phases: fan, spiral, spiral storm) with two side pods.
# The barriers are 2 m bulkheads with offset gaps: they stop bullets (yours too), so you cannot
# snipe the boss from the entrance (a player shot flies 35 m) and have to cross each stage.
# Everything shootable is an [[object]] with a `health` table; the enemy's emitter sits on the
# same object (body = "none": bullets pass through enemies and you can overlap them). Enemies
# hover at 1.1 m (the height of your own shots), their bullets fly at 0.55 m so standing,
# crouching and crawling are all hit. Bullets are 4-6 m/s and the player hitbox is 0.12 m, so the
# dense patterns stay dodgeable. Cover pillars (2 m) stop enemy bullets and yours.
# The FINISH pocket behind the boss is walled off: the boss kill ends the course by itself, the
# zone only exists so that a course always has a FINISH. The START bay sits behind a bulkhead
# (barrier S) so a knockback can never push you back into START (entering START again restarts
# the run: timer, score and hits).
#
# Map key: # wall (3 m), a/b stage-1 floor, c/d stage-2 floor, e/f boss floor (stripes every 2
# rows), S START strip, B barrier (start bulkhead / A / B), p cover pillar, F sealed FINISH pocket.
name = "Bullet Hell"
about = "A top-down shoot-'em-up: hold fire (it always shoots north), weave through drone waves and spiral turrets, duck behind pillars and slip through the barrier gaps to a three-phase boss. The hitbox is tiny (0.12 m), so slipping between bullets is the game; the HUD counts score, time and hits."
try = [
  "Hold Space, F or the left mouse button to fire; you always shoot north, so steer to line shots up",
  "Hold Shift to walk slowly for tight dodging through a spiral",
  "STAGE 1: shoot the drones (10-25 points each, the centre one is worth 25) from behind the pillar comb",
  "STAGE 2: the spiral turrets are worth 50, as are the swaying ring and fan turrets; cross to the east gap",
  "The barriers stop bullets, yours too: line up through the gap, or fight from behind a pillar",
  "BOSS: the bar at the top gets angrier at 66% (spiral) and 33% (spiral storm); the two pods are worth 100 each",
  "A hit knocks you back, stuns you briefly and counts on the HUD; finish with as few hits as you can",
  "Walking back into the START bay restarts the run (timer, score, hits); F5 resets the room so the enemies are back",
]
wing = "genre"
order = 1
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [14, 39], facing = "south" }
controls = [["Move", "W A S D"], ["Fire (hold)", "Space / F / left mouse"], ["Walk slowly", "Shift (hitbox is tiny)"]]

# Straight down, orthographic: a 2D shooter view (distance 26 shows about 34 x 19 m at 16:9).
[camera]
tilt = 90.0
ortho = true
distance = 26.0

[view]
bloom = 0.9
"cutaway.fade" = false
"cutaway.height_cut" = false

[params]
"bombs.weapon" = "blaster"
"bombs.shoot_angle" = 180.0
"bombs.fire_interval" = 0.1
"movement.hitbox" = 0.12
"movement.allow_jump" = false

# Fire with Space as well as F (jumping is off in this room).
[keys]
use = ["Space", "KeyF"]
jump = []

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "A shoot-'em-up seen straight down. The DRONES of STAGE 1 fire slow aimed shots and small rings, the TURRETS of STAGE 2 fire spirals, a swaying 16-bullet ring and five-bullet fans, and the BOSS switches to a spiral at 66% health and a spiral storm at 33% while its two pods keep shooting. Your blaster always fires north, and the bulkheads (one GATE each) and the pillars stop every bullet, yours too."
how = [
  "Every enemy is an object with an emitter: a timer that fires one volley every interval seconds while you are within its range (13 m here, 15 m for the boss), after a start delay that keeps neighbours out of step.",
  "A volley is a list of directions. Aimed spreads its bullets over a fan centred on you, a ring spaces them evenly round a circle, and a spiral is a ring that turns a few degrees more every volley (the boss's storm: 6 bullets every 0.24 s, turning 7 degrees each time).",
  "Bullets are plain structs (position, velocity, radius, life), not physics bodies. Each tick (60 a second) they move in a straight line, measure the distance to the line through your body at the middle and the end of the step so fast ones cannot skip through you, and cast one short ray that stops them at walls, barriers and pillars.",
  "The tiny hitbox keeps it fair: a bullet hits when it comes within movement.hitbox plus its own radius (0.12 + 0.2 m) of that line, while your body's own radius is 0.32 m, so a bullet can sink its whole radius into you and still miss. A hit knocks you back, takes control away for 0.35 s and makes you safe for 0.6 s.",
  "Your shots are bullets on the player team, fired every 0.1 s at 22 m/s and living for 35 m. Each hit takes 1 hp and flashes the target white; dropping below a phase's share of health swaps in a new emitter, and the boss's death adds 500 points, sends the victory signal (confetti) and stops the clock.",
  "Each bullet is drawn as one SDF sphere (the pixel shader hits the exact sphere with a ray) in a single instanced draw, placed between ticks by its velocity. It is unlit at 1.6 times its colour, brighter than the bloom threshold, so it glows against the dark floor.",
]
uses = [
  "Danmaku: Touhou Project fills the screen with spell-card patterns and gives you a slow focus move and a hitbox a few pixels wide.",
  "Arcade shmups: DoDonPachi made dense curtains of slow, readable bullets the heart of the genre.",
  "Roguelikes: Enter the Gungeon's bosses fire rings, spirals and aimed bursts that you weave between.",
  "Boss phases: Cuphead's bosses change their attacks as their health runs down; Undertale turns its fights into dodging patterns inside a box.",
]
ask = [
  "bullet hell boss with ring, spiral and aimed fan patterns",
  "tiny hitbox and a slow focus move for dodging",
  "boss that changes attack pattern at 66% and 33% health",
  "thousands of cheap bullets without physics bodies",
  "top-down shmup where the ship always fires up the screen",
  "turrets that only shoot while the player is near",
]
cost = "CPU: a bullet is a few numbers moved by a few lines of code, but each tick it is tested against every character (your shots against everything with health) and casts one short ray at the walls, so the cost grows with bullets times targets; a hard cap of 6000 bullets stops a runaway emitter. GPU: all bullets are one instanced draw call of SDF spheres, so thousands cost little more than the pixels they cover."
knobs = ["movement.hitbox", "movement.focus_speed", "movement.hit_stun", "bombs.fire_interval", "bombs.bullet_speed", "bombs.shot_range"]
terms = ["sdf", "instancing", "draw call", "fixed timestep", "interpolation", "bloom", "game feel"]

[[learn.code]]
title = "One volley: rings, spirals and aimed fans"
file = "crates/pav_core/src/behaviors.rs"
lang = "rust"
src = """
let base = match em.pattern {
    Pattern::Aimed => player.map(|p| flat(p + Vec3::Y * 0.9 - muzzle)).unwrap_or(flat(fwd)),
    _ => flat(fwd),
};
let yaw0 = base.x.atan2(base.z);
let n = em.count.max(1);
// ...
match em.pattern {
    Pattern::Ring | Pattern::Spiral => {
        if em.pattern == Pattern::Spiral {
            em.angle += em.spin;
        }
        for i in 0..n {
            let a = yaw0 + (em.angle + 360.0 * i as f32 / n as f32).to_radians();
            dirs.push(Vec3::new(a.sin(), 0.0, a.cos()));
        }
    }
    // ...
    Pattern::Aimed | Pattern::Forward => {
        for i in 0..n {
            let f = if n == 1 { 0.0 } else { i as f32 / (n - 1) as f32 - 0.5 };
            let a = yaw0 + (f * em.spread).to_radians();
            dirs.push(Vec3::new(a.sin(), 0.0, a.cos()));
        }
    }
"""

[[learn.code]]
title = "A bullet's tick: move, hit test, wall ray"
file = "crates/pav_core/src/projectile.rs"
lang = "rust"
src = """
p.vel.y -= p.gravity * dt;
let step = p.vel * dt;
let len = step.length();
let next = p.pos + step;
// ...
    for t in targets {
        if Some(t.id) == p.owner {
            continue;
        }
        let a = t.feet + Vec3::Y * RADIUS;
        let b = t.feet + Vec3::Y * (t.height - RADIUS).max(RADIUS);
        // Test the midpoint and the end so fast bullets don't skip through.
        let d = segment_distance(next, a, b).min(segment_distance(p.pos + step * 0.5, a, b));
        if d < t.radius + p.radius {
            out.hits.push((t.id, next, p.vel.normalize_or(Vec3::X), p.knockback));
            return false;
        }
    }
// ...
if len > 1e-6 && blocked(p.pos, step / len, len + p.radius * 0.5, p.owner) {
    out.impacts += 1;
    return false;
}
p.pos = next;
true
"""

[[learn.code]]
title = "Boss phases, and what a kill does"
file = "crates/pav_core/src/health.rs"
lang = "rust"
src = """
// Attack patterns change as health falls.
let frac = h.fraction();
while let Some(p) = h.def.phases.get(h.phase) {
    if frac >= p.below {
        break;
    }
    e.behavior = p.behavior.clone();
    h.phase += 1;
}
if h.hp > 0.0 {
    return;
}
let def = h.def.clone();
self.despawn(id);
events.push(SimEvent::Destroyed { pos, size });
if let Some(r) = &mut self.state.courses.run {
    r.score += def.score;
}
if !def.signal.is_empty() {
    self.state.signals.push(def.signal.clone());
}
if def.finish && self.state.courses.run.as_ref().is_some_and(|r| r.started) {
    self.finish_course(pos, events);
}
"""

