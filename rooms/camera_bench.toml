size = 0.4

# Free-placed objects (keep them at the end of the file; edit mode rewrites this part).
# Two balls to push in the east lane (the crates are 'o' tiles on the south lane).
[[object]]
name = "ball"
shape = { type = "sphere", radius = 0.4 }
pos = [22.5, 0.4, 14.5]
color = "#5b8def"
body = "dynamic"

[[object]]
name = "ball"
shape = { type = "sphere", radius = 0.4 }
pos = [21.6, 0.4, 15.6]
color = "#e8704a"
body = "dynamic"
