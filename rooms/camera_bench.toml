pos = [17.0, 0.03, 1.8]
size = 0.6

[[label]]
text = "THE CAMERA STAYS UNTIL ANOTHER PAD OR UNTIL YOU LEAVE THE ROOM"
pos = [17.0, 0.03, 6.0]
