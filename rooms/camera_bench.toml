# Camera Bench: play the SAME short timed loop under different camera setups and compare.
# Nine camera pads sit around a compact obstacle loop; stepping on one switches the camera
# smoothly and it stays until another pad or until you leave the room. A camera zone over the
# crawl tunnel shows the "while inside" kind of cue. Every number in a pad's cue is a live
# camera parameter (tilt, yaw, distance, fov, ortho, height_offset); yaw is relative to the
# room's orientation.
name = "Camera Bench"
about = "Run one short obstacle loop under different cameras and compare. Nine pads switch the camera (top-down, classic, high, low, side view, isometric, wide-angle, close third person and an auto-sweeping one) while the timed loop stays the same: crates, a 2 m gap, a ladder to a 3 m platform, a narrow beam over a pit, a crawl tunnel and props to push."
try = [
  "Step on a camera pad: the camera glides to its setup and stays until another pad (or leaving the room)",
  "Run the loop (green START to checkered FINISH) once per camera and compare the times; the gold squares are gates (a missed gate adds 2 s)",
  "Judge the 2 m gap and the 0.4 m beam from TOP 90° ORTHO, then from LOW 35°: which view hides depth?",
  "ISOMETRIC and SIDE 0° are orthographic (no perspective); WIDE FOV 75° and CLOSE 3RD PERSON exaggerate it",
  "AUTO SWEEP slowly swings tilt and yaw and flips between orthographic and perspective every 7 s",
  "Crawl (Z) into the tunnel: a camera zone switches to a close low camera while you are inside, then the pad camera returns",
  "Climb the ladder to the 3 m platform and drop off its west side onto the checkpoint; falling into a pit or off the beam respawns you at the last checkpoint (falls are counted)",
  "Push the crates and balls around; right-drag rotates the camera and the wheel zooms until you step on a pad again",
]
wing = "movement"
order = 6
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [16, 25], facing = "south" }

# Room default camera (the "CLASSIC 62°" pad sets the same values explicitly).
[camera]
tilt = 62.0
distance = 18.0
fov = 40.0
ortho = false

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "One short timed loop, CRATES 0.5 / 1 m, GAP 2 m, LADDER 3 m, BEAM 0.4 m and a CRAWL (Z) tunnel, ringed by nine camera pads: ORTHOGRAPHIC ones in the west, PERSPECTIVE TILTS in the east, and WIDE FOV 75°, CLOSE 3RD PERSON and AUTO SWEEP in the north. Each pad glides the camera to a new setup and keeps it, so you can run the same loop under each one and see what it hides or reveals."
how = [
  "The camera orbits a follow point: tilt is degrees above the horizon (90 looks straight down, 0 from the side), yaw turns around you, and the eye sits distance metres back along the look direction from a point height_offset (0.8 m) above you.",
  "The follow point chases your position, itself drawn between the last two simulation ticks, with exponential smoothing: follow_lag (0.12 s) is its time constant, so the gap shrinks by about two thirds every 0.12 s, which takes the jitter out without feeling sluggish.",
  "Perspective makes far things smaller, and the 40° lens looks natural. Orthographic does not: it frames a fixed box (distance x tan(fov/2) up and down), so sizes stay true but height and depth vanish. TOP 90° ORTHO, ISOMETRIC and SIDE 0° are orthographic.",
  "A pad carries a camera cue: the app remembers the room's camera and blends to the cue's values over 0.7 s with an ease in and out; yaw takes the short way round and the projection switches halfway. AUTO SWEEP keeps animating tilt and yaw with slow cosine waves.",
  "A camera zone (the CRAWL tunnel) beats any pad while you are inside it and hands back to the pad's view when you leave. Your keys always move relative to the camera's yaw, which is why ISOMETRIC's 45° turn makes up run diagonally across the room.",
  "Low cameras would look through walls at nothing, so below 30° of tilt the shader drops everything between the lens and you. At any angle, a dithered see-through hole (1.6 m radius) opens around the line from the lens to you.",
]
uses = [
  "Top-down: the whole room readable at a glance (Hotline Miami, the first Grand Theft Auto).",
  "Isometric: the classic angle of action RPGs and city builders (Diablo, Hades, SimCity 2000).",
  "Side view: platformers judge jumps from the side (Super Mario Bros., Celeste).",
  "Close third person: a low view behind the hero for aiming and drama (Resident Evil 4).",
  "Camera zones: fixed or scripted angles that change as you walk into an area (Resident Evil, God of War).",
]
ask = [
  "smooth camera transitions between presets",
  "camera trigger zones that change the view while inside",
  "isometric orthographic camera",
  "follow camera with smoothing and a height offset",
  "cut away walls between the camera and the player",
  "switch between orthographic and perspective projection",
]
cost = "Practically free: the camera is two 4x4 matrices built on the CPU each frame. The see-through cut costs a few extra instructions per vertex and per pixel in the scene shader, the same at any angle."
knobs = ["camera.tilt", "camera.yaw", "camera.distance", "camera.fov", "camera.ortho", "camera.follow_lag"]
terms = ["interpolation", "uniform", "vertex shader", "fragment shader", "dithering", "game feel"]

[[learn.code]]
title = "Tilt and yaw become a look direction"
file = "crates/pav_view/src/camera.rs"
lang = "rust"
src = """
pub fn ground_axes(&self) -> (Vec3, Vec3) {
    let yaw = self.current().yaw.to_radians();
    let fwd = Vec3::new(yaw.sin(), 0.0, -yaw.cos());
    let right = Vec3::new(yaw.cos(), 0.0, yaw.sin());
    (fwd, right)
}
pub fn forward(&self) -> Vec3 {
    let (fh, _) = self.ground_axes();
    let t = self.current().tilt.clamp(0.0, 90.0).to_radians();
    (fh * t.cos() + Vec3::NEG_Y * t.sin()).normalize()
}
// ...
pub fn look_at(&self) -> Vec3 {
    self.target + Vec3::Y * self.current().height_offset
}
pub fn eye(&self) -> Vec3 {
    self.look_at() - self.forward() * self.current().distance
}
"""

[[learn.code]]
title = "Perspective or orthographic"
file = "crates/pav_view/src/camera.rs"
lang = "rust"
src = """
let fov = p.fov.clamp(1.0, 170.0).to_radians();
let far = (p.distance * 4.0 + 200.0).max(300.0);
let proj = if p.ortho {
    let half_h = p.distance * (fov * 0.5).tan();
    let half_w = half_h * aspect;
    glam::camera::rh::proj::directx::orthographic(-half_w, half_w, -half_h, half_h, 0.05, far)
} else {
    glam::camera::rh::proj::directx::perspective(fov, aspect, 0.1, far)
};
"""

[[learn.code]]
title = "A pad's cue glides in, then sweeps"
file = "crates/pav_app/src/hud.rs"
lang = "rust"
src = """
let base = self.base.get_or_insert_with(|| rig.params.clone()).clone();
rig.blend_from_current(0.7);
// ...
let Some(c) = &self.cue else { return };
let t = self.start.map(|s| s.elapsed().as_secs_f32()).unwrap_or(0.0);
for sw in &c.sweep {
    let u = (t / sw.period.max(0.1) + sw.phase) * std::f32::consts::TAU;
    let v = sw.from + (sw.to - sw.from) * (0.5 - 0.5 * u.cos());
    set_camera_value(&mut rig.params, &sw.param, v, self.quarters);
}
if c.flip_ortho > 0.0 {
    let base = c.set.get("ortho").and_then(|v| v.as_bool()).unwrap_or(false);
    rig.params.ortho = base ^ (((t / c.flip_ortho) as i64) % 2 == 1);
}
"""

[layout]
origin = [-17.0, 0.0, -13.0]

# 34 x 26 room. South = bottom row (entrance gap at columns 16-17). The loop is 14 x 12 and
# starts at column 10, row 8; the route runs counter-clockwise:
#   START 'S' (SW corner) -> 0.5 m and 1.0 m crate hurdles 'a' 'b' -> checkpoint 'K'
#   -> 2 m GAP '_' (pit) -> north up the east lane (crates 'o' and two balls to push)
#   -> ladder 'L' to the 3 m platform 'P' -> drop off its west side onto the checkpoint 'k'
#   -> narrow beam '=' over a pit -> crawl tunnel 't' (walls 'T') down the west lane
#   -> FINISH 'F' (right next to START, so you can go again).
# Camera pads (6 x 2 cells), west = orthographic ones, east = perspective tilts, north = the rest:
#   'A' TOP 90° ORTHO   'G' ISOMETRIC   'E' SIDE 0°          (west column, top to bottom)
#   'C' HIGH 75°        'B' CLASSIC 62° 'D' LOW 35°          (east column, top to bottom)
#   'H' WIDE FOV 75°    'I' CLOSE 3RD PERSON   'J' AUTO SWEEP (north row, left to right)
# The pads stay clear of the entrance path (columns 16-17 up to the loop). Floors are 3 m thick
# so the pits read as real holes from low cameras.
[[layout.layer]]
y = 0
map = '''
##################################
#................................#
#................................#
#.....HHHHHH..IIIIII..JJJJJJ.....#
#.....HHHHHH..IIIIII..JJJJJJ.....#
#................................#
#................................#
#................................#
#.AAAAAA..,,,_____,k,PPP..CCCCCC.#
#.AAAAAA..,,e=====ek,PPP..CCCCCC.#
#.........,c,_____,k,PPP.........#
#.........TtT........,L,.........#
#.........TtT........,,,.........#
#.GGGGGG..TtT........o,,..BBBBBB.#
#.GGGGGG..TtT........,,,..BBBBBB.#
#.........FFF........,,o.........#
#.........FFF........,,,.........#
#.........SS,,,a,bK__,,,.........#
#.EEEEEE..SS,,,a,bK__,,,..DDDDDD.#
#.EEEEEE..SS,,,a,bK__,,,..DDDDDD.#
#................................#
#................................#
#................................#
#................................#
#................................#
################..################
'''

# Gates of the course (invisible referees, drawn as gold squares where they sit on a surface).
# Zones can't share a tile, so they live in a second layer laid over the loop (offset to its
# top-left corner, column 10 row 8). They force the route: 1 the 1 m crate, 2 the platform top,
# 3 the beam, 4 the tunnel. Pass them in order or each missed gate adds 2 s.
[[layout.layer]]
y = 0
at = [10, 8]
map = '''
           222
     3     222
           222


 4



       1
       1
       1
'''

# Floors, walls.
[layout.legend.'.']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]

[layout.legend.'#']
blocks = [{ y0 = -3.0, y1 = 2.6, color = "#a7b0bd" }]

# The loop's lane floor (warm, so the course reads against the pale room floor).
[layout.legend.',']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }]

# Course start / finish / checkpoints. START arms the course, leaving it starts the clock;
# a checkpoint ('K' before the gap, 'k' after the platform drop) is where a fall respawns you.
[layout.legend.'S']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }]
zone = { kind = "start", course = "bench", facing = "east" }

[layout.legend.'F']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }]
zone = { kind = "finish", course = "bench" }

[layout.legend.'k']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }]
zone = { kind = "checkpoint", facing = "west" }
[layout.legend.'K']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }]
zone = { kind = "checkpoint", facing = "east" }

# Crates to push (dynamic props) and crate hurdles to jump onto (0.5 m and 1.0 m).
[layout.legend.'o']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }]
prop = { shape = { type = "box", half = [0.35, 0.35, 0.35] }, color = "#e8704a", name = "crate" }
[layout.legend.'a']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }, { y0 = 0, y1 = 0.5, color = "#e8a87c", rounded = true }]
[layout.legend.'b']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }, { y0 = 0, y1 = 1.0, color = "#d9895b", rounded = true }]

# Pit: floor at -3 .. -2.5, kill zone above it (back to the last checkpoint).
[layout.legend.'_']
blocks = [{ y0 = -3.0, y1 = -2.5, color = "#59606b" }]
zone = { kind = "kill", y0 = -2.4, y1 = -1.0 }

# Narrow beam (0.4 m wide: the block is inset 0.3 on every side) over a pit. 'e' is a beam
# end resting on the lane floor, '=' is the part over the pit.
[layout.legend.'e']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }, { y0 = -0.5, y1 = 0.06, color = "#c9a27a", inset = 0.3 }]
[layout.legend.'=']
blocks = [{ y0 = -3.0, y1 = -2.5, color = "#59606b" }, { y0 = -0.5, y1 = 0.06, color = "#c9a27a", inset = 0.3 }]
zone = { kind = "kill", y0 = -2.4, y1 = -1.0 }

# 3 m platform and the ladder up its south face.
[layout.legend.'P']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }, { y0 = 0, y1 = 3.0, color = "#8fa3c7" }]
[layout.legend.'L']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }]
ladder = { facing = "north", height = 3.0 }

# Crawl tunnel: 1.2 m side blocks with a 0.8 m high slot (ceiling block at 0.8 .. 1.2).
# The slot ('t') and one cell before it ('c') are a camera zone: while you are inside, the
# camera switches to a close low view; leaving it brings the pad camera back.
[layout.legend.'T']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }, { y0 = 0, y1 = 1.2, color = "#8e99a8" }]
[layout.legend.'t']
blocks = [{ y0 = -3.0, y1 = 0, color = "#bdb59f" }, { y0 = 0.8, y1 = 1.2, color = "#8e99a8" }]
zone = { kind = "camera", camera = { set = { tilt = 24, distance = 5, fov = 62, height_offset = 0.5, ortho = false } } }
[layout.legend.'c']
blocks = [{ y0 = -3.0, y1 = 0, color = "#e6dec9" }]
zone = { kind = "camera", camera = { set = { tilt = 24, distance = 5, fov = 62, height_offset = 0.5, ortho = false } } }

# Gates (second layer): zone only, no blocks.
[layout.legend.'1']
zone = { kind = "gate", course = "bench", index = 1, y0 = 1.0, y1 = 3.0, color = "#f2c94c" }
[layout.legend.'2']
zone = { kind = "gate", course = "bench", index = 2, y0 = 3.0, y1 = 6.0, color = "#f2c94c" }
[layout.legend.'3']
zone = { kind = "gate", course = "bench", index = 3 }
[layout.legend.'4']
zone = { kind = "gate", course = "bench", index = 4, y0 = 0, y1 = 1.0 }

# Camera pads. Each one is a floor tile with a pad zone: the camera cue (`set` = values to
# apply, optional `sweep` = animated parameters, `flip_ortho` = seconds between ortho and
# perspective) lasts until another pad or until you leave the room.
[layout.legend.'A']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]
zone = { kind = "pad", label = "TOP 90° ORTHO", color = "#4f7be0", camera = { set = { tilt = 90, ortho = true, distance = 22 } }, note = "Straight down with no perspective: the layout reads perfectly, but heights vanish, so the 3 m platform and the depth of the pits are hard to judge." }
[layout.legend.'B']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]
zone = { kind = "pad", label = "CLASSIC 62°", color = "#2e9e68", camera = { set = { tilt = 62, ortho = false, distance = 18, fov = 40 } }, note = "The engine default: 62° above the horizon, 18 m back, a 40° lens. Steep enough to see the room, low enough to see heights: the usual action-RPG view." }
[layout.legend.'C']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]
zone = { kind = "pad", label = "HIGH 75°", color = "#1fa5b8", camera = { set = { tilt = 75, ortho = false, distance = 18 } }, note = "Steeper: walls and the platform hide less behind them, but heights look flatter than at 62°." }
[layout.legend.'D']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]
zone = { kind = "pad", label = "LOW 35°", color = "#e0623a", camera = { set = { tilt = 35, ortho = false, distance = 14 } }, note = "Low and closer (14 m): the gap and the pits look deep and heights read well, but tall things hide what is behind them and you see less of the loop ahead." }
[layout.legend.'E']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]
zone = { kind = "pad", label = "SIDE 0°", color = "#8a52d6", camera = { set = { tilt = 0, ortho = true, distance = 16, height_offset = 1.5 } }, note = "Side view, orthographic: jump heights and the gap read exactly, depth not at all. Below 30° of tilt the shader cuts away everything between the lens and you." }
[layout.legend.'G']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]
zone = { kind = "pad", label = "ISOMETRIC", color = "#d4891c", camera = { set = { tilt = 35.264, yaw = 45, ortho = true, distance = 24 } }, note = "Tilt 35.264° and yaw 45°, orthographic: the angle where all three axes shrink equally. Your keys follow the camera, so up now runs diagonally across the room." }
[layout.legend.'H']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]
zone = { kind = "pad", label = "WIDE FOV 75°", color = "#d63a52", camera = { set = { tilt = 50, fov = 75, distance = 9, ortho = false } }, note = "A 75° lens only 9 m away: near things loom, the floor stretches away and speed feels higher, but distances are harder to judge." }
[layout.legend.'I']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]
zone = { kind = "pad", label = "CLOSE 3RD PERSON", color = "#7d9a22", camera = { set = { tilt = 22, fov = 60, distance = 7, height_offset = 1.4, ortho = false } }, note = "22° tilt, 7 m back, aimed 1.4 m above your feet through a 60° lens: a low chase view. Below 30° of tilt walls between the lens and you are cut away." }
[layout.legend.'J']
blocks = [{ y0 = -3.0, y1 = 0, color = "#d5dae0" }]
zone = { kind = "pad", label = "AUTO SWEEP", color = "#c43fb0", camera = { set = { distance = 18 }, sweep = [{ param = "tilt", from = 88, to = 8, period = 14 }, { param = "yaw", from = -60, to = 60, period = 22 }], flip_ortho = 7 }, note = "Tilt swings between 88° and 8° every 14 s, yaw between -60° and 60° every 22 s, and the lens flips between orthographic and perspective every 7 s." }

