# Squash & Stretch: puppets squash when they land and stretch when they jump or fall; the
# `squash` amount scales it (0 = stiff, 1 = normal, 3 = rubber). Blobs hop as they walk. NPCs jump
# every `hop` seconds. Everything is data (no scripts).
#   NORTH-WEST  BLOB POND: six blobs of different colours and sizes wander in a fenced pen
#   NORTH       SQUASH DIAL: three hopping bipeds, squash 0 / 1 / 2.5, each in its own pen
#   WEST        TRAMPOLINES: bounce pads of 10, 15 and 20 m/s with a bouncing NPC on each
#   MIDDLE/EAST HIGH DROP: 0.3 m steps up to a 2.4 m platform, jump off onto the LAND HERE mat
#   SOUTH       PLAYER PADS: RUBBER / STIFF / BLOB / BACK TO NORMAL change your own puppet
# Bounce zones launch at v m/s, so you rise about v^2/64 m (gravity 32): 1.6, 3.5 and 6.3 m.
name = "Squash & Stretch"
about = "Puppets squash on landing and stretch in the air, and a single number (puppet.squash) says how much. Watch blobs hop around their pond, compare stiff, normal and rubber hoppers, bounce on trampolines of three strengths and drop off a 2.4 m platform, then change your own puppet on the pads."
try = [
  "Watch the BLOB POND: six blobs hop at different rates and squash hard on every landing",
  "Compare the SQUASH DIAL hoppers (NONE / NORMAL / RUBBER) landing side by side",
  "Bounce on the 10, 15 and 20 m/s trampolines and watch the stretch on the way up and the squash on landing",
  "Climb the steps to the HIGH DROP platform (2.4 m) and jump off onto the LAND HERE mat",
  "Step on RUBBER YOU and jump around, then try STIFF YOU (no squash at all)",
  "Step on BLOB YOU to turn into a hopping blob, and BACK TO NORMAL to restore the biped",
  "Bounce on a trampoline as RUBBER YOU, then as STIFF YOU, and compare",
  "Push a hopper or run through the pond; reset the room with F5 (pads revert when you leave)",
]
wing = "animation"
order = 4
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 55.0
distance = 20.0

[layout]
origin = [-20.0, 0.0, -15.0]

