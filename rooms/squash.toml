#................................mmmmmm#
#.111...222...333.........PPPPPP.mmmmmm#
#.111...222...333.qrstuvxyPPPPPP.mmmmmm#
#.111...222...333.qrstuvxyPPPPPP.mmmmmm#
#.........................PPPPPP.mmmmmm#
#................................mmmmmm#
#................................mmmmmm#
#................................mmmmmm#
#......................................#
#......................................#
