# Filter Stack Bench (aesthetic wing): build your own screen filter stack out of view.filter.* settings.
# GENERATED by a small script (kept outside the repo), then hand-checked. Layout (40 x 30):
#   WEST   rows of pads: PIXELS, CRT CURVE, SCANLINES, DITHER + LEVELS, PALETTE x2, GRADE (temperature)
#   EAST   rows of pads: TINT, BRIGHTNESS, CONTRAST, VIGNETTE, GRAIN, CHROMA, SATURATION
#   CENTRE north: FILTER GARDEN diorama with colour strips; SPLIT pads; eight PRESET pads; four PIXEL ART pads
#   (pixel art on part of the scene: characters, the hero or the world); RESET pads at the door
# Pads only set the keys they name, so stepping on several pads stacks filters; presets and RESET set them all.
# Pad params stay until you leave the room (or another pad changes them).
name = "Filter Stack Bench"
about = "Build your own screen filter stack: rows of pads switch pixelation, CRT curvature, scanlines, dither, palettes, colour grade, contrast, vignette, grain and chromatic fringe on and off, they pile up as you step on them, and preset pads set a whole look (Game Boy, arcade, VHS, noir...) over a small colourful diorama."
try = [
  "Step on PIXELS 3 PX, then CRT CURVE 0.25 and SCANLINES 0.4: filters stack, so you build an arcade screen pad by pad",
  "Add DITHER 3 LEVELS, then try the PALETTE pads (GAMEBOY, PICO-8, CGA, 1-BIT, AMBER) over the diorama and the rainbow wall",
  "Walk the grade rows (GRADE, TINT, BRIGHTNESS, CONTRAST, SATURATION): the same scene goes from warm and moody to cold and washed out",
  "Step on a PRESET (GAME BOY, ARCADE, VHS, NOIR, PICO-8, 1-BIT, AMBER TERMINAL, SEPIA): each pad sets the whole stack at once",
  "Stand on SPLIT 0.5: the filters apply only to the right half, so you can compare the stack with the pure image; SPLIT OFF ends it",
  "A single OFF pad (or RESET at the entrance) clears one filter (or all of them); leaving the room restores everything",
  "Step on ART CHARACTERS, ART HERO or ART WORLD: only those turn into outlined pixel art while the rest stays sharp (ART OFF ends it)",
  "Press F1 for the tuning panel: every view.filter slider (and more) is there for fine tuning, including scanline_px",
  "Throw a bomb (F or click) at the diorama and watch the explosion through a stack",
]
wing = "aesthetic"
order = 3
primary_device = "keyboard_mouse"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 55.0
distance = 18.0
fov = 40.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "A bench of pads in rows, one row per filter: PIXELS, CRT CURVE, SCANLINES, DITHER + LEVELS, two PALETTE rows and GRADE on the west; TINT, BRIGHTNESS, CONTRAST, VIGNETTE, GRAIN, CHROMA and SATURATION on the east. Row pads set only their own filter, so they stack as you walk over the FILTER GARDEN and its rainbow and grey strips. PRESETS set the whole stack, SPLIT compares it with the clean picture and the ART pads turn only part of the scene into pixel art."
how = [
  "Every pad writes view.filter.* settings into one block of uniforms (constants the shader reads each frame), so ten stacked filters are still one composite pass.",
  "The order is fixed in the shader: curvature, pixelate and pixel art first decide where each pixel reads the scene, then grading (temperature, tint, contrast, brightness, saturation), scanlines, vignette and grain, and last the reduction to colour levels or a palette.",
  "Order matters: because the palette comes last, GAMEBOY over a WARM grade still shows only four greens, and the grain gets snapped to the palette too.",
  "Pixel art on part of the scene: chosen objects write a negative id into the normal buffer while the scene is drawn. The composite moves only those pixels to their block's centre and darkens a one-block rim where a marked object stands in front of another, so ART HERO turns just you into 4 px blocks.",
  "Chroma reads red and blue from slightly different spots, further apart towards the screen edges; grain adds per-pixel noise that changes every frame; the vignette darkens with distance from the centre.",
]
uses = [
  "Tributes: Game Boy greens, PICO-8's 16 colours or 1-bit black and white over a modern scene.",
  "Film looks: grain, vignette and colour fringes for horror (Alien: Isolation offers film grain and chromatic aberration).",
  "Photo modes: big games ship these very sliders for players' screenshots (Ghost of Tsushima, Marvel's Spider-Man).",
  "Pixel heroes in a 3D world: sprites in a sharp, lit scene, the HD-2D look of Octopath Traveler.",
]
ask = [
  "stackable post-process filter chain",
  "Game Boy palette with ordered dithering",
  "arcade CRT: curvature, scanlines, vignette, colour fringe",
  "pixel-art filter on only the characters",
  "sepia or noir grade with film grain",
  "before/after split for tuning filters",
]
cost = "Every filter lives in the single composite pass, so turning more on adds arithmetic, not passes: a few operations each, the 16-colour palette search being the largest. Part-of-scene pixel art adds a handful of normal-buffer and depth reads per pixel for its outline."
knobs = ["view.filter.pixelate", "view.filter.palette", "view.filter.dither", "view.filter.temperature", "view.filter.chroma", "view.filter.pixel_art"]
terms = ["post-process", "uniform", "pixel art", "dithering", "palette", "posterize", "color grading", "chromatic aberration"]

[[learn.code]]
title = "The grade, in display colour"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = """
// Colour grading (display space).
if (aimed(post.filt5.z, obj)) {
    let temp = post.filt2.x;
    s = s * vec3<f32>(1.0 + 0.12 * temp, 1.0 + 0.08 * post.filt2.y, 1.0 - 0.12 * temp);
    s = (s - 0.5) * post.filt2.z + 0.5;
    s = s * post.filt2.w;
    let gray = dot(s, vec3<f32>(0.2126, 0.7152, 0.0722));
    s = mix(vec3<f32>(gray), s, post.filt4.x);
}
"""

[[learn.code]]
title = "Levels or a palette, nudged by a Bayer pattern"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = """
let pal = u32(post.filt1.z + 0.5);
let levels = post.filt1.y;
// The dither pattern steps with the pixels: pixel-art blocks or the whole screen's.
let bp = floor(frag.xy / select(block, art_px, art));
let th = mix(0.5, bayer4i(bp), clamp(post.filt1.x, 0.0, 1.0));
if (aimed(post.filt5.y, obj)) {
    if (pal > 0u) {
        s = palette_nearest(s, pal, th);
    } else if (levels >= 2.0) {
        let l = levels - 1.0;
        s = floor(s * l + th) / l;
    }
}
"""

[[learn.code]]
title = "Pixel art only where the mark is"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = """
let art_px = post.filt4.y;
var art = false;
var art_edge = false;
if (art_px > 1.0) {
    let c = (floor(p / art_px) + 0.5) * art_px;
    let gc = group_at(c, dims);
    if (gc < 0.0 || group_at(p, dims) < 0.0) {
        p = c;
        art = true;
    }
    // ...
}
"""

