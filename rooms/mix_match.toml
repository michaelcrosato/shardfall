# Mix & Match (aesthetic wing): filters on the whole scene, only the characters & objects, or only the environment.
# GENERATED from crates/pav_view/src/looks.toml by a small script (kept outside the repo); hand-check after edits.
#   WEST   a row per filter (PIXEL ART, INK OUTLINES, GAME BOY, NOIR GRADE, SCANLINES) with OFF / ALL / OBJECTS /
#          WORLD pads, then OBJECT STYLE and WORLD STYLE rows. These pads set only their own filter, so they stack.
#   CENTRE a village diorama: grass, a path, two cottages, trees, flowers, a pond with a fixed statue (environment),
#          four walkers, crates and balls (characters & objects)
#   EAST   whole looks (the Look & Filters menu's looks): each sets every look setting, so they never stack; CLEAN resets
name = "Mix & Match"
about = "Mix and match filters between the characters & objects and the environment: a diorama of walkers, crates and balls in a little village, a grid of pads that puts one filter on ALL, only the OBJECTS or only the WORLD (they stack, so you mix by walking), and a row of whole looks, the same ones as the Look & Filters menu."
try = [
  "Step on PIXEL ART > OBJECTS: the walkers, crates and balls turn into outlined pixel art while the village stays sharp; WORLD does the opposite",
  "Stack them: PIXEL ART > OBJECTS, then GAME BOY > WORLD, then INK OUTLINES > OBJECTS: crisp retro heroes in a Game Boy world",
  "NOIR GRADE > WORLD keeps the characters in colour in a black-and-white village; SCANLINES > OBJECTS makes them holograms",
  "OBJECT STYLE and WORLD STYLE pick flat, cel or lit shading for each part (try LIT objects in a FLAT world)",
  "The east pads are whole looks: PIXEL HEROES, HD-2D, GAME BOY WORLD, CARTOON, COMIC NOIR, HOLOGRAM HEROES...; CLEAN resets",
  "Esc > Look & filters has every filter with sliders and presets; its switched-on filters win over the pads (Scene default hands them back)",
  "The white statue in the pond is fixed scenery, so it belongs to the environment; anything that moves is an object",
]
wing = "aesthetic"
order = 4
primary_device = "keyboard_mouse"
entrance = { at = [22, 26], facing = "south" }

[camera]
tilt = 58.0
distance = 22.0
fov = 40.0

[layout]
origin = [-22.0, 0.0, -13.5]

[[layout.layer]]
