#.eee.hhh.iii.jjj..GHHgssGHHg..KKKKK.LLLLL.#
#.eee.hhh.iii.jjj..gGgGssgGgG..KKKKK.LLLLL.#
#..................GgGgssGgGg..............#
#.kkk.lll.mmm.nnn..gGgGssgTgG..MMMMM.NNNNN.#
#.kkk.lll.mmm.nnn..wwwgssGgGg..MMMMM.NNNNN.#
#..................wwwGssgGgG..............#
#.ooo.ppp.qqq.rrr..wwwgssGgGg..OOOOO.QQQQQ.#
#.ooo.ppp.qqq.rrr..wwwGssPGgG..OOOOO.QQQQQ.#
#..................GgGgssGgGg..............#
#.ttt.uuu.vvv.xxx..gTgGssgGgG..SSSSS.UUUUU.#
#.ttt.uuu.vvv.xxx..GgGgssGffg..SSSSS.UUUUU.#
#..................gGgGssgfgG..............#
#.yyy.zzz.AAA.BBB..GgGgssGgTg..VVVVV.WWWWW.#
#.yyy.zzz.AAA.BBB..gGgGssgGgG..VVVVV.WWWWW.#
