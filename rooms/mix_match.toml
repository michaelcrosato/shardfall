# Mix & Match (aesthetic wing): filters on the whole scene, only the characters & objects, or only the environment.
# GENERATED from crates/pav_view/src/looks.toml by a small script (kept outside the repo); hand-check after edits.
#   WEST   a row per filter (PIXEL ART, INK OUTLINES, GAME BOY, NOIR GRADE, SCANLINES) with OFF / ALL / OBJECTS /
#          WORLD pads, then OBJECT STYLE and WORLD STYLE rows. These pads set only their own filter, so they stack.
#   CENTRE a village diorama: grass, a path, two cottages, trees, flowers, a pond with a fixed statue (environment),
#          four walkers, crates and balls (characters & objects)
#   EAST   whole looks (the Look & Filters menu's looks): each sets every look setting, so they never stack; CLEAN resets
name = "Mix & Match"
about = "Mix and match filters between the characters & objects and the environment: a diorama of walkers, crates and balls in a little village, a grid of pads that puts one filter on ALL, only the OBJECTS or only the WORLD (they stack, so you mix by walking), and a row of whole looks, the same ones as the Look & Filters menu."
try = [
  "Step on PIXEL ART > OBJECTS: the walkers, crates and balls turn into outlined pixel art while the village stays sharp; WORLD does the opposite",
  "Stack them: PIXEL ART > OBJECTS, then GAME BOY > WORLD, then INK OUTLINES > OBJECTS: crisp retro heroes in a Game Boy world",
  "NOIR GRADE > WORLD keeps the characters in colour in a black-and-white village; SCANLINES > OBJECTS makes them holograms",
  "OBJECT STYLE and WORLD STYLE pick flat, cel or lit shading for each part (try LIT objects in a FLAT world)",
  "The east pads are whole looks: PIXEL HEROES, HD-2D, GAME BOY WORLD, CARTOON, COMIC NOIR, HOLOGRAM HEROES...; CLEAN resets",
  "Esc > Look & filters has every filter with sliders and presets; its switched-on filters win over the pads (Scene default hands them back)",
  "The white statue in the pond is fixed scenery, so it belongs to the environment; anything that moves is an object",
]
wing = "aesthetic"
order = 4
primary_device = "keyboard_mouse"
entrance = { at = [22, 26], facing = "south" }

[camera]
tilt = 58.0
distance = 22.0
fov = 40.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "A little village with four walkers (two people, a spider and a lizard), crates and balls. On the west, each row is one filter (PIXEL ART, INK OUTLINES, GAME BOY, NOIR GRADE, SCANLINES) with OFF, ALL, OBJECTS and WORLD pads, then OBJECT STYLE and WORLD STYLE rows; row pads stack, so you mix by walking. The WHOLE LOOKS pads on the east set every look setting at once, the same looks as the Look & Filters menu."
how = [
  "Every pixel knows which part of the scene it shows. While the scene is drawn, characters and anything that moves or can be pushed write an id of 1024 or more into a spare channel of the normal buffer; level geometry and fixed scenery, like the statue in the pond, write less.",
  "Each filter has an on-setting (outlines_on, color_on, grade_on, scanlines_on, grain_on, chroma_on): all, objects or environment. In the composite one small test, aimed(), checks the pixel's part before the filter touches it.",
  "Pixel art is picked earlier, on the CPU: view.filter.pixel_target marks the chosen instances by making their id negative, and the composite snaps only those pixels to blocks.",
  "Surface styles work per part too: OBJECT STYLE and WORLD STYLE re-style meshes to flat, cel or lit before drawing; unlit glows and markers keep their own look.",
  "The WHOLE LOOKS come from looks.toml, the file behind the Look & Filters menu. A section switched on in that menu replaces what rooms and pads set until Scene default hands it back.",
]
uses = [
  "HD-2D: pixel-art characters in a soft, glowing 3D world (Octopath Traveler, Triangle Strategy).",
  "Readability: ink outlines or full colour on characters and pickups only, so they stand out from busy scenery.",
  "Selective colour: Mirror's Edge paints the useful route red in an otherwise white city; a grey world with coloured heroes works the same way.",
  "Holograms and ghosts: scanlines, fringes and a cold tint on one character while the world stays clean.",
]
ask = [
  "pixel-art characters in a sharp 3D world",
  "filters that apply only to characters or only to the environment",
  "black-and-white world with characters in colour",
  "hologram effect on characters with scanlines",
  "cel-shaded heroes in a flat-shaded world",
  "per-object mask in the normal buffer for post effects",
]
cost = "Aiming a filter is almost free: the part is one read of the normal buffer the composite already has, and the test is a comparison. Per-part styles cost nothing on the GPU (the CPU picks the style before drawing). Pixel art's outline adds a few extra reads per pixel."
knobs = ["view.filter.pixel_target", "view.outlines_on", "view.filter.color_on", "view.filter.grade_on", "view.filter.scanlines_on", "view.style_objects"]
terms = ["parts of the scene", "normal buffer", "pixel art", "outline", "palette", "color grading", "cel shading", "flat shading"]

[[learn.code]]
title = "Objects mark themselves in the normal buffer"
file = "crates/pav_render/src/shaders/scene.wgsl"
lang = "wgsl"
src = """
fn group_out(n: vec3<f32>, group: u32, flags: u32) -> vec4<f32> {
    var gi = select(0u, (group - 1u) % 1023u + 1u, group != 0u);
    if ((flags & FLAG_OBJECT) != 0u) {
        gi = gi + 1024u;
    }
    let g = f32(gi);
    return vec4<f32>(n, select(g, -g, (flags & FLAG_PIXEL) != 0u));
}
"""

[[learn.code]]
title = "Is this filter aimed at this pixel?"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = """
// The normal buffer's w is 1024 or more (in size) on characters and objects.
fn object_w(w: f32) -> bool {
    return abs(w) > 1023.5;
}

// Whether a filter aimed at `part` (0 whole scene, 1 characters and objects, 2 environment)
// applies to a pixel of this kind.
fn aimed(part: f32, obj: bool) -> bool {
    let t = u32(part + 0.5);
    return t == 0u || (t == 1u) == obj;
}
"""

[[learn.code]]
title = "Choosing what turns into pixel art"
file = "crates/pav_view/src/build.rs"
lang = "rust"
src = """
if f.pixel_art > 1.0 {
    let hero = curr.player.map(|p| p.0 + 2);
    mark_pixel_art(&mut scene, |g, flags| match f.pixel_target {
        PixelTarget::All => true,
        PixelTarget::Characters => puppets.contains(&g),
        PixelTarget::Hero => Some(g) == hero,
        PixelTarget::Others => puppets.contains(&g) && Some(g) != hero,
        PixelTarget::World => !puppets.contains(&g),
        PixelTarget::Entity => g == f.pixel_entity as u32 + 2,
        PixelTarget::Objects => flags & rs::flags::OBJECT != 0,
        PixelTarget::Environment => flags & rs::flags::OBJECT == 0,
    });
}
"""

