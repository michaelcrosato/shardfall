# Impact & Recoil: characters flinch away from hits. A projectile or a bomb blast kicks a damped
# spring that bends the torso, snaps the head and flings the arms; knockback pushes them. Idle
# dummies walk back to their spot afterwards and face their start direction again.
# Turrets are fixed [[object]]s with a `forward` emitter (+Z of the object, yaw aims it); they
# only fire while the player is within `range` metres, so each exhibit wakes up as you arrive.
#   NORTH-WEST  SHOOTING GALLERY: four dummies, knockback 2 / 5 / 9 / 14 (west turrets fire east)
#   NORTH-EAST  BOMB RING: eight characters around a spot you bomb (bombs.push is raised here)
#               plus three pads that change how YOUR character is drawn (CUTOUT, ON TWOS, NORMAL)
#   MIDDLE      WALK THE GAUNTLET: a corridor with side turrets (the player flinches too)
#   SOUTH-WEST  STUN vs BOUNCE BACK, a machine gun and a cannon (west turrets fire east)
#   SOUTH-EAST  SIZES & BODIES: tiny, giant, spider and lizard targets (east turrets fire west)
# Lanes are 2 m wide with 0.5 m dividers; a wall stops everything at the far end of each lane.
# Interior walls are 1.6 m so the camera can see over them; the outer walls are 3 m.
# Room params: bombs.push 14 and bombs.radius 2 (bigger blasts shove the ring harder).
name = "Impact & Recoil"
about = "Characters flinch away from hits: bullets and bomb blasts bend the torso, snap the head and fling the arms on a damped spring, and knockback shoves them back before idle dummies walk home. A shooting gallery, a bomb ring, a turret gauntlet you can walk, and side-by-side stun vs bounce-back tests."
try = [
  "Watch the four SHOOTING GALLERY dummies: knockback 2, 5, 9 and 14 flinch, stumble and walk back by different amounts",
  "Stand in the THROW A BOMB HERE ring and bomb the centre (F or left click): people, a spider, a lizard, a beetle and a blob all jolt",
  "Bomb the ring off-centre: the nearest characters flinch hardest and are flung furthest",
  "Walk the gauntlet from the south entrance: every shot flinches and shoves you, and the turrets only wake when you are near",
  "Hop a 0.5 m lane divider and stand between a turret and its dummy to take the hit yourself (the dummy shields you from behind)",
  "Compare LIGHT HIT (bounces back) with HEAVY HIT (stunned and thrown) in the south-west",
  "Stand near the MACHINE GUN and CANNON dummies: sustained small hits vs one enormous one",
  "Check SIZES & BODIES: a tiny and a giant biped, and a spider and a lizard whose bodies jolt",
]
wing = "animation"
order = 3
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 50.0
distance = 13.0

[params]
"bombs.push" = 14.0
"bombs.radius" = 2.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "Characters flinch away from hits and get shoved back. Four turrets in the SHOOTING GALLERY fire at idle dummies with knockback 2, 5, 9 and 14, the BOMB RING puts people and four creatures round a spot you bomb, and WALK THE GAUNTLET lets you take the hits yourself. In the south, STUN vs BOUNCE BACK compares a light and a heavy hit and a machine gun with a cannon (24), and SIZES & BODIES shows tiny, giant, spider and lizard targets."
how = [
  "A hit does two separate things: it shoves the body (knockback, movement) and kicks the pose (recoil, animation). A turret shot uses its knockback value; a bomb shoves everything within 2.5 times bombs.radius (5 m here) with bombs.push (14 here), weaker further out.",
  "Knockback is a velocity added in one go: the shot's knockback sideways plus a hop of 0.35 of it plus 1.5 m/s upward. For movement.hit_stun (0.35 s) the character has no control and slides to a stop; then the idle dummies walk back to their spot and turn to face their start direction.",
  "Recoil is a damped spring (stiffness 150, damping 9) on two lean angles, sideways and forward. The hit kicks the spring's speed away from the shot by 7 times its strength (knockback / 6, kept between 0.4 and 3); the spring swings back upright, overshooting once, and the lean is capped at about 50 degrees.",
  "The pose reads those angles: the torso tips by them, the head snaps 60% further, the arms fling up and out (IK then finds the elbows) and the hands jerk back for a moment. Creatures have no torso to bend, so their whole body jolts instead.",
  "After a hit a character is untouchable for 0.6 s, and shots that arrive sooner are absorbed, so the MACHINE GUN (a shot every 0.25 s) lands about one shot in three. Light and heavy hits get the same 0.35 s stun; the HEAVY HIT just throws harder.",
]
uses = [
  "Physical hit reactions: GTA IV, Red Dead Redemption and Max Payne 3 use NaturalMotion's Euphoria so bodies react to each bullet.",
  "Knockback that grows: Super Smash Bros. sends fighters further the more damage they carry.",
  "Hit stun: fighting games such as Street Fighter take away the victim's control for a set number of frames after each hit.",
  "Action games: enemies flinch on every blow so you can read your hits landing, and a short invulnerability after a hit stops one burst from locking a character down.",
]
ask = [
  "hit reactions: flinch away from the shot on a damped spring",
  "knockback with hit stun and invulnerability frames",
  "bomb blast that shoves and staggers everyone nearby",
  "enemies that walk back to their post after being knocked away",
  "head snap and arm fling on a heavy hit",
]
cost = "Practically free: two spring values per character, a velocity change and two timers. The shots are CPU projectiles tested against every character's capsule each tick, so the cost grows with shots times characters; nothing extra is drawn."
knobs = ["movement.hit_stun", "bombs.push", "bombs.radius", "puppet.look", "puppet.anim_fps"]
terms = ["procedural animation", "game feel", "ik", "interpolation", "flat shading", "cel shading"]

[[learn.code]]
title = "A hit: shove, stun and kick the pose"
file = "crates/pav_core/src/course.rs"
lang = "rust"
src = """
let stun = self.config.movement.hit_stun;
// ...
if ch.invuln > 0.0 {
    return;
}
ch.invuln = 0.6;
ch.stun = stun;
ch.hang = None;
ch.climbing = None;
let flat = Vec3::new(dir.x, 0.0, dir.z).normalize_or(Vec3::X);
ch.impulse += flat * knockback + Vec3::Y * (knockback * 0.35 + 1.5);
ch.anim.recoil = 1.0;
ch.anim.hit(dir, (knockback / 6.0).clamp(0.4, 3.0));
"""

[[learn.code]]
title = "The flinch spring and the kick"
file = "crates/pav_core/src/puppet.rs"
lang = "rust"
src = """
    // Hit recoil: a damped spring pulls the flinch back upright.
    let (k, c) = (150.0, 9.0);
    self.hit_vs += (-self.hit_side * k - self.hit_vs * c) * dt;
    self.hit_vf += (-self.hit_fwd * k - self.hit_vf * c) * dt;
    self.hit_side = (self.hit_side + self.hit_vs * dt).clamp(-0.9, 0.9);
    self.hit_fwd = (self.hit_fwd + self.hit_vf * dt).clamp(-0.9, 0.9);
// ...
/// Flinch away from a hit coming along `dir` (world), `strength` ~ 1 for a normal hit.
pub fn hit(&mut self, dir: Vec3, strength: f32) {
    let (s, c) = self.facing.sin_cos();
    let fwd = Vec3::new(s, 0.0, c);
    let right = Vec3::new(c, 0.0, -s);
    let d = Vec3::new(dir.x, 0.0, dir.z).normalize_or(-fwd);
    let kick = 7.0 * strength.clamp(0.2, 3.0);
    self.hit_vs += d.dot(right) * kick;
    self.hit_vf += d.dot(fwd) * kick;
    self.recoil = self.recoil.max(0.6 * strength.min(1.5));
}
"""

[[learn.code]]
title = "Torso, head and arms read the flinch"
file = "crates/pav_core/src/puppet.rs"
lang = "rust"
src = """
let lean_f = st.lean_fwd + 0.25 * crouch - 0.12 * climb + st.hit_fwd + act.lean * act.w;
// ...
// Torso direction: upright, leaning, or horizontal when crawling.
let torso_dir = Vec3::new(st.lean_side + st.hit_side, 1.0, lean_f)
    .normalize()
    .lerp(Vec3::new(0.0, 0.18, 1.0).normalize(), crawl)
    .lerp(Vec3::new(0.0, 0.45, 1.0).normalize(), swim)
    .normalize();
// ...
// The head snaps a little further than the torso on a hit.
let head_dir = (torso_dir + Vec3::new(st.hit_side, 0.0, st.hit_fwd) * 0.6).normalize();
    // ...
    // Arms fling out on a hit.
    let fling = (st.hit_side.abs() + st.hit_fwd.abs()).min(0.8);
    hand += Vec3::new(s * 0.5, 0.6, 0.0) * fling * arm;
"""

