# Action Moves (animation wing): the moves table (anim/moves.toml) performed by four figures.
# GENERATED by a script kept outside the repo; hand-edits are fine.
#   stages: BLADES, FISTS, KICKS, MAGIC AND MORE; TEMPO pads (anim.tempo)
name = "Action Moves"
about = "Every attack, cast and gesture as a line of numbers: arcs around the shoulders, wind-up from wherever the hands were, strikes with lunge, lean, twist, hops and spins. Four performers run through the moves table."
try = [
  "Watch BLADES: slash, backslash, overhead, rising cut, thrust, spinning slash, plunge, two-handed chop",
  "KICKS shows the foot as the striking end; the arms go up for balance",
  "Step on SLOW and follow one hand along its arc",
  "Press H for the phases of a move and the code; animsheet move=roundhouse draws one frame by frame",
]
wing = "animation"
order = 8
primary_device = "keyboard_mouse"
entrance = { at = [14, 21], facing = "south" }

[camera]
tilt = 40.0
distance = 17.0
fov = 40.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "Four performers run through the moves table: sword swings, punches, kicks, and casts, throws and shoves. Every move is a few lines of numbers in anim/moves.toml (an arc, timing and body motion), not code: change a number, run anim_reload, and the swing changes everywhere it is used, Shardfall's skills included."
how = [
  "A move is an arc the striking hand (or foot) sweeps around the shoulders: from and to angles in degrees, a height and a reach in arm lengths. Side moves swing up and down in front instead of level.",
  "Wind-up (anticipation): the hand travels from wherever it was to the start of the arc while the body coils back. If another move just ended, the hands start where it left them, so chained attacks never snap back to the walk first.",
  "Strike: the arc is swept with a fast ease-out, the body lunges, leans and twists with the swing angle, and may hop or turn a full circle.",
  "Recovery (follow-through): the end pose is held for a moment, carries on a little further, then eases back to the walk.",
  "A skill names its move and says when its hit lands; the three phases stretch to fit around that moment. The frame is a pure function of the move and its progress, so rewinds and replays repeat exactly.",
  "The arc's direction aims the weapon too, so the blade and its swing trail follow the curve instead of a straight line.",
]
uses = [
  "Fighting games keep every attack as frame data: startup, active and recovery frames (Street Fighter, Tekken).",
  "Action games list moves and combos as data so designers tune them without code (Devil May Cry, Bayonetta, Hades).",
  "Procedural attacks on many bodies from one description: Spore's creatures, Rain World's slugcats and lizards.",
  "Telegraphing: enemies wind up longer than the hero so players can read and dodge them (Dark Souls, Hollow Knight).",
]
ask = [
  "a new attack defined in data",
  "make sword swings follow an arc",
  "attacks that chain from where the last one ended",
  "a jumping kick with a hop and a lunge",
  "a longer wind-up so enemies telegraph their attacks",
]
cost = "A few dozen float operations per character per frame (a pure function of the move and its progress); a handful of numbers per character in the saved state."
knobs = ["anim.tempo"]
terms = ["anticipation", "procedural animation", "ik", "determinism"]

[[learn.code]]
title = "The strike: the arc swept, the body lunging and hopping"
file = "crates/pav_core/src/moves.rs"
lang = "rust"
src = '''
} else if mt < self.wind + self.active {
    let u = ((mt - self.wind) / self.active.max(1e-4)).clamp(0.0, 1.0);
    let k = out_cubic(u);
    f.phase = Phase::Active;
    f.u = u;
    f.theta = if self.spin { a0 } else { a0 + (a1 - a0) * k };
    f.height = h0 + (h1 - h0) * k;
    f.reach = r0 + (r1 - r0) * k;
    f.w = 1.0;
    f.wind_k = 1.0;
    f.lean = lean_back + (self.lean - lean_back) * out_quad((u * 2.5).min(1.0));
    f.lunge = -self.lunge * 0.3 + self.lunge * 1.3 * k;
    f.hop = self.hop * (k * PI).sin();
    f.crouch = self.crouch * (1.0 - k);
'''

