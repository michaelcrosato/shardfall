# Chains & Rope Bridges: everything here is plain rapier joints, built from [[chain]] and [[joint]]
# entries plus ordinary dynamic [[object]]s (no scripts).
#   NORTH   two gorges: an 11 m rope bridge and a 16 m saggy one (stepping on a ledge sets a
#           checkpoint, so a fall puts you back at the end of the bridge you started from)
#   MIDDLE  a wrecking ball on a chain beside a stack of light boxes, a hinged door in a wall,
#           and a row of loose hanging chains
#   SOUTH   a Newton's cradle (five hinged balls) and a seesaw (plank on a hinge)
# Tuning notes (found by testing, keep when editing):
#  - Bridges: fewer, longer planks stay steadier (7 and 12 links); the rope settles about 0.1 m
#    in its first second. sag 0.035 -> feet dip to -0.5 m, sag 0.105 -> -1.8 m (kill zone is
#    below -2.6 m). A chain must not start inside a fixed body (the crane arm / crossbar sit a
#    few cm above the first link), or contact and joint fight and the whole chain jitters.
#  - Wrecking ball: fat links (radius 0.1) and a ball density of 120 keep the chain steady;
#    thin links under a heavy ball stretch and bounce.
#  - Door: the hinge motor with speed 0 is a damper (motor_force 30), so the door stays where
#    you leave it instead of swinging for ever.
#  - Cradle: each ball hangs on a hinge along z, so it only swings along the row.
#  - Seesaw: hinge 0.2 m off the plank centre, so it rests with the east end down. The player
#    cannot step onto a dynamic plank (autostep ignores dynamic bodies): jump on.
name = "Chains & Rope Bridges"
about = "Joints you can walk on and push around: two rope bridges over gorges (one long and saggy), a wrecking ball on a chain, a hinged door, loose hanging chains, a Newton's cradle and a seesaw."
try = [
  "Cross the 11 m rope bridge, feel it sway, then jump up and down in the middle",
  "Cross the 16 m saggy bridge, then walk off its side: you fall in and respawn at the ledge",
  "Run into the wrecking ball so it swings into the box stack (or throw a bomb: F or left click)",
  "Walk into the hinged door from either side and watch it swing open",
  "Walk through the row of hanging chains and watch them swing",
  "Push the first ball of the Newton's cradle and watch the others swing and knock together",
  "Jump onto the seesaw (Space) and walk across the middle: it tips under your weight",
  "Reset the room with F5 to rebuild everything",
]
wing = "physics"
order = 3
primary_device = "keyboard_mouse"
movement_model = "instant"
overlays = ["physics"]
entrance = { at = [20, 26], facing = "south" }

[camera]
tilt = 55.0
distance = 24.0

[layout]
origin = [-20.0, 0.0, -15.0]

[[layout.layer]]
y = 0
map = '''
########################################
#ll___________lllllll________________ll#
#ll___________lllllll________________ll#
#aa___________bblllaa________________bb#
#aa___________bblllaa________________bb#
#aa___________bblllaa________________bb#
#ll___________lllllll________________ll#
#ll___________lllllll________________ll#
#ll___________lllllll________________ll#
#llllllllllllllllllllllllllllllllllllll#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
#......................................#
####################.###################
'''

# #  wall (3 m)        .  floor            l  stone ledge (deep, next to the gorges)
# _  gorge floor + kill zone (falling in respawns you at the last checkpoint)
# a  checkpoint on a ledge, respawn facing east    b  the same, facing west
[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]

[layout.legend.'#']
blocks = [{ y0 = -3.5, y1 = 0, color = "#a89f8b" }, { y0 = 0, y1 = 3.0, color = "#aeb7c2" }]

[layout.legend.'l']
blocks = [{ y0 = -3.5, y1 = -0.5, color = "#a89f8b" }, { y0 = -0.5, y1 = 0, color = "#d9d6cc" }]

[layout.legend.'_']
blocks = [{ y0 = -4.0, y1 = -3.5, color = "#3b3f4a" }]
zone = { kind = "kill", y0 = -3.4, y1 = -2.6 }

[layout.legend.'a']
blocks = [{ y0 = -3.5, y1 = -0.5, color = "#a89f8b" }, { y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "checkpoint", facing = "east" }

[layout.legend.'b']
blocks = [{ y0 = -3.5, y1 = -0.5, color = "#a89f8b" }, { y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "checkpoint", facing = "west" }

