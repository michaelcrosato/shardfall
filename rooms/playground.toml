# Playground: the M2 verticality test. Walk, jump onto crates, climb the ladder to the upper
# floor, blow a hole in it with a bomb (F / left click) and drop through; crawl (Z) through
# the tunnel; jump the gap between the plateaus.
name = "Playground"
about = "Core movement test: crates, stairs, plateaus with a gap, a crawl tunnel, and a two-storey building with a ladder and a destructible upper floor."
try = [
  "Jump onto the 0.5 / 1 / 1.5 m crates (Space; hold for a higher jump)",
  "Walk into the ladder on the building's south wall to climb it",
  "On the upper floor, throw a bomb (F / left click) at the tiles and drop through the hole",
  "Crawl (Z) through the low tunnel; try standing up inside it",
  "Jump the gap between the two plateaus",
  "Hold Backspace to rewind, then do something different",
]
wing = "movement"
order = 0
primary_device = "keyboard_mouse"
entrance = { at = [13, 19], facing = "south" }

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "The first movement test: crates of 0.5, 1 and 1.5 m to jump onto, a three-step stair onto the first of two 1 m plateaus with a 2 m gap between them, a crawl tunnel only 0.8 m high and a two-storey building with a ladder on its south wall. Its upper floor is cracked tiles you can bomb away and drop through, the orange crates can be pushed around, and holding Backspace rewinds time."
how = [
  "You are a capsule moved by Rapier's kinematic character controller: each tick it tries the move you asked for, slides along whatever blocks it and climbs anything up to 0.32 m by itself (auto-step). The stair's 0.25 m steps are under that, so you walk up; the crates are not, so you jump.",
  "A jump sets your upward speed to the square root of 2 x gravity x jump_height. Holding Space keeps it; letting go early keeps only 45% of it, so a tap gives a short hop and a held jump reaches even the 1.5 m crate.",
  "Crouch (C) shrinks the capsule to 1.15 m and crawl (Z) to 0.66 m. Getting taller first tests whether the bigger capsule would overlap anything, so inside the 0.8 m tunnel you stay down instead of popping through the roof.",
  "A ladder is a marked strip in front of a wall: walking into it below the top latches you on, then up and down climb at 3.2 m/s. At the top you are pushed over the lip, and Space jumps off backwards.",
  "A bomb flies on an arc that lands on your aim point after 0.55 s and goes off 1.4 s after the throw: every destructible tile within 1.35 m is removed from the static world (collider and all) and replaced by a few tumbling debris boxes, and props and characters within 2.5 times that radius are pushed away.",
  "Rewind works because the simulation is deterministic: it keeps a full snapshot every 20 ticks plus every tick's input, and going back restores the nearest snapshot and replays the inputs from there.",
]
uses = [
  "Platform basics: ladders, crates and drops are the oldest verbs in games (Donkey Kong).",
  "Bombs that dig: blasting through the ground opens new routes (Spelunky, Bomberman).",
  "Crawl spaces: squeezing through vents to get past things (Metal Gear Solid).",
  "Variable jumps: tap for a hop, hold for a full jump (Super Mario Bros.).",
  "Rewind: undo a mistake and try again (Braid, Prince of Persia: The Sands of Time).",
]
ask = [
  "kinematic character controller with auto-step",
  "variable jump height (hold to jump higher)",
  "crouch and crawl that cannot stand up under a ceiling",
  "ladder climbing with jump-off",
  "destructible floor tiles removed by bombs",
  "time rewind with snapshots and input replay",
]
cost = "The character is a few shape casts per tick on the CPU. A blast is one sphere query plus removing the touched tiles' colliders, and its debris are short-lived physics bodies (3 to 5 per tile, gone after 2.5 to 4 s). Rewind memory grows with the window: one full copy of the simulation state every 20 ticks for 30 s."
knobs = ["movement.jump_height", "movement.jump_cut", "movement.step_height", "movement.climb_speed", "bombs.radius", "sim.history_seconds"]
terms = ["game feel", "rigid body", "determinism", "fixed timestep"]

[[learn.code]]
title = "Auto-step, slopes and ground snapping"
file = "crates/pav_core/src/character.rs"
lang = "rust"
src = """
let kcc = KinematicCharacterController {
    up: Vector::Y,
    offset: CharacterLength::Absolute(0.02),
    slide: true,
    autostep: (!climbing && !hanging).then_some(CharacterAutostep {
        max_height: CharacterLength::Absolute(mp.step_height as Real),
        min_width: CharacterLength::Absolute(0.12),
        // Step onto low planks, seesaws and debris (tall crates still get pushed).
        include_dynamic_bodies: true,
    }),
    max_slope_climb_angle: 50f32.to_radians() as Real,
    min_slope_slide_angle: 40f32.to_radians() as Real,
    snap_to_ground: (was_grounded && ch.vel.y <= 0.0 && !climbing && !hanging && !ch.swimming)
        .then_some(CharacterLength::Absolute(0.25)),
    normal_nudge_factor: 1.0e-4,
};
"""

[[learn.code]]
title = "Never stand up into a ceiling"
file = "crates/pav_core/src/character.rs"
lang = "rust"
src = """
if want != ch.posture {
    let feet = center - Vec3::Y * (ch.height() * 0.5);
    let fits = |p: Posture| -> bool {
        if p.height() <= ch.posture.height() {
            return true;
        }
        let shape = SharedShape::capsule_y(p.half_height(), RADIUS - 0.02);
        let pose = Pose::from_translation(feet + Vec3::Y * (p.height() * 0.5 + 0.01));
        st.physics.query_filtered(filter).intersect_shape(pose, shape.as_ref()).next().is_none()
    };
    let next = if fits(want) {
        Some(want)
    } else if want == Posture::Stand && fits(Posture::Crouch) {
        Some(Posture::Crouch)
    } else {
        None
    };
    if let Some(p) = next.filter(|p| *p != ch.posture) {
        ch.posture = p;
        if let Some(c) = st.physics.colliders.get_mut(col_h) {
            c.set_shape(SharedShape::capsule_y(p.half_height(), RADIUS));
        }
        center = feet + Vec3::Y * (p.height() * 0.5);
    }
}
"""

[[learn.code]]
title = "A blast removes destructible tiles"
file = "crates/pav_core/src/sim.rs"
lang = "rust"
src = """
/// Removes destructible blocks in the radius, throws debris and pushes things away.
pub fn explode(&mut self, pos: Vec3, radius: f32, events: &mut Vec<SimEvent>) {
    let hit = self.state.statics.blocks_in_sphere(pos, radius);
    let mut debris = Vec::new();
    for r in hit {
        if !self.state.statics.get(r).is_some_and(|b| b.has(block_flags::DESTRUCTIBLE)) {
            continue;
        }
        let st = &mut self.state;
        if let Some(b) = st.statics.destroy(&mut st.physics, r) {
            debris.push((b.center(), b.half(), b.color));
        }
    }
"""

