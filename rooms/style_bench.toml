# Character Style Bench: one character, a swingable camera, and a switch between the looks.
#   NORTH  LINE-UP: four bipeds with the same colours (CUTOUT / FLAT / CEL / LIT) each walking its own
#          circle, plus a cutout spider and a lit spider. Nobody can leave: circle brains.
#   MIDDLE THE STAGE: the player is the character. West = LOOK pads (puppet.look), east = CAMERA
#          pads (fixed tilts + auto swing). The stage's west/east bands are camera zones that sweep
#          the yaw / tilt while you stand in them; two more zones in the viewing strip in front of
#          the line-up do the same from further away.
#   SOUTH  CHEATS pads: eyes_to_camera, face_camera (lean to camera), anim_fps 12 ("on twos").
# Pads keep their effect until another pad changes it or you leave the room (they are plain
# `params = { "puppet.xxx" = ... }`). Camera zones win over the sticky pad camera while you stand in
# them. A zone's camera cue applies on top of the camera from before the first cue, so every
# zone/pad sets what it needs (tilt, yaw, distance) explicitly.
name = "Character Style Bench"
about = "One character, a camera you can swing around it, and a switch between the looks: cutout (flat 2D art on a camera-facing card), flat, cel and lit. Camera-aware cheats (eyes to camera, lean to camera) and stepped animation (on twos) are one pad away, and a line-up of four identical characters plus two spiders shows every look under the same camera."
try = [
  "Walk onto the CUTOUT pad, then the stage, and run east and west: the 2D card mirrors with your facing",
  "Step on the SIDE 15 pad with CUTOUT on, then TOP 85: the flat art stays readable, a 3D puppet shows its top",
  "Stand in the YAW SWING band of the stage (or the strip in front of the line-up) and watch every look turn with the camera",
  "Stand in the TILT SWING band: the camera sweeps tilt 20 to 85 and the cutout card tilts with it",
  "AUTO SWING pad: sticky yaw + tilt sweeps, so you can walk around the line-up comparing the four looks",
  "EYES TO CAMERA ON/OFF and LEAN TO CAMERA ON/OFF under the TOP 85 camera: face and body stay visible from above",
  "ON TWOS pad: the animation drops to 12 fps (stepped, hand-drawn feel); SMOOTH puts it back, ALL CHEATS ON stacks them",
  "Compare the spiders (cutout vs lit) and the 3/4 view; RESET puts look, cheats and camera back",
]
wing = "animation"
order = 6
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 55.0
distance = 20.0
fov = 40.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "One character, a camera that swings round it, and four looks. The LINE-UP has four bipeds in the same colours drawn CUTOUT, FLAT, CEL and LIT, plus a cutout and a lit spider. On THE STAGE you are the character: LOOK pads switch your look, CAMERA pads fix the angle or swing it, and the YAW SWING and TILT SWING bands sweep the camera while you stand in them. The CHEATS pads add tricks for high cameras: eyes to camera, lean to camera and on twos."
how = [
  "Every puppet is a set of rounded cones (capsules with a different radius at each end) placed by the animation. The GPU draws each as a box and, per pixel, intersects the view ray with the exact shape, so limbs stay perfectly round from any angle.",
  "FLAT, CEL and LIT only change the lighting in the same shader. FLAT shows the colours with shadows darkening them (to 62%); CEL, the default, is lit or unlit in hard bands with soft sky fill and a thin rim light on the edges; LIT has a smooth light gradient and a specular glint.",
  "CUTOUT is a geometry trick on the CPU: the side view of the pose is laid onto a card that faces the camera (forward becomes screen right, up becomes screen up) and depth is squeezed to a quarter, just enough to keep near limbs in front. When you face the other way the card mirrors, like a flipped sprite; it is shaded FLAT.",
  "Eyes to camera slides the eyes from the front of the face toward the top of the head as the camera rises, so a top-down view still shows a face. Lean to camera tips the whole body toward the camera by half the camera's elevation angle, pivoting at the feet.",
  "On twos holds the walk cycle for 1/12 s at a time while position and lean stay smooth. CAMERA pads stay set until another pad; the swing bands ease yaw between -60 and 60 or tilt between 20 and 85 degrees over 8 s and win while you stand in them.",
]
uses = [
  "Paper Mario: flat paper characters in a 3D world that flip over when they turn round.",
  "Don't Starve: hand-drawn 2D characters standing upright as flat cards in a 3D world.",
  "Guilty Gear Xrd: 3D fighters with cel shading, held poses instead of smooth blending, and per-shot model tweaks so every frame reads like 2D anime.",
  "Cel shading: The Legend of Zelda: The Wind Waker, Borderlands and Jet Set Radio.",
  "Octopath Traveler: 2D pixel sprites standing as cards in a 3D diorama.",
]
ask = [
  "paper cutout characters in a 3D world that flip when they turn",
  "cel-shaded characters with a rim light",
  "keep faces readable from a top-down camera",
  "3D characters animated on twos to look hand-drawn",
  "a camera that swings round the character to compare looks",
]
cost = "The four looks cost the same: one shader with a branch per style, and LIT adds a specular power. Each shape costs the screen pixels it covers (one ray test each) and all puppets share one instanced draw. Cutout, eyes and lean are a few vector operations per shape on the CPU."
knobs = ["puppet.look", "puppet.eyes_to_camera", "puppet.face_camera", "puppet.anim_fps", "camera.tilt", "camera.yaw"]
terms = ["cel shading", "flat shading", "rim light", "specular", "sdf", "procedural animation"]

[[learn.code]]
title = "Cutout: the pose laid on a camera-facing card"
file = "crates/pav_core/src/puppet.rs"
lang = "rust"
src = """
if def.look == Look::Cutout {
    // Character space -> card: forward maps to screen right (or left when facing left),
    // up to the camera's up; depth shrinks to a thin layering offset.
    let inv = Quat::from_rotation_y(facing).inverse();
    let fwd_w = Quat::from_rotation_y(facing) * Vec3::Z;
    let sign = if fwd_w.dot(cam_right) >= 0.0 { 1.0 } else { -1.0 };
    let cam_up = cam_right.cross(cam_fwd).normalize_or(Vec3::Y);
    let toward = -cam_fwd;
    let card = |p: Vec3| -> Vec3 {
        let l = inv * (p - feet);
        feet + cam_right * (l.z * sign) + cam_up * l.y + toward * (-l.x * sign * 0.25)
    };
    for p in parts.iter_mut() {
        p.a = card(p.a);
        p.b = card(p.b);
    }
    // ...
}
"""

[[learn.code]]
title = "Lean and eyes toward the camera"
file = "crates/pav_core/src/puppet.rs"
lang = "rust"
src = """
if def.face_camera > 0.0 {
    let elev = (-cam_fwd.y).clamp(0.0, 1.0).asin();
    let q = Quat::from_axis_angle(cam_right, elev * def.face_camera * 0.5);
    for p in parts.iter_mut() {
        p.a = feet + q * (p.a - feet);
        p.b = feet + q * (p.b - feet);
    }
}
// ...
// Eyes: on the face, pushed toward the camera so they read from high angles.
let cam_up = (-cam_fwd).dot(up).clamp(0.0, 1.0) * def.eyes_to_camera;
let face_dir = (Vec3::Z * (1.0 - cam_up) + Vec3::Y * cam_up * 1.2).normalize();
"""

[[learn.code]]
title = "Flat, cel and lit in the scene shader"
file = "crates/pav_render/src/shaders/scene.wgsl"
lang = "wgsl"
src = """
let hemi = mix(g.ground_color.rgb, g.sky_color.rgb, n.y * 0.5 + 0.5);
var col: vec3<f32>;
if (style == 0u) {
    col = albedo * mix(g.style.x, 1.0, sh);
} else if (style == 1u) {
    let lit = quantize(clamp(ndl, 0.0, 1.0) * sh, max(g.style.y - 1.0, 1.0));
    let direct = step(0.02, ndl) * sh;
    let amount = select(lit, direct, g.style.y <= 2.0);
    let rim = step(0.72, 1.0 - max(dot(n, v), 0.0)) * g.style.z * (0.4 + 0.6 * amount);
    col = albedo * (hemi + g.sun_color.rgb * amount) + albedo * rim;
} else {
    let dl = max(ndl, 0.0) * sh;
    let h = normalize(l + v);
    let spec = pow(max(dot(n, h), 0.0), 40.0) * g.style.w * sh;
    col = albedo * (hemi + g.sun_color.rgb * dl) + g.sun_color.rgb * spec;
}
"""

