# Character Style Bench: one character, a swingable camera, and a switch between the looks.
#   NORTH  LINE-UP: four bipeds with the same colours (CUTOUT / FLAT / CEL / LIT) each walking its own
#          circle, plus a cutout spider and a lit spider. Nobody can leave: circle brains.
#   MIDDLE THE STAGE: the player is the character. West = LOOK pads (puppet.look), east = CAMERA
#          pads (fixed tilts + auto swing). The stage's west/east bands are camera zones that sweep
#          the yaw / tilt while you stand in them; two more zones in the viewing strip in front of
#          the line-up do the same from further away.
#   SOUTH  CHEATS pads: eyes_to_camera, face_camera (lean to camera), anim_fps 12 ("on twos").
# Pads keep their effect until another pad changes it or you leave the room (they are plain
# `params = { "puppet.xxx" = ... }`). Camera zones win over the sticky pad camera while you stand in
# them. A zone's camera cue applies on top of the camera from before the first cue, so every
# zone/pad sets what it needs (tilt, yaw, distance) explicitly.
name = "Character Style Bench"
about = "One character, a camera you can swing around it, and a switch between the looks: cutout (flat 2D art on a camera-facing card), flat, cel and lit. Camera-aware cheats (eyes to camera, lean to camera) and stepped animation (on twos) are one pad away, and a line-up of four identical characters plus two spiders shows every look under the same camera."
try = [
  "Walk onto the CUTOUT pad, then the stage, and run east and west: the 2D card mirrors with your facing",
  "Step on the SIDE 15 pad with CUTOUT on, then TOP 85: the flat art stays readable, a 3D puppet shows its top",
  "Stand in the YAW SWING band of the stage (or the strip in front of the line-up) and watch every look turn with the camera",
  "Stand in the TILT SWING band: the camera sweeps tilt 20 to 85 and the cutout card tilts with it",
  "AUTO SWING pad: sticky yaw + tilt sweeps, so you can walk around the line-up comparing the four looks",
  "EYES TO CAMERA ON/OFF and LEAN TO CAMERA ON/OFF under the TOP 85 camera: face and body stay visible from above",
  "ON TWOS pad: the animation drops to 12 fps (stepped, hand-drawn feel); SMOOTH puts it back, ALL CHEATS ON stacks them",
  "Compare the spiders (cutout vs lit) and the 3/4 view; RESET puts look, cheats and camera back",
]
wing = "animation"
order = 6
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 55.0
distance = 20.0
fov = 40.0

[layout]
origin = [-20.0, 0.0, -15.0]

[[layout.layer]]
y = 0
map = '''
########################################
#......................................#
#.ppppp.ppppp.ppppp.ppppp.ppppp.ppppp..#
#.ppppp.ppppp.ppppp.ppppp.ppppp.ppppp..#
#.ppppp.ppppp.ppppp.ppppp.ppppp.ppppp..#
#.ppppp.ppppp.ppppp.ppppp.ppppp.ppppp..#
#.ppppp.ppppp.ppppp.ppppp.ppppp.ppppp..#
#......................................#
#......................................#
#............yyyyyy..uuuuuu............#
#............yyyyyy..uuuuuu............#
#.....cccccc................ssssss.....#
#.....cccccc....aaaaaaaa....ssssss.....#
#..............aaaaaPaaaa..............#
#.....ffffff..YYYaaaaaaUUU..tttttt.....#
#.....ffffff..YYYaaaaaaUUU..tttttt.....#
#.............YYYaaaaaaUUU.............#
#.....eeeeee..YYYaaaaaaUUU..oooooo.....#
#.....eeeeee..YYYaaaaaaUUU..oooooo.....#
#.............YYYabbaaaUUU.............#
#.....llllll...aaaaaaaaaa...wwwwww.....#
#.....llllll....aaaaaaaa....wwwwww.....#
#......................................#
#...111111.222222......555555.666666...#
#...111111.222222......555555.666666...#
#......................................#
#...333333.444444......rrrrrr.AAAAAA...#
#...333333.444444......rrrrrr.AAAAAA...#
#......................................#
###################..###################
'''

# Floors, walls (3 m), line-up plates, the stage (centre / yaw band / tilt band), pillar and step.
[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }, { y0 = 0, y1 = 3.0, color = "#aeb7c2" }]

[layout.legend.'p']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c3cdd9" }]

[layout.legend.'a']
blocks = [{ y0 = -0.5, y1 = 0, color = "#ebe4d2" }]

[layout.legend.'P']
blocks = [{ y0 = -0.5, y1 = 0, color = "#ebe4d2" }, { y0 = 0, y1 = 1.5, color = "#9aa5b1", rounded = true, inset = 0.1 }]

[layout.legend.'b']
blocks = [{ y0 = -0.5, y1 = 0, color = "#ebe4d2" }, { y0 = 0, y1 = 0.5, color = "#c9a27a", rounded = true }]

# Camera zones (apply while you stand inside; they win over the sticky pad camera).
[layout.legend.'Y']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfe0f5" }]
zone = { kind = "camera", label = "YAW SWING", color = "#3d7bd9", label_size = 0.4, camera = { set = { tilt = 45,  ortho = false }, sweep = [{ param = "yaw", from = -60, to = 60, period = 8 }] } }

[layout.legend.'U']
blocks = [{ y0 = -0.5, y1 = 0, color = "#f5dcc8" }]
zone = { kind = "camera", label = "TILT SWING", color = "#d9772e", label_size = 0.4, camera = { set = { yaw = 0,  ortho = false }, sweep = [{ param = "tilt", from = 20, to = 85, period = 8 }] } }

[layout.legend.'y']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfe0f5" }]
zone = { kind = "camera", label = "LINE-UP VIEW: YAW SWING", color = "#3d7bd9", label_size = 0.34, camera = { set = { tilt = 45, distance = 26, ortho = false }, sweep = [{ param = "yaw", from = -60, to = 60, period = 8 }] } }

[layout.legend.'u']
blocks = [{ y0 = -0.5, y1 = 0, color = "#f5dcc8" }]
zone = { kind = "camera", label = "LINE-UP VIEW: TILT SWING", color = "#d9772e", label_size = 0.34, camera = { set = { yaw = 0, distance = 26, ortho = false }, sweep = [{ param = "tilt", from = 20, to = 85, period = 8 }] } }

# LOOK pads (west of the stage): puppet.look.
[layout.legend.'c']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "CUTOUT", color = "#8a52d6", label_size = 0.55, params = { "puppet.look" = "cutout" } }

[layout.legend.'f']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "FLAT", color = "#4f7be0", label_size = 0.55, params = { "puppet.look" = "flat" } }

[layout.legend.'e']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "CEL", color = "#2e9e68", label_size = 0.55, params = { "puppet.look" = "cel" } }

[layout.legend.'l']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "LIT", color = "#d4891c", label_size = 0.55, params = { "puppet.look" = "lit" } }

# CAMERA pads (east of the stage): fixed angles and an auto swing (sticky until another pad).
[layout.legend.'s']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "SIDE 15", color = "#e0623a", label_size = 0.5, camera = { set = { tilt = 15, yaw = 0, ortho = false } } }

[layout.legend.'t']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "3/4 VIEW 45", color = "#d4891c", label_size = 0.5, camera = { set = { tilt = 45, yaw = 0, ortho = false } } }

[layout.legend.'o']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "TOP 85", color = "#4f7be0", label_size = 0.5, camera = { set = { tilt = 85, yaw = 0, ortho = false } } }

[layout.legend.'w']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "AUTO SWING", color = "#c43fb0", label_size = 0.5, camera = { set = { ortho = false }, sweep = [{ param = "yaw", from = -60, to = 60, period = 8 }, { param = "tilt", from = 20, to = 85, period = 12 }] } }

# CHEATS pads (south): eyes_to_camera, face_camera (lean to camera), anim_fps (on twos).
[layout.legend.'1']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "EYES TO CAMERA ON", color = "#3bb273", label_size = 0.34, params = { "puppet.eyes_to_camera" = 1 } }

[layout.legend.'2']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "EYES TO CAMERA OFF", color = "#e07a5f", label_size = 0.34, params = { "puppet.eyes_to_camera" = 0 } }

[layout.legend.'3']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "LEAN TO CAMERA ON", color = "#3bb273", label_size = 0.34, params = { "puppet.face_camera" = 1 } }

[layout.legend.'4']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "LEAN TO CAMERA OFF", color = "#e07a5f", label_size = 0.34, params = { "puppet.face_camera" = 0 } }

[layout.legend.'5']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "ON TWOS: 12 FPS", color = "#3bb273", label_size = 0.4, params = { "puppet.anim_fps" = 12 } }

[layout.legend.'6']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "SMOOTH ANIMATION", color = "#e07a5f", label_size = 0.4, params = { "puppet.anim_fps" = 0 } }

[layout.legend.'r']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "RESET ALL", color = "#6b7280", label_size = 0.5, params = { "puppet.look" = "cel", "puppet.eyes_to_camera" = 0.6, "puppet.face_camera" = 0, "puppet.anim_fps" = 0 }, camera = { set = { tilt = 55, yaw = 0, distance = 20, ortho = false } } }

[layout.legend.'A']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "ALL CHEATS ON", color = "#7a5cff", label_size = 0.45, params = { "puppet.eyes_to_camera" = 1, "puppet.face_camera" = 1, "puppet.anim_fps" = 12 } }

