# Spring platforms: 1.6 x 0.3 x 1.6 m slabs (100 kg/m3) on vertical slider joints to the world.
# The slider spring is acceleration based: it sags g/k under gravity (so each slab starts g/k above
# its 0.85 m rest height) and sinks further under the player. Slider limits are measured as
# (world anchor - slab anchor) along the axis, so [-0.25, 1.0] = 0.25 m up, 1.0 m down.
[[object]]
name = "plat_base_0"
shape = { type = "box", half = [0.95, 0.03, 0.95] }
pos = [5.5, 0.03, 23.0]
body = "fixed"
color = "#6c7684"

[[object]]
name = "plat_0"
shape = { type = "box", half = [0.8, 0.15, 0.8] }
pos = [5.5, 0.789, 23.0]
color = "#ff8fb1"
density = 100
friction = 0.8

[[joint]]
a = "plat_0"
b = ""
at = [5.5, 0.789, 23.0]
joint = { type = "slider", axis = [0, 1, 0], limits = [-1.0, 0.25], spring = 110, damping = 2.5 }

[[object]]
name = "plat_base_1"
shape = { type = "box", half = [0.95, 0.03, 0.95] }
pos = [10.5, 0.03, 23.0]
body = "fixed"
color = "#6c7684"

[[object]]
name = "plat_1"
