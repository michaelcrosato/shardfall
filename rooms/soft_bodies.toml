# Springs & Soft Bodies: things that squish, stretch, swing and bounce back. Everything is data:
# soft = { .. } objects (jelly, balloons, cloth, rope) plus [[joint]]s on plain dynamic objects.
#   NORTH  jelly stiffness row, balloons, a hanging banner
#   MIDDLE a walk-through cloth curtain and ropes (one with a dangling box)
#   SOUTH  spring platforms to jump on, wobbly spring-mounted posts and a spring-tethered ball
# Soft bodies: stiffness is the spring natural frequency in Hz (balloons need >= 10 to stay round,
# and from ~50 up the particles jitter); a rope tied to a box needs segment length >= box half size,
# else the end particles fight the box's collider.
name = "Springs & Soft Bodies"
about = "Things that give and spring back: three jelly cubes from soft to stiff, balloons, a cloth curtain and a banner you can walk through, ropes, spring platforms that sink and bob under you, and wobbly posts and a ball on springs."
try = [
  "Run into the SOFT, MEDIUM and STIFF jelly cubes and compare how they squash and rebound",
  "Push the balloons around the floor: the stiff one keeps its shape, the soft one flops",
  "Run through the cloth curtain and the banner and watch the cloth swish around you",
  "Bump the ropes, and swing the box that dangles from the one on the right",
  "Jump onto the SPRING PLATFORMS: they sink under your weight and bob back up when you hop off",
  "Shove the wobbly posts, then throw bombs (F or left click at the cursor) at them and the spring ball",
  "Run into the spring ball: it is tied to its spot by a spring and snaps back, overshooting",
  "Reset the room with F5 to put everything back",
]
wing = "physics"
order = 2
primary_device = "keyboard_mouse"
movement_model = "instant"
overlays = ["physics"]
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 55.0
distance = 26.0

