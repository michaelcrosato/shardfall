# Helicopter Run: a small city of 5-14 m towers, an arcade helicopter and a timed flight course.
# Get into the helicopter on the START pad (interact = E), wait for the rotor to spin up (~1.5 s),
# then hold Space to climb, C to descend and move with WASD (it leans into its motion and turns
# toward where it goes; with no input it hovers). Course "flight": leave the START pad (the clock
# starts), fly through the 9 floating rings in order (a missed ring adds 2 s) and land on the
# checkered FINISH pad on the north-east tower roof (touching the roof stops the clock).
#   SOUTH plaza  START helipad (centre, at the entrance); PRACTICE helipad with a slow green trainer
#                helicopter and a LANDING TARGET (bullseye) to the west; a terminal and hangar east.
#   COURSE       avenue north (rings 1-3), over the low teal roof (CHECKPOINT pad), west street south
#                (rings 4-6), east along the plaza, east street north (rings 7-9), then onto the
#                FINISH roof. Every ring faces north-south (the camera looks north).
# Why it is built this way:
# - Zones are boxes on the floor plane with a height range, tested against the helicopter's BOTTOM
#   (the player's feet while seated): the rings are gate zones at y0..y1 = 3..10 m, the START zone
#   is 0..1.5 m (leaving it, also upward, starts the clock) and the FINISH zone is the roof plus
#   0.2 m (so you have to touch down).
# - The pavilion only tracks the player inside a room up to ~12 m (the room volume is 8 m + 4 m), and
#   leaving it cancels the course run. So the air above 10.4 m (heli bottom) and above the walls
#   (9 m; the south wall is only 3 m so it never hides the plaza) is a kill volume: it puts you back
#   on your last checkpoint. The towers taller than ~10 m (12-14 m) are obstacles, not rooftops.
# - The entrance gap (2 cells) is narrowed to 1.2 m by two bollards so the helicopter cannot taxi
#   out; the player fits.
# Map key: '.' street, ',' plaza, ':' practice yard, '#' wall (9 m), '=' south wall, '_' entrance,
# 'S' START, 'T' practice pad, 'o' 'w' 'x' '+' landing target, '1'-'9' ring zones, 'K' checkpoint,
# 'F' finish pad, 'A'-'Q' towers (height and colour per letter, see the legend). Every tile also
# carries the ceiling kill volume unless it has a zone of its own.

name = "Helicopter Run"
about = "A small city of towers to fly through in an arcade helicopter (E to get in): hover and land on the practice pad, then run the 9-ring course from the START pad up the avenue, down the west street and up the east street to a landing on the FINISH roof."
try = [
  "Walk onto the START pad and press E at the red helicopter; wait ~1.5 s for the rotor to spin up",
  "Hold Space to climb, C to descend, WASD to fly; let go of everything and it hovers",
  "Practice first: take the green trainer (slower, gentler) from the PRACTICE pad, hover, and land on the TOUCHDOWN bullseye",
  "Run the course: leaving the START pad starts the clock; fly through rings 1-9 in order (a missed ring is +2 s)",
  "Skim over the low teal roof on the way to ring 4: its CHECKPOINT pad moves your respawn point there",
  "Rings are high and low on purpose: watch their heights against the towers",
  "Land on the checkered FINISH pad on top of the north-east tower: touching the roof stops the clock",
  "Fly over a wall or above ~10 m and you are sent back to your last checkpoint; press E to get out (F5 resets the room)",
]
wing = "genre"
order = 4
primary_device = "keyboard_mouse"
movement_model = "instant"
height = 16                    # flying room: the volume reaches above the rooftops
entrance = { at = [29, 43], facing = "south" }
controls = [["Get in / out", "E (near the helicopter)"], ["Fly", "W A S D"], ["Climb", "Space (hold)"], ["Descend", "C / Ctrl (hold)"], ["Hover", "let go of everything"]]

# Far, high camera: you see the streets and the next ring.
[camera]
tilt = 50.0
distance = 24.0

[layout]
origin = [-30.0, 0.0, -22.0]

