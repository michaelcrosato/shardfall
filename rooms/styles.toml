# Pure Styles: the engine's own looks, without any screen filter.
#   NORTH  FOUR DIORAMAS: the same little scene (boxes, spheres, a capsule figure, a rounded box,
#          a cylinder) built four times; every object of a diorama has look = flat / cel / lit /
#          unlit. The rounded box in each turns slowly so you can watch the shading move.
#   SOUTH  four pad columns under the dioramas, one per view setting group:
#          STYLE (view.style forces one look everywhere), OUTLINE (outlines, outline_px,
#          outline_darken), CEL BANDS + RIM (cel_bands, rim), TONE (tonemap, next to emissive
#          spheres of rising brightness). RESET pads restore every setting they touch.
# Pads are sticky: a pad's settings last until another pad changes them or you leave the room.
# Each pad sets everything its group needs, so the pads of one group never leave a mixed state.
# Written by a small script: the four dioramas are one scene description emitted four times, so edit all four together.
name = "Pure Styles"
about = "The engine's own looks without screen filters: the same little scene built four times as flat, cel, lit and unlit, plus pads that force one style everywhere, change the outlines and cel bands, add a rim light and compare the three tonemaps next to glowing spheres."
try = [
  "Walk along the four dioramas (FLAT, CEL, LIT, UNLIT) and compare the same boxes, spheres and figure",
  "Step on FORCE FLAT, FORCE CEL and FORCE LIT: every object in the room changes at once; PER OBJECT undoes it",
  "Check the row of four spheres under the STYLE pads: each has its own look until a FORCE pad overrides it",
  "OUTLINE pads: OFF, THIN (1 px), THICK (3 px) and INK (black); look at the thin posts below the pads",
  "CEL BANDS pads: 2, 3 and 5 light bands on the smooth spheres, then RIM ON / RIM OFF for the edge glow",
  "TONE pads: CLAMP, SOFT KNEE and ACES next to the glowing spheres (emissive 0.6 to 4): watch the colours burn out or hold",
  "Combine groups: FORCE LIT plus 5 BANDS plus ACES, or FORCE FLAT plus INK for a comic look",
  "Any RESET pad puts every setting back to the room defaults",
]
wing = "aesthetic"
order = 1
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 55.0
distance = 24.0

# A slightly lower, stronger sun and less ambient light, so the difference between flat, cel and
# lit shading is easy to see, and a little less bloom so the glowing spheres do not wash out the
# floor (the RESET pads do not touch these).
[view]
"light.sun_elevation" = 60.0
"light.sun_intensity" = 0.85
"light.ambient" = 0.7
bloom = 0.2

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "The same little scene (boxes, spheres, a capsule figure, a slowly turning rounded box and a cylinder) is built four times, once per surface style: FLAT, CEL, LIT and UNLIT. The pad columns below force one style everywhere, change the OUTLINES, set the CEL BANDS and the rim light, and swap the TONEMAP beside five spheres glowing at emissive 0.6 to 4. No screen filter is involved: this is how surfaces themselves take light."
how = [
  "Each object carries a style, and the scene's fragment shader runs one branch of the same shade() function per pixel. view.style can force one style on everything, the UNLIT diorama included.",
  "Flat: the object's own colour, darkened to view.flat_shadow (62%) only where the sun's shadow falls. There is no light direction at all, so a sphere looks like a disc.",
  "Cel: N.L (how squarely the surface faces the sun) is cut into view.cel_bands hard steps; with 2 bands a surface is simply lit or not. A rim light (view.rim) brightens the edges that turn away from the camera.",
  "Lit: smooth N.L light plus a Blinn-Phong highlight (power 40) scaled by view.specular. Unlit: the colour as it is, brightened by its emissive value, ignoring every light.",
  "Outlines are a post-process: the composite compares each pixel's depth, normal and object id with neighbours view.outline_px away, and an edge takes outline_darken times the surface colour (0 = black ink).",
  "Tonemapping squeezes HDR colour (above 1.0) into the screen's range: CLAMP cuts each channel at 1, SOFT KNEE keeps everything below 0.8 exact and rolls off above, ACES is a film-like S-curve that adds contrast and pushes very bright colours towards white.",
]
uses = [
  "Cel shading: hard light bands and ink lines (The Legend of Zelda: The Wind Waker, Borderlands, Genshin Impact).",
  "Flat shading: graphic, low-detail looks built from solid colour instead of light (Monument Valley).",
  "Lit with highlights: the default of realistic and semi-realistic 3D games.",
  "Unlit: UI markers, glowing signs, holograms and skies that should never change with the lighting.",
  "Tonemapping: every HDR game has one; Unreal Engine 4 switched its default to a filmic ACES-based curve.",
]
ask = [
  "cel shading with 3 bands, a rim light and ink outlines",
  "flat-shaded low-poly look with soft shadow tones",
  "per-object surface style (flat, cel, lit, unlit)",
  "ACES filmic tonemapping for HDR glow",
  "screen-space outlines from depth and normals",
]
cost = "Styles are nearly free: one branch of the same shader, lit a few operations dearer for its highlight. Outlines are the real cost here: every pixel compares depth, normal and id with 4 neighbours for each of the 4 MSAA samples, whatever the thickness. The three tonemaps are a few operations each."
knobs = ["view.style", "view.cel_bands", "view.rim", "view.outline_px", "view.outline_darken", "view.tonemap"]
terms = ["flat shading", "cel shading", "rim light", "specular", "outline", "tonemapping", "hdr", "emissive"]

[[learn.code]]
title = "Flat, cel, lit and unlit in one function"
file = "crates/pav_render/src/shaders/scene.wgsl"
lang = "wgsl"
src = """
if (style == 3u) {
    return apply_fog(p, albedo * max(1.0, 1.0 + emissive));
}
// ...
var col: vec3<f32>;
if (style == 0u) {
    col = albedo * mix(g.style.x, 1.0, sh);
} else if (style == 1u) {
    let lit = quantize(clamp(ndl, 0.0, 1.0) * sh, max(g.style.y - 1.0, 1.0));
    let direct = step(0.02, ndl) * sh;
    let amount = select(lit, direct, g.style.y <= 2.0);
    let rim = step(0.72, 1.0 - max(dot(n, v), 0.0)) * g.style.z * (0.4 + 0.6 * amount);
    col = albedo * (hemi + g.sun_color.rgb * amount) + albedo * rim;
} else {
    let dl = max(ndl, 0.0) * sh;
    let h = normalize(l + v);
    let spec = pow(max(dot(n, h), 0.0), 40.0) * g.style.w * sh;
    col = albedo * (hemi + g.sun_color.rgb * dl) + g.sun_color.rgb * spec;
}
"""

[[learn.code]]
title = "Hard cel bands"
file = "crates/pav_render/src/shaders/scene.wgsl"
lang = "wgsl"
src = """
fn quantize(x: f32, bands: f32) -> f32 {
    // Hard-edged bands with a hair of smoothing to avoid shimmering.
    let s = x * bands;
    let f = floor(s);
    return (f + smoothstep(0.45, 0.55, s - f)) / bands;
}
"""

[[learn.code]]
title = "Three tonemaps"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = """
fn tonemap(c: vec3<f32>, mode: f32) -> vec3<f32> {
    if (mode < 0.5) {
        return clamp(c, vec3<f32>(0.0), vec3<f32>(1.0));
    }
    if (mode < 1.5) {
        let k = 0.8;
        let over = k + (1.0 - k) * (1.0 - exp(-(c - vec3<f32>(k)) / (1.0 - k)));
        return select(c, over, c > vec3<f32>(k));
    }
    let a = 2.51;
    let b = 0.03;
    let cc = 2.43;
    let d = 0.59;
    let e = 0.14;
    return clamp((c * (a * c + b)) / (c * (cc * c + d) + e), vec3<f32>(0.0), vec3<f32>(1.0));
}
"""

