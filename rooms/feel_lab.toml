# Movement model pads.
[layout.legend.'I']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }]
zone = { kind = "pad", label = "INSTANT", color = "#5b8def", params = { "movement.model" = "instant" }, note = "Velocity is set to 6 m/s on the very tick you press and to zero when you let go: no run-up, no slide. Precise but weightless." }
[layout.legend.'M']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }]
zone = { kind = "pad", label = "MOMENTUM", color = "#e07a5f", params = { "movement.model" = "momentum" }, note = "Speeds up at 45 m/s² to 7.5 m/s, coasts down at 32 and brakes at 90 when you reverse. The overlay shows about 0.15 s to top speed and a stop that slides 0.7 m." }
[layout.legend.'G']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }]
zone = { kind = "pad", label = "GRID", color = "#3bb273", params = { "movement.model" = "grid" }, note = "One 1 m tile every 0.16 s (6.25 m/s). A step always finishes, so you stop on tile centres, and you only move in four directions." }
[layout.legend.'C']
blocks = [{ y0 = -0.5, y1 = 0, color = "#cfd6c4" }]
zone = { kind = "pad", label = "COMMITTED", color = "#9b5de5", params = { "movement.model" = "committed" }, note = "Turns at 540°/s and only runs the way it faces; jumps keep their take-off speed (no steering, no short hop), and C while running is a dodge roll." }

