# Library Hall (Workshop wing): the asset store's standard objects on plinths, each beside a 1.8 m
# figure and signed with its index row, and three performers on the stage at the back.
# Everything below the GENERATED line is written by `pav assets reindex=hall` from the embedded
# index (the templates and LIB/core): after publishing to core, rebuild and run it again (a test
# fails while the file is stale). Edit the card and the station guide above the line by hand.
name = "Library Hall"
about = "Every standard object of the asset store on a plinth beside a 1.8 m figure, signed with its index row (size, tier, licence, tokens), and Kestrel and Ysolde showing sockets and one clip on two bodies."
try = [
  "Walk the plinths: each sign is the object's row in the index, and the grey figure beside it is 1.8 m tall",
  "At the back, Kestrel sits on the core chair through its sit socket",
  "Ysolde holds the core mage staff by its grip socket, and dances the same clip as the second Kestrel",
  "In the REPL: assets shelf=prop lists the best entries, assets find=chair searches the store",
  "Press H for how the hall is generated from the index",
]
wing = "misc"
order = 1
primary_device = "keyboard_mouse"

[camera]
tilt = 45.0
distance = 22.0
fov = 40.0

# Station guide (H in the game).
[learn]
what = "The asset store's standard tier: every object every build embeds (the templates and LIB/core), each on a plinth beside the 1.8 m figure that contact sheets use, signed with its index row: name, size in centimetres, tier, licence and payload tokens. On the stage at the back, Kestrel sits on the core chair through the chair's sit socket, Ysolde holds the core mage staff by its grip socket, and she and a second Kestrel dance one captured clip at their own proportions."
how = [
  "Each object is readable JSON made of named primitive parts. Its index row (assets/props/lib/core/index.tsv) is generated from the file: size from the compiled bounds, tokens from the file's bytes (about 2.8 bytes a token), tier from where it lives and whether it passed the checks.",
  "This room is generated too: `pav assets reindex=hall` reads the embedded index and writes every plinth, figure, sign and the map below a marker line in the room file, so an object published to LIB/core appears here after a rebuild and a reindex. A test fails while the file is stale.",
  "Sockets are named points with a direction on an object: sit on a seat top, grip on a handle with +y along the blade or shaft. A performer with seat = the chair's object stands where the sit socket puts its first clip's pelvis on the seat, facing the way the seat faces.",
  "A look's weapon can be a library object: weapon.asset draws it at the hand by its grip socket, the socket's +y along the weapon, while the weapon kind still sets the reach and the swings.",
  "A clip stores the hips as a share of hip height and each limb as a direction and a bend, so the same keys fit Kestrel's short, broad body and Ysolde's tall, slim one.",
]
uses = [
  "Asset libraries with metadata: Unity's Asset Store and Unreal's Fab list size, licence and format for every entry; Quixel Megascans adds real-world scale.",
  "Sockets: Unreal's skeletal mesh sockets attach weapons to hands; The Sims and most RPGs use seat slots so characters sit on any chair.",
  "Scale references: level designers keep a human-sized figure in the editor (Unreal's mannequin, Valve's dev textures) to judge props against.",
]
ask = [
  "show every asset in the library at real size",
  "a character sitting on a chair from the library",
  "a character holding a prop by its grip socket",
  "play the same animation on two different bodies",
  "regenerate the asset hall after publishing a prop",
]
cost = "The hall places one entity per object, two per figure and three performers; objects draw as their parts (a few hundred triangles each, generated meshes shared). Generating the room reads the embedded index and compiles each object once."
terms = ["asset store", "socket", "retargeting", "procedural generation"]

[[learn.code]]
title = "A seated performer stands where the seat's sit socket puts its pelvis"
file = "crates/pav_core/src/room.rs"
lang = "rust"
src = '''
let socket = parts.sockets.get("sit").ok_or_else(|| fail(format!("({}) has no sit socket", def.doc.name)))?;
let rot = o.local_rot();
let at = o.pos + rot * (socket.pos * o.scale);
let front = rot * socket.rot * Vec3::Z;
let front = Vec3::new(front.x, 0.0, front.z).normalize_or(Vec3::Z);
// The first clip's pelvis sits this far ahead of the feet (sitting clips: behind them).
let ahead = n
    .clips
    .first()
    .and_then(|name| crate::clips::find(name))
    .and_then(|id| crate::clips::with(id, |clip| clip.key_at(0.0).hips[0]))
    .unwrap_or(0.0);
let hip = crate::clips::hip_height(&n.puppet()?);
let feet = at - front * (ahead / 100.0 * hip);
'''

[[learn.code]]
title = "A held library object: its grip socket at the hand, +y along the weapon"
file = "crates/pav_view/src/build.rs"
lang = "rust"
src = '''
fn held_asset(scene: &mut Scene, name: &str, hand: Vec3, tip: Vec3, id: u32) {
    let Ok(parts) = pav_core::props::resolve_parts(name, 0) else { return };
    let (grip, turn) = parts.sockets.get("grip").map_or((Vec3::ZERO, Quat::IDENTITY), |s| (s.pos, s.rot));
    let rot = Quat::from_rotation_arc((turn * Vec3::Y).normalize_or(Vec3::Y), (tip - hand).normalize_or(Vec3::Y));
    let at = crate::assets::Placement::at(hand - rot * grip).rot(rot).id(id);
    // Names were checked when the look was read; a prop this build lacks is not drawn.
    let _ = crate::assets::emit_asset(scene, name, at, 0, &Default::default());
}
'''

