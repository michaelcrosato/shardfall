#............................#
#............................#
#...............WW...........#
#.B44B..........WW......R77R.#
#............................#
#..............TffT..........#
#............................#
#......R33R.OeeO...B88B......#
#............................#
#..............TddT..........#
#............................#
#.B22B......OccO........R99R.#
#............................#
#..............TbbT..........#
#............................#
#......R11R.OaaO...B00B......#
#............................#
#............................#
#......SSS...QQ.....FFF......#
#......SSS...QQ.....FFF......#
#............................#
#............................#
#.JJJJJ.MMMMM...IIIINNNNGGGG.#
#.JJJJJ.MMMMM...IIIINNNNGGGG.#
##############.###############
'''

