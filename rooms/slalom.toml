# Slalom: weave through numbered gates against the clock, and change how the floor and the
# movement model feel with pads. Two timed courses share the field: a 10-gate SLALOM (up the
# west lane, across the top, back down the east lane) and a short TIGHT course (6 gates 2 m
# apart). Pads sit along the south wall, out of the racing lines, and stay active until you
# leave the room.
name = "Slalom"
about = "A big open field with two timed slalom courses and surface pads. Pass the numbered gates in order (a missed gate adds 2 s), then change the floor (ICE / NORMAL / GRIP) or the movement model (INSTANT / MOMENTUM) on the pads and see how the same course feels."
try = [
  "Run the SLALOM: step on the green START, leave it to start the clock, pass gates 1 to 10 in order, finish on the checkered FINISH",
  "Skip a gate on purpose: it adds 2 s per missed gate to your time",
  "Step on INSTANT, run the course, then MOMENTUM and run it again: INSTANT is a flat 6 m/s with no inertia, MOMENTUM tops out at 7.5 m/s but has to brake and turn",
  "Run the TIGHT course (6 gates, 2 m apart) on GRIP, then on ICE: ice slides wide and is slow to stop",
  "GRIP turns and stops almost instantly, so you can brake late; NORMAL puts the surface back to the default",
  "Surface pads change acceleration, deceleration and braking; model pads change the movement model (INSTANT ignores the surface)",
  "Beat your best time (shown in the course HUD): carry speed through the gates or brake early for each corner",
]
wing = "movement"
order = 3
primary_device = "keyboard_mouse"
movement_model = "momentum"
entrance = { at = [14, 29], facing = "south" }

# Camera defaults while inside (yaw is relative to the room).
[camera]
tilt = 65.0
distance = 22.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "An open field with two timed courses: the SLALOM (10 gates, up the west lane, across the top and back down the east lane) and the TIGHT course (6 gates 2 m apart up the middle). Gates count only in number order. The pads along the south wall change the MOVEMENT MODEL (INSTANT, MOMENTUM) and the SURFACE (ICE, NORMAL, GRIP), so you can feel the same line change."
how = [
  "With the momentum model your velocity is steered toward where the stick points, but each tick it may only change by rate x tick length: accel while you push, decel when you let go, and the harsher skid_decel when you push against your current direction. Those three numbers are the whole difference between ICE and GRIP.",
  "Top speed is max_speed (7.5 m/s). From a standstill NORMAL (45 m/s²) gets there in about 0.17 s, ICE (10 m/s²) needs 0.75 s and GRIP (90 m/s²) under 0.1 s. When you let go, ICE sheds only 3 m/s every second while GRIP sheds 70.",
  "INSTANT skips all of that: velocity is set straight to 6 m/s in the stick's direction, so it ignores the surface pads and corners cost nothing, but its top speed is lower.",
  "Stepping on START arms a course and the clock runs from the tick you leave it. Each gate is a zone with a number: entering one further down the list counts the ones you skipped as missed, going back does nothing, and FINISH adds 2 s for every gate missed or never reached.",
  "Times are counted in simulation ticks (60 a second) times the tick length, so a run takes the same time on any computer and at any frame rate. The course HUD shows the timer, the gates and your best time.",
]
uses = [
  "Buoy and gate courses: pass every marker in order or pay for it (Wave Race 64).",
  "Time trials: one course, a clock and a best time to beat (Mario Kart, Trackmania).",
  "Ice levels: low acceleration and friction turn a familiar layout into a new challenge (Super Mario Bros. 3).",
  "Surfaces: grip changes with the ground under you, from tarmac to ice (Mario Kart).",
]
ask = [
  "momentum movement with separate acceleration, friction and skid braking",
  "slippery ice surface zones",
  "slalom gates that must be passed in order",
  "time penalty for missed gates",
  "time trial with best times and a course HUD",
]
cost = "Nothing you could measure: gates are a lookup of the zones under your feet once per tick, and the momentum model is a few vector operations per character per tick."
knobs = ["movement.model", "movement.max_speed", "movement.accel", "movement.decel", "movement.skid_decel", "movement.speed"]
terms = ["game feel", "fixed timestep", "determinism"]

[[learn.code]]
title = "Momentum: a limit on how fast velocity can change"
file = "crates/pav_core/src/character.rs"
lang = "rust"
src = """
MovementModel::Momentum => {
    let max = mp.max_speed * mult * if held(buttons::FOCUS) { 0.5 } else { 1.0 };
    let target = wish * max;
    let ctrl = if ch.grounded { 1.0 } else { mp.air_control };
    let rate = if wish.length() < 0.05 {
        mp.decel
    } else if vh.dot(wish) < 0.0 {
        mp.skid_decel
    } else {
        mp.accel
    };
    let dv = (target - vh).clamp_length_max(rate * ctrl * dt);
    vh += dv;
}
"""

[[learn.code]]
title = "Gates in order, skipped ones counted"
file = "crates/pav_core/src/course.rs"
lang = "rust"
src = """
if let Some(run) =
    self.state.courses.run.as_mut().filter(|x| x.region == r.region && x.course == z.course && x.started)
{
    if let Some(pos) = run.gates.iter().position(|g| *g == z.index) {
        if pos >= run.next {
            let skipped = (pos - run.next) as u32;
            run.missed += skipped;
            run.passed += 1;
            run.next = pos + 1;
            events.push(SimEvent::Gate { pos: feet, ok: skipped == 0 });
"""

[[learn.code]]
title = "Two seconds for every missed gate"
file = "crates/pav_core/src/course.rs"
lang = "rust"
src = """
pub(crate) fn finish_course(&mut self, pos: Vec3, events: &mut Vec<SimEvent>) {
    let tick = self.state.tick;
    let dt = self.dt();
    let Some(run) = self.state.courses.run.take() else { return };
    let missed = run.missed + (run.gates.len() - run.next.min(run.gates.len())) as u32;
    let raw = (tick - run.start_tick) as f32 * dt;
    let time = raw + missed as f32 * GATE_PENALTY;
"""

[layout]
origin = [-15.0, 0.0, -15.0]

# 30 x 30 field. South = bottom row (entrance gap at column 14, on the south wall).
#
#   SLALOM (course "slalom"): 10 gates in a zig-zag, red / blue pillars alternating.
#     START 'S' (cols 7-9, rows 23-24) -> west lane north: gates 1-5 (rows 20, 16, 12, 8, 4)
#     -> across the top -> east lane south: gates 6-10 (rows 4, 8, 12, 16, 20) -> FINISH 'F'.
#     Gate zone chars are '1'..'9' and '0' (= gate 10). Each gate is 2 cells wide; the zones of
#     consecutive gates are separated by 3 empty columns so a straight line cannot hit them all.
#   TIGHT (course "tight"): 6 gates 2 m apart in the middle, orange / teal pillars.
#     START 'Q' -> gates 'a'..'f' (rows 20, 18, 16, 14, 12, 10) -> FINISH 'W'.
#     Gate zones are 2 cells wide, 1 column apart (the pillars between them form a pole line).
#   Pads along the south wall, out of the racing lines (corridor at the entrance stays free):
#     'J' INSTANT, 'M' MOMENTUM (west) | 'I' ICE, 'N' NORMAL, 'G' GRIP (east).
#   Pillars: 'R' red, 'B' blue (slalom), 'O' orange, 'T' teal (tight).
[[layout.layer]]
y = 0
map = '''
##############################
#............................#
#............................#
#............................#
