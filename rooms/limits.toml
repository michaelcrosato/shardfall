# Limits (Workshop wing): what the asset store's checks catch, and what they do not. Each
# exhibit is signed with its number and the check that catches it, or "not caught";
# crates/pav_tools/tests/store_rooms.rs runs `check` on every exhibit and measures the clips, so
# a sign that stops being true fails the build.
#   BACK   five object exhibits on dark squares: a 48 cm chair placed at scale 0.5, the same
#          chair copied at half size, a barrel and a table sunk 76 cm, a missing material
#   MIDDLE two clip exhibits: a walk that strays 546 mm from its capture, a two-hand clip on a
#          standard and a short body
#   FRONT  the limits only imports show (counted from the committed indexes)
name = "Limits"
about = "What the asset store's checks catch and what they miss: a doll-sized chair, objects sunk into the floor, a missing material, a captured walk that strays from its capture and a two-hand clip on a short body, each signed with the check that catches it or 'not caught'."
try = [
  "Read each sign: its number, then the check that catches the defect, or 'not caught'",
  "Compare 1 and 2: the same 48 cm chair, but only the copy whose file says 48 cm is caught",
  "Compare 3 and 4: both sunk 76 cm, but the table's top still reaches the floor, so check reads it as hanging",
  "Watch 7: the same clip brings the hands together on the standard body and leaves them apart on the short one",
  "In the REPL: asset_edit action=check name=LIB/core/chair runs the checks on an object",
]
wing = "misc"
order = 2
primary_device = "keyboard_mouse"
entrance = { at = [14, 21], facing = "south" }

[camera]
tilt = 45.0
distance = 18.0
fov = 40.0

# Station guide (H in the game).
[learn]
what = "Seven defects and one sign. At the back, five objects: a core chair placed at scale 0.5, the same chair copied at half size, a barrel and a table each sunk 76 cm into the floor, and a barrel whose staves name a material the library lacks (it draws magenta). In the middle, two clips: 100STYLE's WildLegs_Walk, whose worst point strays 546 mm from its capture, and a two-handed pistol idle on a standard and a short body. At the front, the limits only imported objects show. Every sign names the check that catches its exhibit, or says it is not caught."
how = [
  "asset_edit action=check lints an object's file: parts below the floor (below_floor), a size outside its kind's real-world band (size_band, from store/size_bands.tsv), a missing socket (socket_missing), a material the library lacks (unknown_material), floating, hidden and z-fighting parts.",
  "Checks run on assets, not on where a room puts them: exhibit 1 is the core chair placed at scale 0.5, which no check sees; exhibit 2 is a copy whose own parts are scaled to 48 cm (a room object's patch, the ops asset_edit takes), and size_band catches it.",
  "Below the floor has an exception: an object whose top ends at its origin hangs from it (a lantern on a hook). The table sunk 76 cm keeps its top 2 cm above the floor, inside that tolerance, so check reads it as hanging and stays quiet; the barrel's top is 15 cm up, so it is caught.",
  "A material the library lacks draws magenta, so it shows at a glance, and check names the part and the nearest real material.",
  "Clips are fitted to their capture with as few key poses as stay close; clips name= reports the mean and worst error in millimetres, but no check refuses a clip. Clips store limb directions, not contacts, so hands that meet on one body can miss on another with shorter arms or wider shoulders.",
]
uses = [
  "Asset validation in production pipelines: Unreal's Data Validation and Unity's asset postprocessors reject wrong scale, missing materials and bad pivots on import.",
  "Scale checks against a reference figure: Bethesda and Valve keep human-sized figures in their editors because a model's units say nothing about its intended size.",
  "Retargeting fixes: Unreal's IK Retargeter and Unity's Animation Rigging pin hands to a two-handed weapon so they meet on any body.",
]
ask = [
  "check this object for problems before I place it",
  "why is my prop magenta",
  "make the hands meet on a two-handed weapon for every body",
  "what do the asset checks not catch",
]
cost = "Free at runtime: the exhibits are ordinary placed objects and performers. check compiles an object once and measures its parts' boxes; a room object's patch is applied once, when the room is built."
terms = ["lint", "asset store", "retargeting", "motion capture"]

[[learn.code]]
title = "Below the floor, unless the object hangs from its origin"
file = "crates/pav_core/src/props/lint.rs"
lang = "rust"
src = '''
let hangs = hi.y.abs() <= 0.02 && lo.y < -JOIN;
let below: Vec<&str> = solids.iter().filter(|s| s.min.y < -JOIN).map(|s| s.name).collect();
if hangs || mounted.is_some() {
} else if !below.is_empty() {
    let fact = format!("{} reach{} y={} cm", names(&below, 4), if below.len() == 1 { "es" } else { "" }, cm(lo.y));
    push("below_floor", below.clone(), fact);
} else if lo.y > JOIN {
    push("not_grounded", vec![], format!("the lowest part is at y={} cm", cm(lo.y)));
}
'''

[[learn.code]]
title = "A room object's patch: a one-off variant of an embedded object"
file = "crates/pav_core/src/props/family.rs"
lang = "rust"
src = '''
pub fn patched(def: &Arc<PropDef>, ops: &[Value]) -> Result<Arc<PropDef>, String> {
    if ops.is_empty() {
        return Ok(def.clone());
    }
    let ops = Value::Array(ops.to_vec());
    let doc = super::patch_document(&def.doc, &ops, &super::get).map_err(|issues| issue::render(&issues))?.doc;
    PropDef::new(doc).map(Arc::new).map_err(|issues| issue::render(&issues))
}
'''

