# Style vs Filters: one colourful diorama in the middle, a ring of pads around it. Every filter pad turns on
# `view.filter.split = 0.5` plus ONLY its own filter (the others are reset to neutral, so pads never
# stack): the LEFT half of the screen stays the pure style, the RIGHT half is filtered, and a white
# divider line marks the seam. The camera glides round the ring (each pad has a yaw cue that makes the
# camera look at the diorama), so the diorama always sits across the divider.
#   CENTRE  diorama: house, striped tower, trees, pond, a checker plaza, a spinning carousel, a rainbow row
#           and a grey ramp (banding / dither / palette), two lamps and a lit window, two walking NPCs
#   RING    PURE, SCANLINES, CRT CURVE, DITHER, PICO-8, PIXELATE, WARM GRADE, COOL GRADE, NOIR, VHS, FULL SCREEN
name = "Style vs Filters"
about = "A screen filter is a post-process on the finished picture; a style is how surfaces are shaded. A colourful diorama sits in the middle and every pad on the ring splits the screen: pure style on the left, one filter on the right."
try = [
  "Step on SCANLINES, then CRT CURVE: the left half stays clean, the right half gets the tube look",
  "DITHER (4 colour levels) and PICO-8 (pixelate 3 + 16-colour palette): watch the rainbow row and the grey ramp band and dither",
  "PIXELATE: look at the carousel, the tower stripes and the walkers on the right half",
  "WARM GRADE vs COOL GRADE: the same scene, two moods; the lamps keep their glow",
  "NOIR (no colour, contrast, grain, vignette; saturation is a whole-screen view setting, so both halves go grey) and VHS (colour fringes, grain, scanlines, tint)",
  "FULL SCREEN puts the last filter over the whole picture (no divider); PURE resets everything",
  "Walk into the diorama: follow the NPCs, run round the carousel and watch the filter on moving things",
  "Step on any pad: filters never stack, each pad sets all of them",
]
wing = "aesthetic"
order = 2
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [14, 26], facing = "south" }

[camera]
tilt = 55.0
distance = 32.0
yaw = 0.0
height_offset = 3.0

# Soft late-afternoon light so the colours read; the lamps and the window glow a little.
[view]
"light.sun_elevation" = 36
"light.sun_intensity" = 0.55
"light.ambient" = 0.95
sky = "#7f98c8"
bloom = 0.35

