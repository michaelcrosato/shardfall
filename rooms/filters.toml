# Style vs Filters: one colourful diorama in the middle, a ring of pads around it. Every filter pad turns on
# `view.filter.split = 0.5` plus ONLY its own filter (the others are reset to neutral, so pads never
# stack): the LEFT half of the screen stays the pure style, the RIGHT half is filtered, and a white
# divider line marks the seam. The camera glides round the ring (each pad has a yaw cue that makes the
# camera look at the diorama), so the diorama always sits across the divider.
#   CENTRE  diorama: house, striped tower, trees, pond, a checker plaza, a spinning carousel, a rainbow row
#           and a grey ramp (banding / dither / palette), two lamps and a lit window, two walking NPCs
#   RING    PURE, SCANLINES, CRT CURVE, DITHER, PICO-8, PIXELATE, WARM GRADE, COOL GRADE, NOIR, VHS, FULL SCREEN
name = "Style vs Filters"
about = "A screen filter is a post-process on the finished picture; a style is how surfaces are shaded. A colourful diorama sits in the middle and every pad on the ring splits the screen: pure style on the left, one filter on the right."
try = [
  "Step on SCANLINES, then CRT CURVE: the left half stays clean, the right half gets the tube look",
  "DITHER (4 colour levels) and PICO-8 (pixelate 3 + 16-colour palette): watch the rainbow row and the grey ramp band and dither",
  "PIXELATE: look at the carousel, the tower stripes and the walkers on the right half",
  "WARM GRADE vs COOL GRADE: the same scene, two moods; the lamps keep their glow",
  "NOIR (no colour, contrast, grain, vignette; the filtered side loses its colour while the left half keeps it) and VHS (colour fringes, grain, scanlines, tint)",
  "FULL SCREEN puts the last filter over the whole picture (no divider); PURE resets everything",
  "Walk into the diorama: follow the NPCs, run round the carousel and watch the filter on moving things",
  "Step on any pad: filters never stack, each pad sets all of them",
]
wing = "aesthetic"
order = 2
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [14, 26], facing = "south" }

[camera]
tilt = 55.0
distance = 32.0
yaw = 0.0
height_offset = 3.0

# Soft late-afternoon light so the colours read; the lamps and the window glow a little.
[view]
"light.sun_elevation" = 36
"light.sun_intensity" = 0.55
"light.ambient" = 0.95
sky = "#7f98c8"
bloom = 0.35

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "A colourful DIORAMA (house, striped tower, carousel, pond, a rainbow row, a grey ramp and two walkers) inside a ring of pads. Each pad splits the screen at the white line: the left half is the plain picture, the right half has one filter, and the camera swings round so the diorama sits across the line. A style decides how surfaces take light; a filter only changes the finished picture."
how = [
  "A filter is a post-process: the scene is drawn completely first (shading, shadows, bloom), then one full-screen pass, the composite, reads that picture and changes each pixel on its way to the screen.",
  "The split is a test per pixel: left of view.filter.split x the screen width the composite skips the whole filter stack, and a 3-pixel white line marks the seam.",
  "Some filters change where a pixel reads from: CRT curvature bends the lookup outward like the glass of a tube (black beyond it), and pixelate makes every pixel of a block read the block's centre.",
  "Then the colour changes, always in the same order: grading (temperature raises red and lowers blue, contrast stretches around mid grey, saturation mixes towards grey), scanlines (a cosine stripe every 3 px), vignette, grain.",
  "Last comes colour reduction: each channel is rounded to a few levels, or snapped to the nearest colour of a fixed palette such as PICO-8's 16. A 4 x 4 Bayer pattern nudges the rounding, so gradients become fine dot patterns (dithering) instead of hard bands.",
]
uses = [
  "Black and white film: Ghost of Tsushima's Kurosawa Mode turns the whole game into grainy black and white.",
  "VHS and arcade: colour fringes, grain and scanlines for a worn-tape or cabinet feel (Katana Zero leans on VHS effects).",
  "Mood grading: cold blue for night and horror, warm amber for memories; nearly every modern game grades its final image.",
  "Fantasy consoles: PICO-8 games live inside its fixed 16-colour palette, the same one the PICO-8 pad snaps to.",
]
ask = [
  "split-screen before/after for a post-process filter",
  "CRT curvature with scanlines and a vignette",
  "warm and cool colour grade presets",
  "noir filter with grain and vignette",
  "VHS look with chromatic aberration",
  "PICO-8 palette with ordered dithering",
]
cost = "All of these run inside the one composite pass the frame already has, so each filter adds only a few arithmetic steps per pixel. The 16-colour palette search is the dearest (16 comparisons per pixel), and none of it depends on how many objects are in the scene."
knobs = ["view.filter.split", "view.filter.scanlines", "view.filter.curvature", "view.filter.pixelate", "view.filter.temperature", "view.filter.palette"]
terms = ["post-process", "scanlines", "crt", "dithering", "palette", "color grading", "vignette", "film grain"]

[[learn.code]]
title = "Left of the split stays pure; curve and pixelate the rest"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = """
let split = post.filt1.w;
let filtered = split <= 0.0 || frag.x >= split * fd.x;
var s: vec3<f32>;
if (!filtered) {
    s = to_srgb(scene_color(frag.xy, dims, 0.0));
} else {
    var uvn = frag.xy / fd;
    // CRT: barrel curvature, black outside the tube.
    let curv = post.filt0.y;
    if (curv > 0.0) {
        var c = uvn * 2.0 - 1.0;
        c = c * (1.0 + curv * c.yx * c.yx);
        uvn = c * 0.5 + 0.5;
        if (uvn.x < 0.0 || uvn.y < 0.0 || uvn.x > 1.0 || uvn.y > 1.0) {
            return vec4<f32>(0.0, 0.0, 0.0, 1.0);
        }
    }
    var p = uvn * fd;
    // Pixelation: everything is looked up at the centre of its block.
    var block = max(post.filt0.x, 1.0);
    // ...
    if (block > 1.0) {
        p = (floor(p / block) + 0.5) * block;
    }
"""

[[learn.code]]
title = "Scanlines, vignette and grain"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = """
// Scanlines follow the curved tube.
if (post.filt0.z > 0.0 && aimed(post.filt5.w, obj)) {
    let period = max(post.filt0.w, 1.0);
    let w = 0.5 - 0.5 * cos(uvn.y * fd.y / period * 6.2831853);
    s = s * (1.0 - post.filt0.z * 0.6 * w);
}
// Vignette and film grain.
if (post.filt3.x > 0.0) {
    let r = length(frag.xy / fd - 0.5) * 1.414;
    s = s * (1.0 - post.filt3.x * smoothstep(0.35, 1.05, r));
}
if (post.filt3.y > 0.0 && aimed(post.filt6.x, obj)) {
    let h = fract(sin(dot(frag.xy + vec2<f32>(post.filt3.w * 61.0, post.filt3.w * 17.0), vec2<f32>(12.9898, 78.233))) * 43758.5453);
    s = s + (h - 0.5) * post.filt3.y * 0.16;
}
"""

[[learn.code]]
title = "The nearest palette colour"
file = "crates/pav_render/src/shaders/post.wgsl"
lang = "wgsl"
src = """
let c = clamp(c0 + (th - 0.5) * 0.18, vec3<f32>(0.0), vec3<f32>(1.0));
// ...
for (var i = 0u; i < n; i++) {
    var q: vec3<f32>;
    // ...
    var d: f32;
    if (pal == 1u || pal == 4u || pal == 5u) {
        // Monochrome palettes: match by brightness.
        let l = dot(c, vec3<f32>(0.299, 0.587, 0.114));
        let lq = dot(q, vec3<f32>(0.299, 0.587, 0.114));
        d = abs(l - lq);
    } else {
        let e = c - q;
        d = dot(e, e * vec3<f32>(0.3, 0.59, 0.11));
    }
    if (d < bd) {
        bd = d;
        best = q;
    }
}
return best;
"""

