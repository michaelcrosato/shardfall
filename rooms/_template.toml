# ROOM TEMPLATE (files starting with "_" are ignored). Copy to rooms/<key>.toml.
# A room is placed automatically along its wing's corridor and rotated so its entrance
# faces the corridor. Coordinates: column = x (east), row = z (south), 1 cell = 1 m.

name = "My Room"
about = "One sentence: what this room demonstrates."
try = ["Something to try", "Something else"]
wing = "misc"                 # movement | physics | animation | vfx | aesthetic | genre | misc
order = 10                    # position within the wing
primary_device = "keyboard_mouse"   # or "gamepad"
# movement_model = "momentum" # instant | momentum | grid | committed (applied while inside)
# overlays = ["feel"]         # HUD overlays opened while inside: "feel" metrics, "physics" stats
entrance = { at = [5, 9], facing = "south" }   # a gap cell in the outer wall, and the way out

# Optional: camera defaults while inside (camera parameter names).
[camera]
# tilt = 70.0
# ortho = false

# Optional: view settings while inside (`pav params prefix=view`, without "view."), e.g. night:
# "light.sun_intensity" = 0.06, "light.ambient" = 0.25, sky = "#0e1424", bloom = 0.6, gi = 1.0,
# "light.sun_elevation" = 20, distortion = true, particles = true, exposure = 1.2
[view]

# Optional: simulation parameter overrides while inside (full paths, see `pav params`).
[params]
# "movement.jump_height" = 2.0
# "movement.ledge_grab" = true     # off by default: a jump reaches ledges up to ~3.4 m, so keep
#                                   # walls you must not climb at 4 m or more in such rooms
# "movement.lock_axis" = "z"       # side-view rooms (axis in the room's own frame)

# Optional: keyboard remapping while inside (action = [physical key names]).
[keys]
# jump = ["KeyW", "Space"]
# move_up = ["ArrowUp"]

[layout]
# origin is only used when the room is loaded on its own (`pav load scene=<key>`).
origin = [-5.0, 0.0, -5.0]

[[layout.layer]]
y = 0                         # more layers = more floors (add at = [col, row] to offset one)
map = '''
###########
#.........#
#....B....#
#.........#
#.........#
#.........#
#.........#
#.........#
#.........#
#####..####
'''

# Each map character: blocks (y0/y1 relative to the layer), ladder, prop or marker.
[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c8c8c8" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c8c8c8" }, { y0 = 0, y1 = 2.0, color = "#9aa5b1" }]

[layout.legend.'B']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c8c8c8" }, { y0 = 0, y1 = 1.0, color = "#c9a27a", rounded = true }]
# Other options: destructible = true, ghost = true (no collision), inset = 0.3 (thinner),
# crumble = 0.8 (falls 0.8 s after being stepped on), regrow = 4 (comes back after 4 s),
# strength = 40 (breaks when hit with more than this contact force, e.g. glass),
# look = "flat" | "cel" | "lit" | "unlit",
# ladder = { facing = "north", height = 3.0 },
# prop = { shape = { type = "box", half = [0.35, 0.35, 0.35] }, color = "#e8704a" },
# marker = "player"
# label = { text = "HELLO", size = 0.5, color = "#2b2d35", mode = "floor" }   (text on the tile)
#
# zone = { kind = "...", ... } makes the tile a trigger (identical neighbours merge):
#   kind = "start" | "finish" | "gate" | "checkpoint" | "kill" | "water" | "pad" | "camera" |
#          "conveyor" (facing = direction, speed = m/s; carries characters and props) |
#          "bounce" (speed = launch m/s; trampolines for characters and props)
#   course = "name"   start/finish/gates of one course share it; leaving START starts the timer,
#                     gates must be passed in `index` order (missed gate = +2 s), FINISH stops it
#   index = 1         gate order
#   y0 = 0, y1 = 3    height range relative to the layer (kill zones in pits: e.g. y0 = -3, y1 = -1)
#   label = "TEXT"    drawn on the floor (label_size = 0.5 to override the auto fit);
#                     color = "#rrggbb" or "none"; facing = "east" (respawn direction)
#   Zones are half-open boxes, so touching zones never overlap. A respawn point that lies in a
#   zone does not trigger it (respawning onto START keeps the timer running).
#   params = { "movement.model" = "momentum" }       pads: parameter changes until you leave
#                     ("view.bloom" = 1.5 etc. change view settings the same way)
#   signal = "drop"   pads: tells spawners listening for "drop" to fire
#   camera = { set = { tilt = 90, ortho = true }, sweep = [{ param = "tilt", from = 90,
#              to = 10, period = 12 }], flip_ortho = 6 }  pads (sticky) / camera zones (inside)
#   water: swim below y1. kill: back to the last checkpoint.

# Free text anywhere (layout space: x = column, y = height, z = row).
# [[label]]
# text = "SIGN"
# pos = [5.0, 0.03, 3.0]
# size = 0.6
# mode = "floor"            # floor (turns to the camera) | wall (faces `facing`) | billboard
# facing = "south"

# Free-placed objects (keep them at the end of the file; edit mode rewrites this part).
[[object]]
name = "ball"
shape = { type = "sphere", radius = 0.4 }
pos = [3.5, 1.0, 3.5]           # x = column, y = height, z = row
color = "#5b8def"
body = "dynamic"                # dynamic | fixed | kinematic | none

# Animated objects use body = "kinematic" and a behavior (vectors are in the object's own frame):
#   behavior = { type = "move", offset = [0, 0, 4], period = 4, phase = 0, hold = 0.3, smooth = true }
#     (hold = share of the cycle spent waiting, split between both ends)
#   behavior = { type = "rotate", axis = [0, 1, 0], speed = 90 }                   (deg/s)
#   behavior = { type = "rotate", axis = [1, 0, 0], swing = 60, period = 2, pivot = [0, 2, 0] }
#   behavior = { type = "spin", speed = 1.5 }                                       (rad/s)
# Projectile emitters (body = "none", or "fixed" with a slim shape; bullets ignore their emitter):
#   behavior = { type = "emitter", pattern = "aimed", interval = 1.0, count = 1, spread = 0,
#                speed = 6, radius = 0.15, height = 0, range = 30, delay = 0, burst = 0, pause = 1,
#                color = "#ff5a3c", knockback = 6, gravity = 0, spin = 12, life = 6 }
#     pattern: aimed (at the player) | forward (+Z of the object, see yaw) | ring | spiral | random
# Touching a hazard knocks you back (respawn = true sends you to the last checkpoint):
#   hazard = { knockback = 7, respawn = false }
# Spawners drop props on a timer and/or when a pad sends their signal (body = "none"):
#   behavior = { type = "spawner", shape = { type = "box", half = [0.3, 0.3, 0.3] }, color = "",
#                count = 20, interval = 0, max = 200, area = [1.5, 0.5, 1.5], signal = "drop",
#                clear = "clear", density = 1, friction = 0.5, restitution = 0.1, tumble = true }
#     (pending = 1 drops one batch on the first tick, so the room starts with its props)
# More object fields: pitch = 20, roll = 0 (tilt in degrees, e.g. ramps), density = 1 (kg/m³:
# 1 is very light; 50-100 = pushable crates; 400 = wood; 2000 = stone), friction = 0.5,
# restitution = 0.0 (bounciness 0..1; rapier averages it with the surface underneath),
# damping = 0 (air drag). Pushing shares momentum: a 70 kg character barely moves 300 kg.
# Visual-only effects on any object (never affect the simulation; body = "none" for invisible
# emitters with a tiny sphere shape):
#   light = { color = "#ffb060", radius = 7, intensity = 2.5, flicker = 0.8, pulse = 0,
#             shadows = true, offset = [0, 0.7, 0] }   (the 4 shadow-casting lights nearest you)
#   particles = { preset = "fire", rate = 0, color = "", size = 1, speed = 1, life = 1,
#                 area = [0, 0, 0], offset = [0, 0.5, 0] }
#     presets: fire smoke sparks embers fountain snow rain fireflies magic steam dust bubbles
#     confetti (rate 0 = the preset's; area = spawn box half-size; snow/rain: put it up high)
#   distortion = { kind = "haze", radius = 1.5, strength = 0.15, period = 1.5, offset = [0, 1, 0] }
#     kinds: haze (heat shimmer) | lens (magnify; negative strength shrinks) | ripple | ring
#     (a shockwave every `period` s). Bombs make shockwaves, sparks and smoke by themselves.
#   emissive = 2..8 makes an object glow (bloom) and light its surroundings.
# Soft (deformable) objects ignore `shape`:
#   soft = { shape = { type = "cuboid", half = [0.6, 0.6, 0.6], res = [4, 4, 4] }, stiffness = 6 }
#   soft = { shape = { type = "sphere", radius = 0.6, subdivisions = 2 }, stiffness = 10 }
#   soft = { shape = { type = "cloth", size = [2, 1.5], res = [10, 8], vertical = true },
#            pin = "top", stiffness = 20 }          (vertical = hangs down from pos, else flat +Z)
#   soft = { shape = { type = "rope", to = [0, -3, 0], segments = 16, radius = 0.05 },
#            pin = "start", attach = "ball" }        (rope end tied to the object named "ball")
#   also: damping = 0.3, mass = 4 (kg), tear = 0.6 (breaks when stretched 60%),
#         pin = "" | "top" | "start" | "end" | "ends" | "corners" | "top_corners" | "edge"

# Joints between named objects (b = "" fixes `a` to the world); `at` = anchor, layout space:
# [[joint]]
# a = "door"
# b = ""
# at = [3.0, 1.0, 2.0]
# joint = { type = "hinge", axis = [0, 1, 0], limits = [-90, 90] }
#   joint types: fixed | ball | hinge (axis, limits deg, motor_speed deg/s, motor_force, or
#   spring + damping to swing back: self-closing doors) | slider (axis, limits m, spring, damping)
#   | rope (length) | spring (length, stiffness, damping)
#   Joints to the world measure the object: a vertical slider's limits = [-1, 0.25] travel 1 m
#   down and 0.25 m up. at_b = [x, y, z] puts b's (or the world's) anchor elsewhere, e.g. a
#   spring that starts stretched. Keep chain/joint parts a few cm clear of fixed colliders.

# Generated chains and rope bridges (layout space; density defaults to 400):
# [[chain]]
# from = [3.0, 4.0, 2.0]
# to = [3.0, 1.0, 2.0]
# links = 8
# radius = 0.07
# attach_to = "ball"          # tie the end to an object (fix_to = true pins it to the world)
# [[chain]]
# style = "bridge"            # planks hinged edge to edge, both ends fixed
# from = [2.0, 0.0, 8.5]
# to = [14.0, 0.0, 8.5]
# links = 12
# width = 1.4
# sag = 0.04                  # hangs 4% of the span lower in the middle
# damping = 0.3               # air drag on the links (default 0.3); fewer, longer planks are calmer

# Characters and creatures (layout space). kind = biped | spider | lizard | beetle | blob;
# ai = idle | wander (radius, pause = [min, max]) | patrol (points = [[x, z], ...], pause) |
#      circle (radius, clockwise) | follow (distance: follows the player)
# speed = 0.5 (fraction of full speed), hop = 0 (seconds between jumps), yaw = facing degrees.
# look = any puppet setting over the kind's preset: colours (skin, shirt, pants, shoes, eyes,
# accent), proportions (scale, leg_length, torso_radius, head_radius, body_length, legs,
# tail_length, antenna_length), animation (stride, step_height, step_time, squash, lean, wobble,
# anim_fps = 12 for "on twos") and look = "cel" | "flat" | "lit" | "cutout".
# [[npc]]
# name = "spidey"
# kind = "spider"
# pos = [6.5, 0, 4.5]
# ai = { type = "wander", radius = 3 }
# look = { accent = "#3bb273", leg_length = 1.0 }
