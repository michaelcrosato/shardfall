# Motion Library (animation wing): clips translated from open animation libraries, played on puppets.
# GENERATED by a script kept outside the repo; hand-edits are fine.
#   BACK   stages: DANCE, FIGHT, SWORD, EVERYDAY
#   FRONT  stages: ACROBATICS, FALLS, MONSTERS; TEMPO and MIRROR pads (anim.tempo, anim.mirror)
name = "Motion Library"
about = "Motion capture and hand-keyed animation from open libraries, translated into readable key poses and played at the puppet's own proportions: dances, fights, a sword combo, everyday work, acrobatics, falls and monsters."
try = [
  "Watch each stage: every performer runs through clips of one kind, then starts again",
  "Step on SLOW to see how one key pose flows into the next",
  "Step on MIRROR: the same clips, left for right",
  "Press H for how retargeting works and the code that does it",
  "In the REPL: clips find=dance lists clips, animsheet clip=CMU/Cartwheel draws one frame by frame",
]
wing = "animation"
order = 7
primary_device = "keyboard_mouse"
entrance = { at = [16, 25], facing = "south" }

[camera]
tilt = 40.0
distance = 20.0
fov = 40.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "Seven performers play motion captured or keyed for other games: dances, fights, a sword combo, work and rest, acrobatics, falls and getting up, and monsters. Every clip comes from an open library (Quaternius' Universal Animation Libraries, Mesh2Motion and the CMU motion capture database), translated into this engine's readable key poses by the clip_import tool, and the puppet plays it at its own proportions."
how = [
  "A clip is a short list of key poses. Each names what an animator would: hip height in percent of standing, how the body, chest and head turn and lean, which way each arm and leg points and how much the elbow or knee bends, how the feet point.",
  "Nothing in a key depends on body size, so retargeting is simple: each limb takes the clip's direction at the puppet's own length, and the elbows and knees are solved by the same two-bone IK the walk uses (the clip's twist says which way they bend).",
  "Between keys every number is in-betweened in a straight line; loops wrap and one-shots hold their last pose. A pose that would go through the floor is lifted until its lowest point stands on it.",
  "A clip fades in over the procedural animation in a quarter of a second, the one before held underneath until it has. A clip can also drive only the upper body while the legs keep walking, or play mirrored.",
  "Animation state stores only the clip's id and time, so rewind and replays play it exactly; the view decodes the pose every frame.",
  "clip_import translated 325 clips (6,469 key poses) from the three libraries. Each set file carries its credits and licence, the legend, and how closely every clip follows its capture: about 15 mm on average.",
]
uses = [
  "Animation libraries shared across games: Mixamo, the Unity Asset Store and Unreal Marketplace packs, Quaternius' free libraries.",
  "Retargeting one animation set onto many bodies: Unreal's IK Retargeter, Unity's Humanoid rig, Blender's Rokoko and Auto-Rig Pro.",
  "Motion capture for dances, emotes and cutscenes (Fortnite's emotes, sports games, The Last of Us).",
  "Motion matching picks captured clips frame by frame for movement (For Honor, The Last of Us Part II, Hitman).",
]
ask = [
  "translate an open animation library into the engine",
  "play a captured dance on an NPC",
  "retarget motion capture onto my character",
  "a captured death animation for the hero",
  "townsfolk that idle with captured animation",
]
cost = "Decoding a key pose is a few dozen trig operations and four IK solves per character per frame, on the CPU; nothing changes on the GPU. The three embedded sets add 2.2 MB of readable text to the build; the full CMU database (2,548 takes) stays on disk and loads when a tool asks for it."
knobs = ["anim.tempo", "anim.mirror"]
terms = ["motion capture", "retargeting", "key pose", "ik", "interpolation", "determinism"]

[[learn.code]]
title = "Retargeting one arm: the clip's direction at the puppet's own reach"
file = "crates/pav_core/src/clips.rs"
lang = "rust"
src = '''
let a = if i == 0 { k.arm_l } else { k.arm_r };
let d = dir(a, s);
let target = sh + qc * d * reach_of(a[3], a1, a2);
let ad = (target - sh).normalize_or(Vec3::NEG_Y);
let (elbow, hand) = crate::puppet::ik(sh, target, a1, a2, pole(ad, hint_for(Limb::Arm, s, qc, d), a[4]));
sk.shoulder[i] = sh;
sk.elbow[i] = elbow;
sk.hand[i] = hand;
'''

[[learn.code]]
title = "In-betweening: the pose between two key poses"
file = "crates/pav_core/src/clips.rs"
lang = "rust"
src = '''
pub fn key_at(&self, t: f32) -> Key {
    let k = &self.keys;
    let dur = if self.dur > 0.0 { self.dur } else { k.last().map_or(0.0, |k| k.t) };
    let tt = if self.looping && dur > 0.0 { t.rem_euclid(dur) } else { t.clamp(0.0, dur) };
    let mut i = 0;
    while i + 2 < k.len() && k[i + 1].t <= tt {
        i += 1;
    }
    let (a, b) = (&k[i], &k[(i + 1).min(k.len() - 1)]);
    let u = if b.t > a.t { ((tt - a.t) / (b.t - a.t)).clamp(0.0, 1.0) } else { 0.0 };
    lerp_key(a, b, u)
}
'''

