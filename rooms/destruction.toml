# ---- glass floor over a shallow pit (no kill zone) ---------------------------------------------
# strength = contact force (N) that breaks a tile. A character is not a physics body and never
# loads a tile, so no value breaks under the player. Props do: a resting prop breaks a tile when
# its mass x 9.81 exceeds the strength (40 = any 5 kg crate, 4000 = only 400 kg and more).
# Measured with the 205 kg weights from about 5 m: they break glass up to strength ~100000 and
# bounce off at 300000. 4000 punches clean holes every time (about 12-20 tiles per drop of four,
# the sides of falling boxes break neighbours); 20000 breaks ~8 but some weights then stay on top.
[layout.legend.'g']
blocks = [{ y0 = -0.3, y1 = 0, color = "#a8d8ea", strength = 4000, regrow = 8 }, { y0 = -3, y1 = -2.5, color = "#7d8793" }]

# Pit floor without glass, and the stairs out of the pit (steps of 0.5 m, tops at -2, -1.5, -1, -0.5).
[layout.legend.'q']
blocks = [{ y0 = -3, y1 = -2.5, color = "#7d8793" }]
[layout.legend.'1']
blocks = [{ y0 = -3, y1 = -2.0, color = "#c99f74" }]
[layout.legend.'2']
blocks = [{ y0 = -3, y1 = -1.5, color = "#c99f74" }]
[layout.legend.'3']
blocks = [{ y0 = -3, y1 = -1.0, color = "#c99f74" }]
[layout.legend.'4']
blocks = [{ y0 = -3, y1 = -0.5, color = "#c99f74" }]

# Pads: DROP WEIGHTS fires the "weights" spawner above the glass, CLEAR removes the weights.
[layout.legend.'D']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "DROP WEIGHTS", color = "#3bb273", signal = "weights", note = "Four 205 kg blocks fall from about 6 m. At rest each presses only about 2000 N, but landing spikes far past the glass strength of 4000 N, so they punch through." }

[layout.legend.'C']
