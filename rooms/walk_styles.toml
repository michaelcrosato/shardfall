# Walk Styles (animation wing): sixteen walkers, one performer's styles of walk, captured by 100STYLE
# and translated by the importer (mocap, clip_import). Each walker paces a lane and plays its walk loop
# in place as fast as it moves (walk_clip). GENERATED by a script kept outside the repo; hand-edits are fine.
#   WEST   lanes: NEUTRAL .. OLD          EAST   lanes: MONK .. DRUNK
name = "Walk Styles"
about = "Sixteen ways to walk, captured from one performer by the 100STYLE dataset and translated into readable key poses by the engine's own importer: proud, old, zombie, penguin and more. Each walker plays its loop as fast as it moves, so its feet keep to the ground."
try = [
  "Walk down a lane beside a walker: its stride matches the ground it covers",
  "Compare OLD and ELATED: the same performer, a seventh of the speed",
  "Watch a walker turn at the end of its lane: the procedural walk turns it, the captured walk takes over again",
  "Press H for how a capture becomes a looping walk",
  "In the REPL: mocap find=pockets lib=100style lists styles, mocap cut=Zombie_FW loop=true set=MINE cuts one",
]
wing = "animation"
order = 9
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [17, 28], facing = "south" }

[camera]
tilt = 44.0
distance = 22.0
fov = 40.0

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "Sixteen walkers, one performer: the 100STYLE dataset captured a single person walking, running, sidestepping and standing in a hundred styles. The mocap tool fetched each style's forward walk out of the dataset's 1.5 GB archive (only that file's bytes), cut its best stride and translated it into readable key poses: 98 styles in one set, STYLE100. Each walker paces its lane with walk_clip set to one of them."
how = [
  "A BVH take is a skeleton (joints, offsets, rotation channels), then every frame's joint angles. The reader runs forward kinematics and a bone map places the importer's 36 body points (hips, spine, head, shoulders, elbows, fists, knees, ankles, toes) on the dataset's joints.",
  "The dataset marks the frames where each take performs its style. Inside them the importer finds the longest straight run (every hip position within 12 cm of a line), then the best cycle in it: a stride whose end matches its start in pose and in speed, at least 0.8 s, so a loop never leads with the same foot twice.",
  "The cycle plays in place, facing the way it walked, and closes exactly: what its last frame still differs from its first is spread over the cycle, a little a frame.",
  "How far the stride carried the hips is kept as the clip's speed, in percent of standing hip height a second. A walker plays its loop at its ground speed over the clip's own, so a short walker and a tall one both keep their feet planted.",
  "Every clip keeps as few key poses as stay within 30 mm of the capture: 98 styles in 1,550 key poses, 12 mm off on average. A few styles reach past what the format holds (arms swung behind the back, legs kicked high) and fit looser.",
]
uses = [
  "Style-conditioned locomotion: 100STYLE was captured to train controllers that walk in any style (Mason, Starke and Komura, 2022).",
  "Crowds that do not all walk alike: townspeople with their own gaits in Assassin's Creed, Hitman and Watch Dogs.",
  "Motion matching: captured locomotion picked clip by clip as the character moves (For Honor, The Last of Us Part II).",
  "Matching playback to ground speed so feet do not slide: Unreal's stride warping, Unity's root motion.",
]
ask = [
  "an old man walking slowly through town",
  "a zombie walk for the monsters",
  "find a captured limp for a wounded guard",
  "translate the whole 100STYLE dataset",
  "stop the feet sliding when a character walks",
]
cost = "Each walker decodes one key pose a frame, like any clip. The 98 styles add 440 KB of readable text to the build; cutting them took the importer six seconds from 612 MB of BVH (266 MB downloaded)."
terms = ["motion capture", "gait cycle", "foot sliding", "key pose", "retargeting"]

[[learn.code]]
title = "Playing a walk loop as fast as the character moves"
file = "crates/pav_core/src/clips.rs"
lang = "rust"
src = '''
pub fn walk_rate(def: &PuppetDef, id: u32, ground_speed: f32) -> f32 {
    pace(def, id).map_or(1.0, |p| (ground_speed / p).clamp(0.4, 2.5))
}

pub fn pace(def: &PuppetDef, id: u32) -> Option<f32> {
    with(id, |c| c.speed).flatten().filter(|s| *s > 1.0).map(|s| s / 100.0 * hip_height(def))
}
'''

[[learn.code]]
title = "The best cycle: a stride whose end matches its start in pose and in speed"
file = "crates/pav_tools/src/mocap/takes.rs"
lang = "rust"
src = '''
if (sum[j + 1] - sum[i + 1]) / (j - i) as f64 >= typical / 2.0 {
    let cost = rms(&fr[i], &fr[j]) + 0.1 * rms4(&fr[i + 1], &fr[i - 1], &fr[j + 1], &fr[j - 1]) * src / 2.0
        + 0.002 * (j - i) as f64 / src;
    if best.is_none_or(|b| cost < b.0) {
        best = Some((cost, i, j));
    }
}
'''

