[layout.legend.'y']
blocks = [{ y0 = -0.5, y1 = 0, color = "#e8c13a" }]
[layout.legend.'k']
blocks = [{ y0 = -0.5, y1 = 0, color = "#22252d" }]
[layout.legend.'o']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9783c" }]
[layout.legend.'O']
blocks = [{ y0 = -0.5, y1 = 0, color = "#f0e3c6" }]
[layout.legend.'f']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3d424e" }, { y0 = 0, y1 = 1.0, color = "#8a7a66" }]

# The switch: view settings from a pad stay until you leave the room.
[layout.legend.'N']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3d424e" }]
zone = { kind = "pad", label = "DISTORTION ON", color = "#3bb273", params = { "view.distortion" = true } }
[layout.legend.'F']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3d424e" }]
zone = { kind = "pad", label = "DISTORTION OFF", color = "#e07a5f", params = { "view.distortion" = false } }

