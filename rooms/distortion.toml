#......................................#
#................kyykky................#
#............NNN.yykkyy.FFF............#
#............NNN.ykkyyk.FFF............#
#............NNN.kkyykk.FFF............#
#................kyykky................#
#......................................#
#......................................#
###################..###################
'''

# Plain dark floor and the 3 m wall.
[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3d424e" }]
[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#3d424e" }, { y0 = 0, y1 = 3.0, color = "#596073" }]

# Brick floor of the heat area and the lava ridge (0.45 m high stone with glowing lava objects on top).
[layout.legend.'r']
blocks = [{ y0 = -0.5, y1 = 0, color = "#8a7366" }]
[layout.legend.'R']
blocks = [{ y0 = -0.5, y1 = 0, color = "#4f423b" }]
[layout.legend.'L']
blocks = [{ y0 = -0.5, y1 = 0.45, color = "#2b1c17" }]

# Lens checker (cream / slate), pool tiles (two blues), hazard stripes, bomb range checker.
[layout.legend.'a']
blocks = [{ y0 = -0.5, y1 = 0, color = "#ebe6d6" }]
[layout.legend.'A']
blocks = [{ y0 = -0.5, y1 = 0, color = "#272c38" }]
[layout.legend.'p']
blocks = [{ y0 = -0.5, y1 = 0, color = "#2a68ad" }]
[layout.legend.'P']
