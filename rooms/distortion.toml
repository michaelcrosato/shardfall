# Heat & Shockwaves: screen distortion (heat haze, lenses, ripples, repeating shockwaves, bomb
# blasts) over patterned floors, since a warp only shows where the picture behind it has detail.
#   NORTH-WEST  lava strip (emissive floor objects, fire and embers, haze) and a forge
#   NORTH-EAST  five glass orbs with lens distortion +0.15 / +0.3 / +0.6 / -0.2 / -0.5 over a checker
#   MIDDLE      ripple pool + fountain, shockwave pads (period 1 / 2 / 3 s), bomb range
#   SOUTH       DISTORTION ON / OFF pads (view.distortion) next to a ring demo
name = "Heat & Shockwaves"
about = "Screen distortion warps the rendered image around a source: heat haze over lava and a forge, magnifying and shrinking glass orbs, rippling water, repeating shockwave rings and bomb blasts. Warps only show over detail, so every source stands in front of bricks, checkers or stripes."
try = [
  "Walk up to the lava strip and the forge: the bricks behind the rising heat shimmer",
  "Step on DISTORTION OFF (south), look at the ring demo, then step on DISTORTION ON",
  "Walk between the glass orbs: +0.15, +0.3 and +0.6 magnify the checker, -0.2 and -0.5 shrink it",
  "Stand next to the fountain pool and watch the water ripples distort the tiles",
  "Compare the 1 s, 2 s and 3 s shockwave pads over the stripes",
  "Throw bombs (F or left click) on the bomb range: each blast makes its own shockwave",
  "Bomb the crate stacks and barrels: the blast ring sweeps across the checker and shoves them",
  "Press F5 to reset the room and put the crates back",
]
wing = "vfx"
order = 4
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 62.0
distance = 17.0

# Dusk: dim sun and fill so the lava, forge and glass glow, bloom on, distortion on.
[view]
"light.sun_intensity" = 0.32
"light.ambient" = 0.75
"light.sun_elevation" = 38
sky = "#171c2e"
bloom = 0.55
distortion = true
particles = true

[layout]
origin = [-20.0, 0.0, -15.0]

[[layout.layer]]
y = 0
map = '''
########################################
#rRrRrRrRrRrRrRrRrRr.aAaAaAaAaAaAaAaAaA#
#RrRrRrRrRrRrRrRrRrR.AaAaAaAaAaAaAaAaAa#
#rLLLLLrLLLLLrRrRrRr.aAaAaAaAaAaAaAaAaA#
#RLLLLLRLLLLLRrRrRrR.AaAaAaAaAaAaAaAaAa#
#rRrRrRrRrRrRrRrRrRr.aAaAaAaAaAaAaAaAaA#
#RrRrRrRrRrRrRrRrRrR.AaAaAaAaAaAaAaAaAa#
#rRrRrRrRrRrRrRrRrRr.aAaAaAaAaAaAaAaAaA#
#RrRrRrRrRrRrRrRrRrR.AaAaAaAaAaAaAaAaAa#
#......................................#
#..........................ffffffffffff#
#pPpPpPpPpPpP.ykkyykkyykkyyfOoOoOoOoOoO#
#PpPpPpPpPpPp.kkyykkyykkyykfoOoOoOoOoOo#
#pPpPpPpPpPpP.kyykkyykkyykkfOoOoOoOoOoO#
#PpPpPpPpPpPp.yykkyykkyykkyfoOoOoOoOoOo#
