# Stacking & Toppling: stable stacks you can push, bomb and watch fall. Everything is a plain
# dynamic [[object]] (no scripts): boxes touch exactly (centre height = sum of heights below +
# half height) so the stacks stand on their own, and the room only needs rapier's friction.
#   NORTH  box tower, Jenga tower, pyramid, mixed-shape stack
#   MIDDLE a curving domino line (push the first one)
#   SOUTH  light vs heavy walls (west), a crate pile with DROP / CLEAR pads (east)
# Densities: 20 = very light, 50-100 = crates you can push, 400 = wood, so the heavy wall
# (400) shrugs off a 70 kg player while the light one (20) goes flying.
name = "Stacking & Toppling"
about = "Stable stacks and satisfying collapses with plain dynamic objects: a 10-box tower, a pyramid, a Jenga tower, a stack of mixed shapes, a curving domino line, light vs heavy walls, and a pad that rains crates into a pile. Push, bomb and rebuild."
try = [
  "Run into the box tower or the Jenga tower and watch it fall",
  "Throw bombs (F or left click at the cursor) at the pyramid and the mixed stack",
  "Push the first domino (the red one) and follow the chain reaction",
  "Compare the LIGHT wall (density 20) with the HEAVY wall (density 400): push, then bomb both",
  "Step on DROP CRATES for a shower of 20 crates; stack up to 120, then bomb the pile",
  "Step on CLEAR to remove all the dropped crates",
  "Reset the room with F5 to rebuild every stack",
]
wing = "physics"
order = 1
primary_device = "keyboard_mouse"
movement_model = "instant"
overlays = ["physics"]
entrance = { at = [16, 27], facing = "south" }

[camera]
tilt = 55.0
distance = 24.0

[layout]
origin = [-17.0, 0.0, -14.0]

[[layout.layer]]
y = 0
map = '''
##################################
#................................#
#................................#
#..ttttt..ttttt..ttttttt..ttttt..#
#..ttttt..ttttt..ttttttt..ttttt..#
#..ttttt..ttttt..ttttttt..ttttt..#
#..ttttt..ttttt..ttttttt..ttttt..#
#..ttttt..ttttt..ttttttt..ttttt..#
#................................#
#................................#
#................................#
#................................#
#................................#
#................................#
#................................#
#.........................DDD..CC#
#.........................DDD..CC#
#................................#
#................................#
#........................ffffffff#
#.tttttt.tttttt..........fppppppp#
#.tttttt.tttttt..........fppppppp#
#.tttttt.tttttt..........fppppppp#
#.tttttt.tttttt..........fppppppp#
#.tttttt.tttttt..........fppppppp#
#.tttttt.tttttt..........fppppppp#
#........................fppppppp#
################..################
'''

# Floor, wall (3 m), exhibit plates, the crate pen and its low fence, and the two pads.
[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }, { y0 = 0, y1 = 3.0, color = "#aeb7c2" }]

[layout.legend.'t']
blocks = [{ y0 = -0.5, y1 = 0, color = "#c3ccd6" }]

[layout.legend.'p']
blocks = [{ y0 = -0.5, y1 = 0, color = "#bfae92" }]

[layout.legend.'f']
blocks = [{ y0 = -0.5, y1 = 0, color = "#bfae92" }, { y0 = 0, y1 = 1.6, color = "#8f9fae" }]

# Pads: stepping on one sends its signal once. The spawner below listens to both.
[layout.legend.'D']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "DROP CRATES", color = "#3bb273", signal = "crates" }

[layout.legend.'C']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "CLEAR", color = "#e07a5f", signal = "clear" }


