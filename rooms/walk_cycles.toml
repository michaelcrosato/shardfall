# Player pads: walk params that revert when you leave the room. RESET restores every one of them.
[layout.legend.'S']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "TINY STEPS", color = "#4f7be0", params = { "puppet.stride" = 0.8 } }

[layout.legend.'B']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "BIG STRIDE", color = "#e07a5f", params = { "puppet.stride" = 2.5 } }

[layout.legend.'T']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "ON TWOS", color = "#8a52d6", params = { "puppet.anim_fps" = 12.0 } }

[layout.legend.'L']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "LONG LEGS", color = "#1fa5b8", params = { "puppet.leg_length" = 1.1 } }

[layout.legend.'G']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "GIANT", color = "#d4891c", params = { "puppet.scale" = 1.8 } }

[layout.legend.'R']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]
zone = { kind = "pad", label = "RESET", color = "#3bb273", params = { "puppet.stride" = 1.5, "puppet.anim_fps" = 0.0, "puppet.leg_length" = 0.78, "puppet.scale" = 1.0 } }

