# Walk Cycles: the biped puppet's procedural walk (stride, bob, arm swing, lean, foot IK) under a
# microscope. Every walker is a plain [[npc]] on a circle or a short patrol, so it never leaves its
# exhibit; the pads at the south change YOUR walk through `puppet.*` params until you leave the room.
#   NORTH-WEST  SPEED TRACK: three bipeds on circles at speed 0.2 / 0.5 / 1.0
#   NORTH-EAST  TREADMILL: a belt carries a biped back as fast as it walks
#   MIDDLE      PROPORTIONS (legs, head, scale) and STYLE OF WALK (bounce, stiff, swagger, on twos)
#   EAST        STAIRS (0.25 m rises) and a SLOPE: feet land on the surface (foot IK)
#   SOUTH       PLAYER PADS: TINY STEPS, BIG STRIDE, LONG LEGS, ON TWOS, GIANT, RESET
name = "Walk Cycles"
about = "The biped's procedural walk, side by side: three speeds on circles, different proportions and styles of walk (bouncy, stiff, swagger, on twos), feet finding the steps of a staircase and a slope, and a treadmill. Pads at the entrance change your own stride."
try = [
  "Compare STROLL, WALK and RUN on the speed track: stride, bob and arm swing grow with speed",
  "Look along the PROPORTIONS row: legs 0.5 / 1.1, a big head, a tiny and a giant walker move at the same speed with different gaits",
  "Compare BOUNCY, STIFF and SWAGGER, then ON TWOS (stepped 12 fps) next to SMOOTH",
  "Step on BIG STRIDE or TINY STEPS and run around: your stride length changes until you leave the room",
  "Step on LONG LEGS, GIANT or ON TWOS: the pads stack, so try BIG STRIDE + ON TWOS; RESET puts your walk back",
  "Walk up the staircase beside the patrol walker and watch both pairs of feet land on the steps",
  "Follow the SLOPE walker up and down the ramp: feet stay on the surface",
  "Stand next to the TREADMILL and watch the belt carry the walker back as fast as it walks",
]
wing = "animation"
order = 1
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 58.0
distance = 26.0

[layout]
origin = [-20.0, 0.0, -15.0]

[[layout.layer]]
y = 0
map = '''
########################################
#aaaaaaaaaaaaaaaaaaaaa..ppppppppppppppp#
#aaaaaaaaaaaaaaaaaaaaa..ppppppppppppppp#
#aaaaaaaaaaaaaaaaaaaaa..ppppkkkkkkkkkpp#
#aaaaaaaaaaaaaaaaaaaaa..ppppkEEEEEEEfpp#
#aaaaaaaaaaaaaaaaaaaaa..ppppkEEEEEEEfpp#
#aaaaaaaaaaaaaaaaaaaaa..ppppkkkkkkkkkpp#
#aaaaaaaaaaaaaaaaaaaaa..ppppppppppppppp#
#aaaaaaaaaaaaaaaaaaaaa..ppppppppppppppp#
#......................................#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbb.qqqqqqqqq#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbb.q1234321q#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbb.q1234321q#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbb.q1234321q#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbb.qqqqqqqqq#
#bbbbbbbbbbbbbbbbbbbbbbbbbbbb.qqqqqqqqq#
#......................................#
#cccccccccccccccccccccccccccc.rrrrrrrrr#
#cccccccccccccccccccccccccccc.rrrrrrrrr#
#cccccccccccccccccccccccccccc.rrrrrrrrr#
#cccccccccccccccccccccccccccc.rrrrrrrrr#
#cccccccccccccccccccccccccccc.rrrrrrrrr#
#cccccccccccccccccccccccccccc.rrrrrrrrr#
#......................................#
#......................................#
#.SSSS.BBBB.LLLL........TTTT.GGGG.RRRR.#
#.SSSS.BBBB.LLLL........TTTT.GGGG.RRRR.#
#......................................#
#......................................#
###################..###################
'''

# Map key:  # wall (3 m)  . floor  a b c p q r  exhibit plates  f fence (0.6 m)  k curb (0.2 m)  E treadmill belt (east)
#   1 2 3 4  stair blocks 0.25 / 0.5 / 0.75 / 1.0 m   S B L T G R  pads TINY STEPS / BIG STRIDE / LONG LEGS / ON TWOS / GIANT / RESET

[layout.legend.'.']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }]

[layout.legend.'#']
blocks = [{ y0 = -0.5, y1 = 0, color = "#d9d6cc" }, { y0 = 0, y1 = 3.0, color = "#aeb7c2" }]

[layout.legend.'a']
