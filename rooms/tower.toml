# The lift: a platform that rises to the first floor, waits, and comes back down.
[[object]]
name = "lift"
shape = { type = "box", half = [1.5, 0.15, 1.5] }
pos = [21.5, 0.15, 11.5]
color = "#7a8796"
body = "kinematic"
behavior = { type = "move", offset = [0.0, 3.2, 0.0], period = 9.0, hold = 0.35 }

# Duck corridor turrets at its east end, firing west along the corridor.
[[object]]
name = "turret_high"
shape = { type = "cylinder", half_height = 0.22, radius = 0.3 }
pos = [19.5, 4.9, 8.5]
yaw = -90.0
color = "#5b5f66"
body = "fixed"
behavior = { type = "emitter", pattern = "forward", interval = 0.9, speed = 7.0, radius = 0.16, range = 16.0, color = "#ff5a3c" }

[[object]]
