# Jointed Limbs: creatures that plant each foot and step when it falls behind (IK legs).
#   NORTH-WEST  spider pen (fenced, rocks and a stepped mound 0.2-0.4 m): normal, long-legged (1.2 m), tiny (0.6x)
#   NORTH-EAST  lizard run (two patrol lanes, one lizard with a 2.4 m tail) over a beetle row
#               (circle brains, 2 / 3 / 5 leg pairs = 4 / 6 / 10 legs)
#   MIDDLE      leg count (idle spiders with 1-6 leg pairs) and the PLAY AS pads (the pads change
#               the player's puppet.* settings: body plan, leg length, tail, ...; they revert when you
#               leave the room)
#   SOUTH       a yard with low steps where a lizard and a beetle follow you around
# Pads can only set numbers and choices (not colours), so you stay orange-and-blue in every body.
name = "Jointed Limbs"
about = "Creatures plant each foot and step only when it falls behind, so legs adapt to rocks and steps. Watch spiders, lizards and beetles walk, count legs, then become one yourself on the PLAY AS pads."
try = [
  "Step on PLAY AS SPIDER, then walk around: the posture changes to crawl and your feet plant on the floor",
  "Walk over the rocks in the spider pen (jump the low fence) and watch every leg find the step height",
  "Compare the normal, 1.2 m long-legged and tiny spiders: longer legs take fewer, bigger steps",
  "Follow the lizard run: the spine wiggles and diagonal legs step together; the orange lizard has a 2.4 m tail",
  "Count the beetles' legs (4 / 6 / 10) and the LEG COUNT spiders (1 to 6 pairs)",
  "Try the LIZARD, BEETLE, BLOB and GIANT SPIDER pads, then BACK TO HUMAN to restore the biped",
  "Run around the yard: the follower lizard and beetle trail you and climb the low steps",
  "Throw a bomb near a creature (F or click) to see it recoil",
]
wing = "animation"
order = 2
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 58.0
distance = 24.0

[params]
"movement.step_height" = 0.45

