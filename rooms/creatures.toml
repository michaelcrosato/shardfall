# Jointed Limbs: creatures that plant each foot and step when it falls behind (IK legs).
#   NORTH-WEST  spider pen (fenced, rocks and a stepped mound 0.2-0.4 m): normal, long-legged (1.2 m), tiny (0.6x)
#   NORTH-EAST  lizard run (two patrol lanes, one lizard with a 2.4 m tail) over a beetle row
#               (circle brains, 2 / 3 / 5 leg pairs = 4 / 6 / 10 legs)
#   MIDDLE      leg count (idle spiders with 1-6 leg pairs) and the PLAY AS pads (the pads change
#               the player's puppet.* settings: body plan, leg length, tail, ...; they revert when you
#               leave the room)
#   SOUTH       a yard with low steps where a lizard and a beetle follow you around
# Pads can only set numbers and choices (not colours), so you stay orange-and-blue in every body.
name = "Jointed Limbs"
about = "Creatures plant each foot and step only when it falls behind, so legs adapt to rocks and steps. Watch spiders, lizards and beetles walk, count legs, then become one yourself on the PLAY AS pads."
try = [
  "Step on PLAY AS SPIDER, then walk around: the posture changes to crawl and your feet plant on the floor",
  "Walk over the rocks in the spider pen (jump the low fence) and watch every leg find the step height",
  "Compare the normal, 1.2 m long-legged and tiny spiders: longer legs take fewer, bigger steps",
  "Follow the lizard run: the spine wiggles and diagonal legs step together; the orange lizard has a 2.4 m tail",
  "Count the beetles' legs (4 / 6 / 10) and the LEG COUNT spiders (1 to 6 pairs)",
  "Try the LIZARD, BEETLE, BLOB and GIANT SPIDER pads, then BACK TO HUMAN to restore the biped",
  "Run around the yard: the follower lizard and beetle trail you and climb the low steps",
  "Throw a bomb near a creature (F or click) to see it recoil",
]
wing = "animation"
order = 2
primary_device = "keyboard_mouse"
movement_model = "instant"
entrance = { at = [19, 29], facing = "south" }

[camera]
tilt = 58.0
distance = 24.0

[params]
"movement.step_height" = 0.45

# Station guide (H in the game): what you see, how it works, where games use it, how to ask.
[learn]
what = "Spiders, lizards and beetles whose feet stay planted on the ground and step only when they fall behind. In the SPIDER PEN a normal, a 1.2 m long-legged and a tiny spider wander over rocks and a stepped mound; the LIZARD RUN has two patrolling lizards (the orange one drags a 2.4 m tail) above the BEETLE ROW with 4, 6 and 10 legs, and LEG COUNT lines up spiders with 1 to 6 pairs. The PLAY AS pads turn you into each creature, and two FOLLOWERS trail you round the yard."
how = [
  "Each leg has a rest spot beside the body. A planted foot stays fixed in the world while the body moves on, so it falls further and further behind.",
  "When a foot is more than 30% of the leg's reach from its target (6 cm when standing still), it wants to step. The target is the rest spot pushed ahead along the body's velocity by about one step's time, so feet land where the body is going.",
  "The furthest-behind foot goes first, but a foot may not lift while its partner on the other side or its neighbour on the same side is in the air, unless it is stretched to 90% of its reach. That one rule makes the gaits: lizards end up stepping in diagonal pairs and spiders never lift more than half their legs.",
  "A step is a short flight: the foot slides from its old to its new spot over puppet.step_time seconds on an ease-in-out curve, lifted along a half sine wave. A ray cast down at the new spot finds the ground, so feet land on rocks and steps.",
  "The body rides above the feet: its height follows their average and it pitches and rolls to match front against back and left against right. Each leg is drawn with two-bone IK (inverse kinematics: the knee is worked out from hip and foot), knees up and out. Lizards also have a 6-point spine that follows the head, with the hips riding on it.",
]
uses = [
  "Spore: creatures built in the editor with any number of legs all walk procedurally, because no animator could key every design.",
  "Rain World: the lizards' bodies, legs and tails are placed by rules every frame rather than played from keyframes.",
  "Grow Home: the robot BUD's wobbly walk and climb are procedural, placed limb by limb.",
  "Bestiaries on a budget: one rig gives many leg counts, sizes and step speeds from a few numbers, like the beetles and LEG COUNT spiders here.",
]
ask = [
  "procedural spider legs that plant and step on uneven ground",
  "creature feet with IK that adapt to rocks and steps",
  "lizard with a wiggling spine and a diagonal gait",
  "any number of legs from one rig (4, 6, 10 legs)",
  "let the player switch body plan and play as a spider",
]
cost = "CPU and small: one short ray cast per foot each time it starts a step, and a two-bone IK solve per leg when drawing. The GPU draws two rounded cones per leg in the same instanced draw as everything else, so a 10-legged beetle only adds a few more shapes than a 4-legged one."
knobs = ["puppet.body", "puppet.legs", "puppet.leg_length", "puppet.step_time", "puppet.step_height", "puppet.body_length"]
terms = ["procedural animation", "ik", "raycast", "verlet", "secondary motion", "interpolation"]

[[learn.code]]
title = "Which feet step: the furthest behind, never two neighbours at once"
file = "crates/pav_core/src/rig.rs"
lang = "rust"
src = """
let lead = hv * step_time * 1.1;
let thresh = if speed > 0.2 { reach * 0.3 } else { 0.06 };
    // ...
    let target = feet + rot * lay.legs[i].1 + lead;
    let d = Vec2::new(f.pos.x - target.x, f.pos.z - target.z).length();
    if d > thresh {
        want.push((i, d, target));
    }
// ...
want.sort_by(|a, b| b.1.total_cmp(&a.1).then(a.0.cmp(&b.0)));
for (i, d, target) in want {
    let lifted = |j: usize| self.feet.get(j).is_some_and(|f| f.t >= 0.0);
    let (pair, side) = (i / 2, i % 2);
    let partner = pair * 2 + (1 - side);
    let blocked = lifted(partner) || (pair > 0 && lifted((pair - 1) * 2 + side)) || lifted((pair + 1) * 2 + side);
    if blocked && d < reach * 0.9 {
        continue;
    }
    let y = ground(target).unwrap_or(feet.y);
    let f = &mut self.feet[i];
    f.from = f.pos;
    f.to = Vec3::new(target.x, y, target.z);
    f.t = 0.0;
}
"""

[[learn.code]]
title = "A step: an eased slide with a half-sine lift"
file = "crates/pav_core/src/rig.rs"
lang = "rust"
src = """
if f.t >= 0.0 {
    f.t += dt / step_time;
    let s = f.t.min(1.0);
    let e = s * s * (3.0 - 2.0 * s);
    f.pos = f.from.lerp(f.to, e) + Vec3::Y * (s * PI).sin() * def.step_height * def.scale * 1.4;
    if f.t >= 1.0 {
        f.pos = f.to;
        f.t = -1.0;
        landed += 1;
    }
}
"""

[[learn.code]]
title = "Two-bone IK by the law of cosines"
file = "crates/pav_core/src/puppet.rs"
lang = "rust"
src = """
/// Two-bone IK: returns the joint (knee/elbow) position.
pub(crate) fn ik(root: Vec3, target: Vec3, l1: f32, l2: f32, bend: Vec3) -> (Vec3, Vec3) {
    let mut d = target - root;
    let dist = d.length().max(1e-4);
    let reach = (l1 + l2) * 0.999;
    let target = if dist > reach {
        d = d / dist * reach;
        root + d
    } else {
        target
    };
    let dist = d.length().max(1e-4);
    let dir = d / dist;
    // Law of cosines: distance along dir to the joint's projection, and its offset.
    let a = (l1 * l1 - l2 * l2 + dist * dist) / (2.0 * dist);
    let h = (l1 * l1 - a * a).max(0.0).sqrt();
    let side = (bend - dir * bend.dot(dir)).normalize_or(Vec3::Z);
    (root + dir * a + side * h, target)
}
"""

